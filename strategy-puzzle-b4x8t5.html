<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="学びのつまずきに、自己調整学習の方略を組み合わせてぶつけるパズルゲーム。遊ぶ前に見立て、遊んだ後にふり返ります。">
<!-- ホーム画面に追加して起動したときだけ全画面になる（Safariで普通に開くときは何も変わらない） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="方略パズル">
<title>方略パズル ｜ AK-Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{ --win:#0a0e23; --gold:#F59E0B; --purple:#7C3AED; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
   user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* iOS Safari 対策：ページ本体は動かさない。指の操作はゲームの中だけで完結させる */
html{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{font-family:"DotGothic16","Zen Maru Gothic",sans-serif;background:#14101f;color:#fff;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100%;max-width:460px;height:100%;height:100dvh;max-height:900px;background:#0d0a18;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 6px #1c1730,0 20px 40px rgba(0,0,0,.5)}
@media (min-width:481px) and (min-height:700px){ #stage{border-radius:18px} }
canvas{image-rendering:pixelated}

.dqwin{background:var(--win);border:3px solid #fff;border-radius:8px;box-shadow:0 0 0 3px var(--win);color:#fff;font-family:"DotGothic16",monospace}
button{font-family:"DotGothic16",monospace;color:#fff;background:var(--purple);border:3px solid #fff;border-radius:10px;padding:11px 20px;font-size:14px;box-shadow:0 4px 0 #4c1d95;cursor:pointer}
button.gold{background:var(--gold);box-shadow:0 4px 0 #8a5a06}
button:active{transform:translateY(3px);box-shadow:none}
button:disabled{opacity:.45}

/* ことば切替（つねに右上） */
#bgmToggle{position:absolute;top:8px;right:8px;z-index:60;width:32px;height:32px;padding:0;font-size:15px;
  background:#171531;border:2px solid #6b7399;box-shadow:none;border-radius:8px;color:#c3c9e8;line-height:1}
#bgmToggle.on{border-color:var(--gold);color:#ffe9b8;background:#3a2a05}
#wordToggle{position:absolute;top:8px;right:46px;z-index:60;font-size:10px;padding:6px 10px;background:#171531;border:2px solid #6b7399;box-shadow:none;border-radius:8px;color:#c3c9e8}
#wordToggle.easy{border-color:var(--gold);color:#ffe9b8;background:#3a2a05}

.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.screen.on{display:flex}
.pad{padding:16px 14px 22px}
.phasechip{display:inline-block;font-size:11px;padding:5px 10px;border-radius:6px;border:2px solid #fff;letter-spacing:.08em;white-space:nowrap;flex:0 0 auto}
.ph-mi{background:#2563EB}.ph-ji{background:#16A34A}.ph-fu{background:#EA580C}
h2.ttl{font-size:17px;line-height:1.7;margin:10px 0 4px}
.lead{font-size:11.5px;line-height:1.95;color:#c3c9e8;margin-bottom:10px}
.lead b{color:#ffd54a}

/* タイトル */
/* v9.7 CEOご指摘：はじめの画面の上部が かぶる。
   justify-content:center は、中身が画面より高いと 上が画面の外へ はみ出して スクロールでも届かない
   （ロゴ「方略パズル」が見えなくなっていた）。上から並べ、右上のボタン（ことば・音）ぶんの余白をとる。 */
#scTitle{align-items:center;justify-content:flex-start;text-align:center;padding:54px 24px 24px}
#scTitle .logo{font-size:30px;letter-spacing:.1em;color:var(--gold);text-shadow:0 4px 0 #6b3d00;line-height:1.5}
#scTitle .sub{font-size:12px;color:#c3c9e8;margin:10px 0 4px;line-height:2}
.record{width:100%;max-width:290px;padding:9px 11px;margin:6px 0 2px;font-size:10.5px;line-height:1.7;text-align:left}
.record .rtop{display:flex;align-items:center;gap:10px}
/* つぎの すがた（まだ手に入れていないので、かげにして見せる） */
.nextsp{display:flex;align-items:center;gap:7px;margin-top:2px}
.nextsp .nspcv{flex:0 0 auto;display:inline-flex;align-items:center}
.nextsp .nspcv canvas{filter:brightness(.3) saturate(.2);opacity:.85}
.record .rhead{font-size:10px;color:#ffd54a;letter-spacing:.06em;margin-bottom:4px}
.rlv{display:block;font-size:13px;color:#ffd54a;line-height:1.5}
.rsub{display:block;font-size:9.5px;color:#a9b0d6;margin-top:2px;line-height:1.6}
.rbar{display:block;height:9px;background:#241f3d;border:2px solid #4b5484;border-radius:5px;overflow:hidden;margin-top:6px}
.rfill{display:block;height:100%;background:linear-gradient(90deg,#F59E0B,#FDE68A);width:0;transition:width .6s ease}
.rttl{display:inline-block;font-size:9.5px;background:#3a2a05;border:1px solid #F59E0B;color:#ffe9b8;border-radius:5px;padding:1px 6px;margin:4px 4px 0 0}
.endsp{display:flex;justify-content:center;margin:12px 0 2px}
.endsp.pop2{animation:pop2 .7s ease}
@keyframes pop2{0%{transform:scale(.4);opacity:0}55%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.ptrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:4px 2px;border-bottom:1px dashed #3b4370;line-height:1.6}
.ptrow b{color:var(--gold)}
.ptrow.tot{border-bottom:none;border-top:2px solid #4b5484;margin-top:3px;padding-top:6px;font-size:12.5px}
.reward{border:2px solid #F59E0B;background:#2a2005;border-radius:8px;padding:9px 10px;margin-top:12px;font-size:11px;line-height:1.8}
.palrow{display:flex;align-items:center;gap:10px;border:2px solid #4b5484;border-radius:8px;background:#141230;padding:7px 9px;margin-bottom:7px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.dexcell{border:2px solid #3b4370;border-radius:7px;padding:6px 5px;font-size:8.5px;line-height:1.45;background:#141230;color:#6f77a0;min-height:52px}
.dexcell.got{background:#1d1b3d;color:#fff;border-color:#6b7399}
.dexcell .dc{display:block;font-size:7.5px;margin-bottom:3px;opacity:.9}
.dexcell .dstamp{float:right;color:#F59E0B}
.dexcell .dname{display:block}
.dexcell .demb{display:block;margin-top:4px;line-height:0}
.dexcell.got .demb canvas{filter:drop-shadow(0 0 4px rgba(245,200,66,.45))}
.trophycell{display:flex;align-items:center;gap:10px}
.trophycell .trwrap{flex:0 0 auto;line-height:0}
.trophycell .trtxt{flex:1;min-width:0;text-align:left}
.trophycell.got .trwrap canvas{filter:drop-shadow(0 0 6px rgba(245,200,66,.55))}
/* もらった称号（トロフィーと ことばを よこに ならべる） */
.trgot{display:flex;align-items:center;gap:10px;margin-top:8px;text-align:left}
.trgot .trgotcv{flex:0 0 auto;display:inline-flex;filter:drop-shadow(0 0 10px rgba(245,200,66,.45))}
/* 自分モンスターの5段階（ずかんの中のならび） */
.lvline{display:flex;gap:3px;justify-content:space-between;margin:10px 0 4px}
.lvone{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px 1px;border:2px solid transparent;border-radius:8px;min-width:0}
.lvone .lvname{font-size:7.5px;line-height:1.35;color:#8d95bd;text-align:center;letter-spacing:0;word-break:break-all}
.lvone.now{border-color:#F5C842;background:#1a1533}
.lvone.now .lvname{color:#ffd54a}
.lvone.yet canvas{filter:brightness(.32) saturate(.2)}
.stampwrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.stampone{display:flex;flex-direction:column;align-items:center;width:74px;line-height:0}
.stampone canvas{filter:drop-shadow(0 0 5px rgba(245,200,66,.5));animation:stamppop .5s ease both}
.stampname{display:block;font-size:8px;line-height:1.4;color:#c3c9e8;margin-top:3px;text-align:center}
@keyframes stamppop{0%{opacity:0;transform:scale(.4) rotate(-12deg)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.entry{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%;max-width:290px}
button.sub{background:#171531;border-color:#6b7399;box-shadow:0 4px 0 #0b0a1c;font-size:12.5px;padding:10px 14px;color:#c7cdea}
.entrynote{font-size:9.5px;color:#7d85ad;line-height:1.8;margin-top:2px}
.tutohead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:176px;flex-wrap:wrap}
button.skip{background:transparent;border:2px solid #4b5484;box-shadow:none;font-size:10px;padding:5px 9px;color:#9aa3c7;border-radius:7px}
.optrow{display:flex;gap:8px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
.opt{font-size:11.5px;padding:9px 14px;border:2px solid #6b7399;border-radius:8px;background:#171531;color:#aab2d8;cursor:pointer}
.opt.on{border-color:var(--gold);background:#3a2a05;color:#ffe9b8}
.catlegend{display:flex;gap:6px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.clg{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:#c3c9e8;width:66px;line-height:1.4}
.catlegend{gap:2px}

/* カード */
.cardbtn{display:block;width:100%;text-align:left;padding:11px 12px;margin-bottom:9px;font-size:12.5px;line-height:1.7;background:#171531;border:3px solid #4b5484;box-shadow:0 4px 0 #0b0a1c}
.cardbtn.sel{border-color:var(--gold);background:#2a2140}
.cchip{display:inline-block;font-size:9.5px;padding:2px 7px;border-radius:5px;margin-right:6px;vertical-align:1px}
/* つよく けす コツ（もちもの画面） */
.tips{margin-top:9px;padding:9px 11px;background:#141229;border:2px solid #3b4370;border-radius:9px;
  font-size:10.5px;line-height:1.85;color:#c3c9e8;text-align:left}
.tips>b{display:block;font-size:11px;color:#ffd54a;margin-bottom:4px}
.tips b{color:#ffd54a}
.tips .tipspt{margin-top:6px;padding-top:6px;border-top:1px dashed #3b4370;font-size:9.5px;color:#98a0c8}
.tips .tipspt b{color:#98a0c8}
.rolerow{margin-top:5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
/* ボスの中から聞こえる声（みたての手がかり） */
.serif .voice{display:block;margin-top:7px;padding-top:6px;border-top:1px dashed #4b5484;color:#ffd08a;font-size:11.5px;line-height:1.7}
.cname{font-size:13.5px;color:#fff;display:block;line-height:1.65}
.cofficial{display:block;font-size:9.5px;color:#98a0c8;margin-top:6px;line-height:1.6}
.cfull{display:block;font-size:10px;color:#a9b0d6;margin-top:5px;line-height:1.7}
/* めあて選びのカード（v8.6）
   ことばを左、なかまの絵を右。えらぶ手がかりの「めあて」を一番大きく出す。 */
.goalrow{display:flex;align-items:flex-start;gap:10px}
.goalmain{flex:1;min-width:0}
.goalchara{width:52px;flex:0 0 auto;text-align:center;padding-top:2px}
.goalq{display:block;font-size:14.5px;color:#ffd08a;line-height:1.6;margin-bottom:7px;font-weight:bold}
#goalList .cname{font-size:15px;line-height:1.6}
#goalList .cfull,#goalList .cofficial{font-size:10.5px;line-height:1.75}

/* れんしゅう */
#scTuto .pad{padding:14px}
#tutoBoard{position:relative;margin:10px auto 0;touch-action:none}
.tutobox{font-size:12px;line-height:1.95;padding:11px 12px;margin-top:12px}
.tutobox b{color:#ffd54a}
.tutostep{font-size:10px;color:#8d95bd;letter-spacing:.1em}
#tutoArrow{position:absolute;z-index:15;width:28px;height:28px;line-height:28px;text-align:center;font-size:24px;color:#ffd54a;pointer-events:none;
  text-shadow:0 0 8px #000,0 0 14px #F59E0B,0 2px 0 #000;animation:bob .8s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.ring{position:absolute;z-index:14;border:3px dashed #ffd54a;border-radius:14px;pointer-events:none;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}

/* みたて */
.enemyline{display:flex;gap:10px;align-items:flex-start;margin:8px 0 12px}
.serif{flex:1;font-size:12.5px;line-height:1.95;padding:10px 11px}
.serif .who{font-size:10px;color:#ffd08a;display:block;margin-bottom:4px}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catbtn{padding:10px 8px;font-size:11.5px;line-height:1.6;border:3px solid #4b5484;background:#171531;box-shadow:0 4px 0 #0b0a1c;text-align:center}
.catbtn .cn{display:block;font-size:13px;margin-top:4px}
.catbtn .cd{display:block;font-size:9.5px;color:#a9b0d6;margin-top:4px;line-height:1.6}

/* バトル */
#scBattle{display:none;flex-direction:column;height:100%}
#scBattle.on{display:flex}
.btop{flex:0 0 auto;padding:8px 10px 4px}
.btopbar{display:flex;justify-content:flex-start;align-items:center;gap:10px;font-size:10.5px;padding-right:176px;flex-wrap:nowrap;overflow:hidden}
.hpwrap{margin-top:6px}
.hplabel{display:flex;justify-content:space-between;font-size:10.5px;color:#dfe3f7;margin-bottom:3px}
.hpbar{height:12px;background:#241f3d;border:2px solid #fff;border-radius:6px;overflow:hidden}
.hpfill{height:100%;background:linear-gradient(90deg,#f43f5e,#fb7185);transition:width .35s ease}
.emid{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;min-height:96px;
  background:linear-gradient(180deg,#0d0a18 0%,#171130 42%,#241a48 68%,#33265e 88%,#3d2f6b 100%);
  border-bottom:3px solid #2b2350;box-shadow:inset 0 -14px 26px -12px rgba(0,0,0,.9)}
/* v9.1：つまずきの場所を2列に。左＝リーダーバッジ＋つまずきの絵、右＝はなし欄。
   ことばが絵を隠さないようにし、絵は左の列いっぱいに大きく出す。 */
/* v9.3 CEOご要望：モンスターは まん中。ことばは 四すみに出て、多いときは モンスターに かぶってよい */
#enemyCv{display:block}
.emid.shake{animation:shk .3s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hearts{font-size:12px;letter-spacing:0;color:#ffd0da;display:inline-flex;align-items:center;gap:6px;position:relative;white-space:nowrap}
.hearts .hpbar{display:inline-block;width:64px;height:8px;background:#241f3d;border:1px solid #6b7399;border-radius:4px;overflow:hidden;vertical-align:middle}
.hearts .hpfill{display:block;height:100%;transition:width .35s}
.hurtpop{position:absolute;right:-40px;top:-2px;font-size:16px;font-weight:bold;color:#ff5f5f;text-shadow:0 0 8px #ff5f5f;animation:hurtpop 1.1s ease-out forwards;pointer-events:none}
@keyframes hurtpop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-16px)}}
.hurtpop.heal{color:#86efac;text-shadow:0 0 8px #86efac}
.floatmsg{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:12.5px;color:#ffe9b8;pointer-events:none;padding:0 8px}
/* v9.0：なかまの ことばが長くなったので、左上のリーダーバッジを避けて 右側に置く。読みやすいよう うすい下地 */
/* v9.1：ことばは 右上の「はなし」欄に 上から たまる。タイマーでは消えない（つぎの操作で消える） */
.talk{display:contents}
/* 右上：つまずきの声・こうげきの なりゆき */
#eSerif{position:absolute;left:122px;right:8px;top:8px;z-index:7;max-height:56%;overflow:hidden;pointer-events:none}
@media (max-height:720px){ #eSerif{font-size:10.5px;line-height:1.5} .leadersay{font-size:10px} .characut .cutxt{font-size:10px} .grabname{height:22px} .timerhint{margin-top:2px} }
#eSerif{text-align:left;font-size:11.5px;line-height:1.55;padding:6px 9px;
  background:rgba(10,14,35,.82);border-radius:8px;border:1px solid #3b4370}
#eSerif:empty{display:none}
.combotxt{position:absolute;left:0;right:0;top:32%;text-align:center;font-size:24px;color:#fff;text-shadow:0 0 14px #F59E0B,0 3px 0 #8a5a06;opacity:0;pointer-events:none}
.dmgtxt{position:absolute;right:12px;top:14%;text-align:right;font-size:20px;color:#ffd54a;text-shadow:0 2px 0 #6b3d00,0 0 8px #000;opacity:0;pointer-events:none}
.timerwrap{flex:0 0 auto;padding:0 10px 5px}
.timerbar{height:9px;background:#241f3d;border:2px solid #fff;border-radius:5px;overflow:hidden}
.timerfill{height:100%;width:100%;background:linear-gradient(90deg,#22d3ee,#a3e635)}
.timerhint{font-size:10px;color:#9aa3c7;text-align:center;margin-top:4px;height:14px}
.grabname{flex:0 0 auto;height:26px;margin:0 8px 4px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:11.5px;line-height:1.3;color:#fff;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);
  border-radius:8px;overflow:hidden;white-space:nowrap;transition:background .15s,border-color .15s}
.grabname.on{background:rgba(255,255,255,.12)}
.grabname .gdot{width:12px;height:12px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(255,255,255,.7)}
.grabname .gcat{font-size:9.5px;color:#c3c9e8;flex:0 0 auto}
.grabname .gname{overflow:hidden;text-overflow:ellipsis}
#tutoGrab{margin:8px 0 0;height:26px}
#boardWrap{flex:0 0 auto;position:relative;margin:0 auto;touch-action:none;-webkit-user-drag:none}
/* iOSは画面の左右のふちから指を滑らせると「前のページへ戻る」が働く。
   パズル中にそれが起きると、ゲームが止まって別の画面に変わってしまう。
   ふちに透明な帯を置き、そこから始まる指の動きは受け止めて無効にする。 */
/* 右上の「ことば切替」「♪」を隠さないよう、上から56px下だけを守る */
.edgeguard{position:fixed;top:56px;bottom:0;width:26px;z-index:80;background:transparent;
  touch-action:none;pointer-events:none;display:none}
.edgeguard.on{display:block;pointer-events:auto}
#edgeL{left:0} #edgeR{right:0}
.drop{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;transition:transform .13s linear;will-change:transform}
.drop canvas{display:block;border-radius:22%}
.drop.held canvas{box-shadow:0 0 0 3px #fff,0 0 16px #fff;opacity:.9}
.drop.pop{animation:pop .22s ease forwards}
@keyframes pop{0%{transform:scale(1)}60%{transform:scale(1.3);filter:brightness(2)}100%{transform:scale(0);opacity:0}}
.deckbar{flex:0 0 auto;display:flex;gap:3px;padding:5px 8px 8px;justify-content:center}
.dchip{flex:1;font-size:8px;line-height:1.3;text-align:center;padding:3px 2px 4px;border-radius:6px;border:2px solid rgba(255,255,255,.5);color:#fff;min-width:0;overflow:hidden}
.dchip .dsp{display:flex;justify-content:center;margin-bottom:1px}
.dchip.hop{animation:hop .45s ease}
@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-9px) scale(1.08)}60%{transform:translateY(0)}80%{transform:translateY(-3px)}100%{transform:translateY(0)}}
.leaderbadge{position:absolute;left:8px;top:6px;display:flex;align-items:center;gap:6px;z-index:7;
  background:rgba(10,14,35,.72);border:2px solid #F59E0B;border-radius:9px;padding:3px 9px 3px 4px;pointer-events:none}
.leaderbadge .lb{font-size:9px;color:#ffd54a;line-height:1.5;text-align:left}
/* リーダーのひとこと（バッジのすぐ下に出る吹き出し） */
/* 右下：リーダーのひとこと */
.leadersay{display:none;position:absolute;right:8px;bottom:6px;max-width:calc(50% - 12px);z-index:8;padding:6px 9px;font-size:10.5px;line-height:1.65;color:#dfe3f7;text-align:left;

<script>
/* ============================================================
   方略パズル　v9.8（制作：木村明憲）
   v2の主眼＝入口をやさしくする
     ①はじめに「1手だけ動かす」れんしゅうを置き、説明を後ろに回す
     ②カテゴリー名を子どものことばに（しらべる／たしかめる／やる気／じゅんび／きもち）
     ③カードは「やさしい一言」を大きく、正式な方略名は小さく必ず併記
     ④専門語の言いかえ（リーダー→きょうのいちばん／デッキ→もちもの／みたて→どれがきくかな？）
     ⑤「やさしいことば／くわしいことば」の切替を全画面に用意
   ・カードの名称・説明文・問いは公開版 self.html（全46枚）と完全一致（機械照合済み）
   ・画像／音声ファイルは使わない（ドット絵は文字列から描画、SFXはWebAudio合成）
   ============================================================ */

/* ---------- カテゴリー（＝ドロップの色） ---------- */
/* 5つのなかま＝5つの攻撃タイプ。それぞれにキャラクターがいる。
   口ぐせは CEO のことばをもとに、そのカテゴリーの中身（サブプロセス）をなぞる形にした。
   1手ごとに順ぐりに出るので、遊ぶうちに「そのなかまが何をする子か」が自然に入る。 */
const CATS = [
  {key:'認知',        easy:'わかる',     color:'#2563EB', dark:'#14337a', hint:'あつめて つなげて、わかる！',
   chara:'ミッケ', pal:'pal0',
   linesE:['あつめる！ しらべて 知ろう','つなげる！ 集めたことを 結ぼう','いろんな 見方で 見てみよう','くみ立てる！ 考えを かたちに'],
   linesF:['情報を収集して、理解を深める','集めた情報を関連づける','情報を多面的に見る','考えを構造化する']},
  {key:'メタ認知',    easy:'ふりかえる', color:'#16A34A', dark:'#0d5c28', hint:'これで いい？ と ふりかえる',
   chara:'ミハリ', pal:'pal1',
   linesE:['これで いい？','うまく いってる？','気もちも のってる？','時間、だいじょうぶ？'],
   linesF:['めあてと、いまの学習はずれていないか','いまのやり方は、適切か','気持ちは、学習に向かっているか','時間と進み具合は、どうか']},
  {key:'動機づけ調整',easy:'やる気',     color:'#EA580C', dark:'#7c2d12', hint:'自分は できる！ を つくる',
   chara:'メラ',   pal:'pal2',
   linesE:['自分は できる！','できたら こんな いいことが ある','むずかしいのは チャンス！'],
   linesF:['自分ならできる、と自己効力を高める','解決後にできることを思いうかべる','困難を、やりがいのある挑戦と捉える']},
  {key:'リソース管理',easy:'どうぐ',     color:'#0891B2', dark:'#0a4d5e', hint:'時間も 場所も、学びの どうぐ',
   chara:'トキリ', pal:'pal3',
   linesE:['見通し、もった？','時間は？','まわりは ととのってる？'],
   linesF:['やり方を決めて、準備をする','時間配分を決める・調節する','学習環境（物的・人的）をととのえる']},
  {key:'情動調整',    easy:'きもち',     color:'#DB2777', dark:'#701a3c', hint:'自分の きげんを 自分で とる',
   chara:'ホワリ', pal:'pal4',
   linesE:['自分の きげんは 自分で とる','なんで いやなのか、考えてみる','気もちを 切りかえよう'],
   linesF:['自分の機嫌は、自分でとる','不快な感情の原因や理由を考え、調節する','気持ちを切りかえる方法を考え、調節する']},
];
/* 口ぐせは順ぐりに出す（同じ台詞のくり返しにしない） */
const LINE_I={};
function charaLine(ci,advance){
  const c=CATS[ci], arr=G.easy?c.linesE:c.linesF;
  if(advance) LINE_I[ci]=((LINE_I[ci]||0)+1)%arr.length;
  return arr[(LINE_I[ci]||0)%arr.length];
}
/* なかまのスプライトを作る */
function charaSprite(ci,size){ const c=CATS[ci]; return monSprite(c.pal,c.pal,size); }
const CI = {}; CATS.forEach((c,i)=>CI[c.key]=i);

/* ---------- 実カードデータ（self.html の46枚と完全一致）＋やさしい一言（本作で追加） ---------- */
const CARD = {
  分けて理解　　:{title:'課題を分けて理解する', full:'課題を分解し，それらの関係を考え，解決策を検討して課題の意味を正確に理解する', cat:'認知', phase:'見通す', q:'課題が難しくて理解しづらいときはどうする?', easy:'大きい もんだいを 小さく 分けて 考える'},
  知ってること　:{title:'知っていることを振り返る', full:'課題をもとに身近なこと，知っていることを振り返る', cat:'メタ認知', phase:'見通す', q:'課題を身近に感じるにはどうする?', easy:'しっている ことを 思い出す'},

function tone(freq,dur,type='square',vol=0.07,when=0,slideTo=null){
  const a=ac(); if(!a) return;
  const t0=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.linearRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+0.02);
}

const BGM={
  on:true, name:null, t:null, step:0, nextT:0, timer:null, gain:null, noise:null,
  init(){
    const a=ac(); if(!a||this.gain) return;
    this.gain=a.createGain(); this.gain.gain.value=0.085; this.gain.connect(a.destination);
    const n=a.createBuffer(1,a.sampleRate*0.4,a.sampleRate), d=n.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    this.noise=n;
  },
  setOn(v){ this.on=v; const o=loadSave(); o.bgm=v?1:0; putSave(o);
    if(!v) this.halt(); else if(this.name){ const n=this.name; this.name=null; this.play(n); } },
  play(name){
    if(!this.on || this.name===name) return;
    const a=ac(); if(!a) return;
    if(a.state==='suspended') a.resume();
    this.init(); this.halt();
    this.name=name; this.t=TRACKS[name]; this.step=0; this.nextT=a.currentTime+0.06;
    this.timer=setInterval(()=>this.tick(),25);
  },
  halt(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  stop(){ this.halt(); this.name=null; },
  tick(){
    const a=ac(); if(!a||!this.t) return;
    const sp=60/this.t.bpm/2;               // 8分音符の長さ（秒）
    let guard=0;
    while(this.nextT < a.currentTime+0.14 && guard++<64){
      /* 1音でつまずいても曲全体が止まらないようにする */
      try{ this.at(this.step,this.nextT,sp); }catch(err){}
      this.nextT+=sp; this.step=(this.step+1)%this.t.mel.length;
    }
  },
  at(i,t,sp){
    const T=this.t, g=this.gain, a=ac();
    const m=T.mel[i];
    if(m!=null) this.voice(hz(m),t,sp*1.7,'square',0.20*T.vol,0.35);
    const bar=Math.floor(i/8), sl=i%8;
    const r=T.roots[bar%T.roots.length], third=T.qual[bar%T.qual.length]?3:4;
    if(T.bass8) this.voice(hz(sl%2?r+12:r),t,sp*0.95,'triangle',0.26*T.vol,0.5);    // 8分で走るベース
    else if(sl%2===0) this.voice(hz(sl===4?r+7:r),t,sp*1.5,'triangle',0.30*T.vol,0.5);   // ベース
    /* すきまを埋めるアルペジオ（ノリを出す層） */
    const deg=[0,third,7,third][sl%4];
    this.voice(hz(r+12+deg),t,sp*0.9,'square',0.085*T.vol,0.45);
    if(T.kick[sl]) this.drum(t,'kick',T.vol);
    if(T.snare[sl]) this.drum(t,'snare',T.vol);
    if(T.hat[sl]) this.drum(t,'hat',T.vol);
  },
  voice(f,t,dur,type,vol,rel){
    const a=ac(), o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur*rel+0.02);
    o.connect(g).connect(this.gain); o.start(t); o.stop(t+dur+0.05);
  },
  drum(t,kind,vol){
    const a=ac();
    if(kind==='kick'){
      const o=a.createOscillator(), g=a.createGain();
      o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+0.11);
      g.gain.setValueAtTime(0.5*vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g).connect(this.gain); o.start(t); o.stop(t+0.16); return;
    }
    const src=a.createBufferSource(); src.buffer=this.noise;
    const f=a.createBiquadFilter(), g=a.createGain();
    let dur;
    if(kind==='snare'){ f.type='bandpass'; f.frequency.value=1900; g.gain.setValueAtTime(0.28*vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.10); dur=0.12; }
    else { f.type='highpass'; f.frequency.value=7000; g.gain.setValueAtTime(0.10*vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.035); dur=0.05; }
    src.connect(f).connect(g).connect(this.gain);
    src.start(t); src.stop(t+dur);   // start より先に stop は呼べない
  },
};

/* ============================================================
   モンスターの絵を なめらかに（v9.2）
   ------------------------------------------------------------
   CEOご指摘（2026-09-03）：絵を大きくしたら、解像度の粗さが目立つ。
   絵は 48×48 の文字ドット絵のまま（描き直さない）。表示するときに Scale3x
   （AdvMAME3x）で 144×144 に広げる。ななめの階段が ならされ、目や輪郭の
   細かいところは保たれる。大きく出すときだけ使い、小さい札などは元のまま。
   画像ファイルは増えない。
   ============================================================ */
const _SC3={};
function scale3x(a){
  const H=a.length, W=a[0].length, out=[];
  const P=(y,x)=>(y>=0&&y<H&&x>=0&&x<W)?a[y][x]:'.';
  for(let y=0;y<H;y++){ const r0=[],r1=[],r2=[];
    for(let x=0;x<W;x++){
      const A=P(y-1,x-1),B=P(y-1,x),C=P(y-1,x+1),D=P(y,x-1),E=P(y,x),F=P(y,x+1),G=P(y+1,x-1),Hh=P(y+1,x),I=P(y+1,x+1);
      let e00=E,e01=E,e02=E,e10=E,e12=E,e20=E,e21=E,e22=E;
      if(D===B&&D!==Hh&&B!==F) e00=D;
      if((D===B&&D!==Hh&&B!==F&&E!==C)||(B===F&&B!==D&&F!==Hh&&E!==A)) e01=B;
      if(B===F&&B!==D&&F!==Hh) e02=F;
      if((Hh===D&&Hh!==F&&D!==B&&E!==A)||(D===B&&D!==Hh&&B!==F&&E!==G)) e10=D;
      if((B===F&&B!==D&&F!==Hh&&E!==I)||(F===Hh&&F!==B&&Hh!==D&&E!==C)) e12=F;
      if(Hh===D&&Hh!==F&&D!==B) e20=D;
      if((F===Hh&&F!==B&&Hh!==D&&E!==G)||(Hh===D&&Hh!==F&&D!==B&&E!==I)) e21=Hh;
      if(F===Hh&&F!==B&&Hh!==D) e22=F;
      r0.push(e00,e01,e02); r1.push(e10,E,e12); r2.push(e20,e21,e22);
    }
    out.push(r0.join(''),r1.join(''),r2.join(''));
  }
  return out;
}
function monSprite(key,pal,cssSize){
  const W=Math.round(cssSize*DPR), P=MON_PAL[pal];
  let a=MON_ART[key], N=MON_N;
  /* 1マスが 1デバイスピクセル以上とれる大きさなら、なめらかにした絵を使う */
  if(W>=MON_N*3){ a=_SC3[key]||(_SC3[key]=scale3x(MON_ART[key])); N=MON_N*3; }
  /* 1マス＝1ピクセルで描いてから、ぼかさずに拡大する（マスの境目に線が出ないように） */
  const src=document.createElement('canvas'); src.width=N; src.height=N;
  const sg=src.getContext('2d');
  for(let y=0;y<N;y++){ const row=a[y];
    for(let x=0;x<N;x++){ const col=P[row[x]]; if(col){ sg.fillStyle=col; sg.fillRect(x,y,1,1); } } }
  const c=document.createElement('canvas'); c.width=W; c.height=W;
  c.style.width=cssSize+'px'; c.style.height=cssSize+'px';
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
  g.drawImage(src,0,0,N,N,0,0,W,W);
  return c;
}

const ART_COL={ w:'rgba(255,255,255,.97)', l:'rgba(255,255,255,.55)', d:'rgba(0,0,0,.34)', k:'rgba(0,0,0,.62)' };

const dropIconCache={};
const DPR = Math.min(3, Math.max(1, window.devicePixelRatio||1));   // Retina でもドットがにじまないように
/* size は CSS上の大きさ。中身は DPR 倍で描く */
function dropCanvas(ci,size,withLabel){
  const W=Math.round(size*DPR);
  const key=ci+'_'+W+'_'+(withLabel?1:0);
  if(!dropIconCache[key]) dropIconCache[key]=buildDrop(ci,W,!!withLabel);
  const c=document.createElement('canvas'); c.width=W; c.height=W;
  c.style.width=size+'px'; c.style.height=size+'px';
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
  g.drawImage(dropIconCache[key],0,0);
  if(withLabel) drawCatLabel(g,ci,W);
  return c;
}
/* なかま名は描画のたびに入れる（ことば切替で変わるため） */
function drawCatLabel(g,ci,W){
  const name=catName(CATS[ci].key);
  let fs=Math.max(6.5*DPR,Math.round(W*0.15));
  g.textAlign='center'; g.textBaseline='middle';
  for(let i=0;i<14;i++){ g.font=`${fs}px "DotGothic16","Zen Maru Gothic",sans-serif`;
    if(g.measureText(name).width<=W*0.92 || fs<=6.5*DPR) break; fs--; }
  const bh=fs+Math.round(W*0.04), by=W-bh-Math.round(W*0.04);
  g.fillStyle='rgba(0,0,0,.46)';
  roundRect(g,W*0.03,by,W*0.94,bh,bh/2); g.fill();
  g.fillStyle='#fff'; g.fillText(name,W/2,by+bh/2+0.5);
}
function buildDrop(ci,W,withLabel){
  const c=document.createElement('canvas'); c.width=W; c.height=W;
  const g=c.getContext('2d'), cat=CATS[ci], r=W*0.22;
  g.fillStyle=cat.color; roundRect(g,1,1,W-2,W-2,r); g.fill();
  const grad=g.createLinearGradient(0,0,0,W);
  grad.addColorStop(0,'rgba(255,255,255,.42)'); grad.addColorStop(.5,'rgba(255,255,255,0)'); grad.addColorStop(1,'rgba(0,0,0,.30)');
  g.fillStyle=grad; roundRect(g,1,1,W-2,W-2,r); g.fill();
  g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=Math.max(2,W*0.055); roundRect(g,1.5,1.5,W-3,W-3,r); g.stroke();
  /* 1ドットは必ず整数ピクセルの正方形にする（にじみ防止） */
  /* v9.3／v9.4 CEOご要望：たまの絵（ハート・時計など）を大きく。
     これまで「1ドット＝整数ピクセル」に丸めていたため、実際の絵は たまの 58〜64% にしか
     なっていなかった（0.72 を指定しても 3ドット/マスに切り下がる）。
     1ドット＝1ピクセルで描いてから ぼかさずに拡大する方式（モンスターと同じ）に変え、
     指定した大きさどおりに出す。名前の帯には少しだけ重なるが、帯は半透明なので読める。 */
  const artFrac = withLabel ? 0.80 : 0.84;
  const aw=Math.round(W*artFrac);
  const ox=Math.round((W-aw)/2), oy=Math.round((withLabel? W*0.43 : W*0.5) - aw/2);
  const art=DROP_ART[ci];
  const src=document.createElement('canvas'); src.width=ART_N; src.height=ART_N;
  const sg=src.getContext('2d');
  for(let y=0;y<ART_N;y++){ const row=art[y];
    for(let x=0;x<ART_N;x++){ const col=ART_COL[row[x]]; if(col){ sg.fillStyle=col; sg.fillRect(x,y,1,1); } } }
  g.imageSmoothingEnabled=false; g.drawImage(src,0,0,ART_N,ART_N,ox,oy,aw,aw);
  return c;
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

const LEVELS=[

function levelOf(pts){ let i=0; for(let k=0;k<LEVELS.length;k++){ if(pts>=LEVELS[k].min) i=k; } return i; }
/* なかまごとの持ちものの候補（先頭＝最初から使える1枚。以降はレベルで開いていく）

/* レベルが1つ上がるごとに、各なかまで えらべる枚数が1枚ふえる。
   さらに、ふりかえりで「つぎに使ってみたい」に選んだ方略は、その場で開く。 */
function openCount(lv){ return 2+lv; }              /* Lv.1で2枚 → Lv.5で6枚（最初から えらべる楽しみを残す） */
function autoOpen(catKey,lv){ return POOL[catKey].slice(0,Math.min(POOL[catKey].length,openCount(lv))); }

/* ---------- れんしゅうを済ませたかどうかの記録（端末内） ----------
   1人1台の想定。2回目からはれんしゅうを自動でとばす。
   保存できない環境（プライベートモード等）では、毎回「はじめて」の扱いになるだけで支障はない。 */
const SAVE_KEY='houryaku_puzzle_v1';
function loadSave(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY))||{}; }catch(e){ return {}; } }
function putSave(o){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(o)); }catch(e){} }
function markTutoSeen(){ const o=loadSave(); o.tuto=1; putSave(o); G.seenTuto=true; }
function forgetTuto(){ const o=loadSave(); delete o.tuto; putSave(o); G.seenTuto=false; }
function normSave(o){ o.pts=o.pts||0; o.quests=o.quests||0; o.hits=o.hits||0; o.mixes=o.mixes||0; o.best=o.best||0;
  o.dex=o.dex||{}; o.titles=o.titles||[]; o.unlocked=o.unlocked||[]; o.use=o.use||{};
  o.blocks=o.blocks||0; o.heals=o.heals||0; o.shines=o.shines||0; o.rares=o.rares||0; return o; }
function unlockedOf(catKey,sv){ sv=sv||normSave(loadSave());
  const auto=autoOpen(catKey,levelOf(sv.pts));
  return POOL[catKey].filter((k,i)=>auto.indexOf(k)>=0||sv.unlocked.indexOf(k)>=0); }
/* いま えらべる枚数の合計（図鑑の「あと何枚で開く」表示に使う） */
function openTotal(sv){ return CATS.reduce((a,c)=>a+unlockedOf(c.key,sv).length,0); }
/* クエストの結果を記録し、ふえたごほうびを返す */
function applyResult(res){
  const sv=normSave(loadSave());
  const before=levelOf(sv.pts);
  sv.pts+=res.points; sv.quests++; sv.hits+=res.hits; sv.mixes+=res.mixes;
  sv.best=Math.max(sv.best,res.maxCombo);
  sv.blocks+=(res.blocks||0); sv.heals+=(res.heals||0); sv.shines+=(res.shines||0); sv.rares+=(res.rares||0);
  Object.keys(res.useCount||{}).forEach(k=>{ sv.use[k]=(sv.use[k]||0)+res.useCount[k]; });
  const newStamps=[];
  res.stampTitles.forEach(t=>{ if(!sv.dex[t]){ sv.dex[t]=1; newStamps.push(t); } });
  const after=levelOf(sv.pts);
  /* レベルが上がると、各なかまで えらべる方略が1枚ずつ ふえる */
  const gained=[];
  if(after>before){ CATS.forEach(c=>{
    const b=autoOpen(c.key,before), a=autoOpen(c.key,after);
    a.forEach(k=>{ if(b.indexOf(k)<0) gained.push(k); }); }); }
  /* ふりかえりで「つぎに つかって みたい」に えらんだ方略は、その場で開く */
  let picked=null;
  if(res.pickKey){
    const pc=CARD[res.pickKey].cat;
    if(autoOpen(pc,after).indexOf(res.pickKey)<0 && sv.unlocked.indexOf(res.pickKey)<0){
      sv.unlocked.push(res.pickKey); picked=res.pickKey; }
  }
  const newTitles=TITLES.filter(t=>sv.titles.indexOf(t.id)<0 && t.need(sv));
  newTitles.forEach(t=>sv.titles.push(t.id));
  putSave(sv);
  return {sv, before, after, levelUp:after>before, gained, picked, newTitles, newStamps};
}

  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{
    const ta=document.createElement('textarea'); ta.value=t;
    ta.style.cssText='position:fixed;left:-9999px;top:0'; document.body.appendChild(ta);
    ta.focus(); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

  const t=recordText(kind), msg=document.getElementById('shareMsg'), area=document.getElementById('shareArea');

    msg.textContent=E('コピーしたよ。はりつけて つたえてね。','コピーしました。貼りつけて伝えてください。'); }

}

   ------------------------------------------------------------
   CEOご要望（2026-08-27）：
     ③バトル中に、リーダーから「〈ふりかえる〉を あわせると 1.5ばい だよ」
       のようなメッセージがときどき来ると、方略への理解や意識が高まる。

   数字は、実際のダメージ計算とかならず一致させる（教材なので、まちがった
   倍率を覚えさせない）。計算は §4 のとおり：
     リーダーと同じなかま ×1.5 ／ みたて的中 ×1.5 ／ 弱点 ×2.0 ／ 効きにくい ×0.5
     3種類いじょう ×1.5 ／ 4種類いじょう ×2.0 ／ コンボ1つごとに +0.25
   ============================================================ */
function catLabel(k){ const c=CATS[CI[k]]; return G.easy ? (c.easy+'（'+c.key+'）') : c.key; }

/* リーダーが言うことの候補を、そのときの状況からつくる */
function leaderSayLines(){
  const e=G.enemy, L=G.leaderCat, out=[];
  out.push(E(`わたしの なかま〈${catLabel(L)}〉を あわせると <b>1.5ばい</b> だよ`,
             `わたしの${WORD.cat()}〈${L}〉を合わせると <b>1.5倍</b> です`));
  if(G.guessHit && G.guessCat)
    out.push(E(`みたてが あたった〈${catLabel(G.guessCat)}〉も <b>1.5ばい</b> だよ`,
               `みたてが的中した〈${G.guessCat}〉も <b>1.5倍</b> です`));
  else
    out.push(E('みたては はずれたけど、いろいろ ためせば 見つかるよ',
               'みたては外れましたが、いろいろ試せば見つかります'));
  out.push(E('3つ いじょう まぜると <b>1.5ばい</b>、4つ いじょうなら <b>2ばい</b> だよ',
             '3種類以上を同時に使うと <b>1.5倍</b>、4種類以上なら <b>2倍</b> です'));
  out.push(E('コンボが つづくほど つよくなるよ（1つごとに +0.25）',
             'コンボが続くほど強くなります（1つごとに +0.25）'));
  /* v9.0：つまずきの こうげきに そなえる なかまの 役わり */
  { const w=e.weak, r=roleOf(G.deck[w]), c=CATS[CI[w]], card=CARD[G.deck[w]];
    if(r==='guard') out.push(E(`${c.chara}の『${card.easy}』は 🛡ふせぐ わざ。この つまずきの こうげきは へいきだよ`,`${c.chara}の『${card.title}』は🛡ふせぐ方略。このつまずきの攻撃は通りません`));
    else if(r==='heal') out.push(E(`${c.chara}の『${card.easy}』は 💚たてなおす わざ。げんきが へったら〈${catLabel(w)}〉を 消そう`,`${c.chara}の『${card.title}』は💚たてなおす方略。げんきが減ったら〈${w}〉を消しましょう`));
    else out.push(E(`この つまずきは〈${catLabel(w)}〉に こうげきしてくる。${c.chara}の わざは ⚔なので、ふせげないよ`,`このつまずきは〈${w}〉に攻撃してきます。${c.chara}の方略は⚔なので、ふせげません`));
    out.push(E(`〈${catLabel(w)}〉の たまを 消しつづけると、うける ダメージが <b>半分</b>に なるよ`,`〈${w}〉のドロップを消し続けると、受けるダメージが <b>半分</b>になります`)); }
  /* リーダーの口ぐせ（ずかんに出ているものと同じ） */
  out.push(charaLine(CI[L],true));
  return out;
}

const tutoBoard=document.getElementById('tutoBoard');
let TCELL=54;
function startTuto(){ paintTuto(); show('scTuto'); }
function paintTuto(){
  const t=TUTO[G.tutoStep];
  document.getElementById('tutoStep').textContent=E(`れんしゅう ${G.tutoStep+1} / ${TUTO.length}`,`練習 ${G.tutoStep+1} / ${TUTO.length}`);
  document.getElementById('btnSkipTuto').textContent=E('とばす →','練習をとばす →');
  document.getElementById('tutoTtl').textContent=E(t.ttlE,t.ttlF);
  document.getElementById('tutoLead').innerHTML=E(t.leadE,t.leadF);
  const box=document.getElementById('tutoBox');
  if(box.dataset.done==='1'){ box.innerHTML=E(t.doneE,t.doneF); }
  const foot=document.getElementById('tutoFoot');
  if(foot.dataset.done==='1'){
    foot.innerHTML='';
    const b=document.createElement('button'); b.className='gold';
    b.textContent = (G.tutoStep+1<TUTO.length) ? E('▶ つぎの れんしゅう','▶ 次の練習') : E('▶ ゲームを はじめる','▶ ゲームをはじめる');
    b.addEventListener('click',()=>{ SFX.confirm();
      if(G.tutoStep+1<TUTO.length){ G.tutoStep++; buildTuto(); paintTuto(); }
      else { startGoal(); }
    });
    foot.appendChild(b);
  }
  if(!tutoBoard.dataset.built){ buildTuto(); }
  else {
    const size=Math.max(18,TCELL-6);
    G.tEls.forEach(row=>row.forEach(el=>{ if(!el) return;
      const cv=dropCanvas(+el.dataset.ci,size,true); cv.style.width=size+'px'; cv.style.height=size+'px';
      el.replaceChild(cv,el.querySelector('canvas')); }));
  }
  if(!G.tHeld) clearGrabName('tutoGrab');
}
function buildTuto(){
  const t=TUTO[G.tutoStep];
  const stage=document.getElementById('stage');
  TCELL=Math.floor((Math.min(stage.clientWidth,460)-(window.innerWidth<=520?56:40))/t.cols);
  tutoBoard.style.width=(TCELL*t.cols)+'px'; tutoBoard.style.height=(TCELL*t.rows)+'px';
  tutoBoard.innerHTML=''; tutoBoard.dataset.built='1';
  G.tGrid=t.grid.map(r=>r.slice()); G.tEls=[]; G.tBusy=false; G.tHeld=null;
  document.getElementById('tutoBox').style.display='none';
  document.getElementById('tutoBox').dataset.done='0';
  document.getElementById('tutoFoot').innerHTML=''; document.getElementById('tutoFoot').dataset.done='0';
  clearGrabName('tutoGrab');
  for(let r=0;r<t.rows;r++){ const row=[]; for(let c=0;c<t.cols;c++){ row.push(mkTuto(G.tGrid[r][c],r,c)); } G.tEls.push(row); }
  // 目印（リング＋やじるし）
  const ring=document.createElement('div'); ring.className='ring'; ring.id='tutoRing';
  ring.style.width=(TCELL-4)+'px'; ring.style.height=(TCELL-4)+'px';
  ring.style.left=(t.from.c*TCELL+2)+'px'; ring.style.top=(t.from.r*TCELL+2)+'px';
  tutoBoard.appendChild(ring);
  const ar=document.createElement('div'); ar.id='tutoArrow'; ar.textContent='↑';
  ar.style.left=(t.to.c*TCELL+TCELL/2-14)+'px'; ar.style.top=(t.to.r*TCELL+TCELL/2-18)+'px';
  tutoBoard.appendChild(ar);
}
function mkTuto(ci,r,c){
  const d=document.createElement('div'); d.className='drop'; d.dataset.ci=ci;
  const size=Math.max(18,TCELL-6);
  const cv=dropCanvas(ci,size,true); cv.style.width=size+'px'; cv.style.height=size+'px';
  d.appendChild(cv); d.style.width=TCELL+'px'; d.style.height=TCELL+'px';
  d.style.transform=`translate(${c*TCELL}px,${r*TCELL}px)`;
  tutoBoard.appendChild(d); return d;
}
function tCellAt(e){
  const t=TUTO[G.tutoStep], b=tutoBoard.getBoundingClientRect();
  const c=Math.floor((e.clientX-b.left)/TCELL), r=Math.floor((e.clientY-b.top)/TCELL);
  if(r<0||r>=t.rows||c<0||c>=t.cols) return null; return {r,c};
}
tutoBoard.addEventListener('pointerdown',e=>{
  if(G.tBusy) return; const p=tCellAt(e); if(!p) return;
  G.tHeld=p; G.tEls[p.r][p.c].classList.add('held'); G.tEls[p.r][p.c].style.zIndex=20;
  tutoBoard.setPointerCapture(e.pointerId); SFX.grab();
  showGrabName(+G.tEls[p.r][p.c].dataset.ci,'tutoGrab'); e.preventDefault();
});
tutoBoard.addEventListener('pointermove',e=>{
  if(!G.tHeld||G.tBusy) return; const p=tCellAt(e); if(!p) return;
  if(p.r===G.tHeld.r&&p.c===G.tHeld.c) return;
  if(Math.abs(p.r-G.tHeld.r)>1||Math.abs(p.c-G.tHeld.c)>1) return;
  const a=G.tHeld;
  const tv=G.tGrid[a.r][a.c]; G.tGrid[a.r][a.c]=G.tGrid[p.r][p.c]; G.tGrid[p.r][p.c]=tv;
  const te=G.tEls[a.r][a.c]; G.tEls[a.r][a.c]=G.tEls[p.r][p.c]; G.tEls[p.r][p.c]=te;
  G.tEls[a.r][a.c].style.transform=`translate(${a.c*TCELL}px,${a.r*TCELL}px)`;
  G.tEls[p.r][p.c].style.transform=`translate(${p.c*TCELL}px,${p.r*TCELL}px)`;
  G.tEls[p.r][p.c].style.zIndex=20;
  G.tHeld=p; SFX.swap(); e.preventDefault();
});
['pointerup','pointercancel'].forEach(ev=>tutoBoard.addEventListener(ev,()=>{
  if(!G.tHeld) return;
  const el=G.tEls[G.tHeld.r][G.tHeld.c]; if(el){ el.classList.remove('held'); el.style.zIndex=''; }

}));
function checkTuto(){
  const t=TUTO[G.tutoStep];
  const groups=matchesOf(G.tGrid,t.rows,t.cols);

  const ring=document.getElementById('tutoRing'), ar=document.getElementById('tutoArrow');

  groups.forEach((g,i)=>{ SFX.combo(i+1); g.cells.forEach(([r,c])=>{ const el=G.tEls[r][c]; if(el){ el.classList.add('pop'); setTimeout(()=>el.remove(),240); } G.tEls[r][c]=null; G.tGrid[r][c]=-1; }); });
  SFX.victory();
  setTimeout(()=>{
    const box=document.getElementById('tutoBox'), foot=document.getElementById('tutoFoot');
    box.style.display='block'; box.dataset.done='1'; foot.dataset.done='1';
    paintTuto();
    document.getElementById('scTuto').scrollTop=9999;

}

/* きょう出会う3体を選び、その3体が合体したボスをさいごに置く */
function buildFoes(){
  const idx=FOES.map((f,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  let three=idx.slice(0,3).map(i=>FOES[i]);
  /* v9.0 レアつまずき：15%で金色。HP1.3倍。点にはしない（運なので）。会った回数だけ記録する */
  three=three.map(f=> Math.random()<0.15
    ? Object.assign({},f,{rare:true, name:'✨'+f.name, hp:Math.round(f.hp*1.3)}) : f);
  G.bossWeaks=three.map(f=>f.weak);
  G.bossFoes=three;                 /* ボスは「きょう会った3つ」がまざったもの。段階ごとに この声で しゃべる */
  G.foes=three.concat([BOSS]);
  G.healArm=null;
}

function startGuess(shift){
  const base=G.foes[G.eIndex];
  if(!shift){ G.eHp=base.hp; G.bossPhase=0; G.eDmg={}; G.eHits=0; }
  G.eUse={}; G.lastMoveCats={};                              /* v9.6：新しい つまずき／段階で、使用の記録をやり直す */
  if(base.boss){
    const pi=Math.min(G.bossPhase,G.bossWeaks.length-1), w=G.bossWeaks[pi];
    /* CEOご指摘（2026-08-28）：段階が変わるときのことばがいつも同じで、どの方略を選べばよいか分からない。
       ボスは「きょう会った3つのつまずき」がまざったものなので、段階ごとに そのつまずきの
       声（serif）・手がかり（hint）・つぶやき（lines）を使う。声そのものが みたての手がかりになる。 */
    const src=(G.bossFoes&&G.bossFoes[pi])||{};
    G.enemy=Object.assign({},base,{weak:w, whyE:CATWHY[w].e, whyF:CATWHY[w].f,
      voice:src.name?src.name.replace('✨',''):'', voiceSerif:src.serif||'',
      hintE:src.hintE||base.hintE, hintF:src.hintF||base.hintF,
      lines:(src.lines&&src.lines.length)?src.lines:base.lines});
    /* つぎに段階が変わるHP。3段階で分ける。 */
    const step=base.hp/G.bossWeaks.length;
    G.bossNext = (G.bossPhase+1<G.bossWeaks.length) ? base.hp-step*(G.bossPhase+1) : -1;
  }else{ G.enemy=base; G.bossNext=-1; }
  G.guessCat=null; G.guessHit=false; G.turn=0;
  G.guardSpent={}; G.healArm=null;     /* あたらしい つまずき（段階）では、じゅんびは やり直せている */
  paintGuess(false); SFX.appear(); show('scGuess');
}

/* マッチ判定（盤面を引数にとる汎用版） */
function matchesOf(grid,rows,cols){
  const mark=[]; for(let r=0;r<rows;r++) mark.push(new Array(cols).fill(false));
  for(let r=0;r<rows;r++){ let run=1; for(let c=1;c<=cols;c++){
    if(c<cols&&grid[r][c]===grid[r][c-1]&&grid[r][c]>=0) run++;
    else { if(run>=3) for(let k=c-run;k<c;k++) mark[r][k]=true; run=1; } } }
  for(let c=0;c<cols;c++){ let run=1; for(let r=1;r<=rows;r++){
    if(r<rows&&grid[r][c]===grid[r-1][c]&&grid[r][c]>=0) run++;
    else { if(run>=3) for(let k=r-run;k<r;k++) mark[k][c]=true; run=1; } } }
  const seen=[]; for(let r=0;r<rows;r++) seen.push(new Array(cols).fill(false));
  const groups=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(!mark[r][c]||seen[r][c]) continue;
    const ci=grid[r][c], cells=[], st=[[r,c]]; seen[r][c]=true;
    while(st.length){ const [y,x]=st.pop(); cells.push([y,x]);
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dy,dx])=>{ const ny=y+dy,nx=x+dx;
        if(ny>=0&&ny<rows&&nx>=0&&nx<cols&&mark[ny][nx]&&!seen[ny][nx]&&grid[ny][nx]===ci){ seen[ny][nx]=true; st.push([ny,nx]); } }); }
    groups.push({ci,cells});
  }
  return groups;
}
function findMatches(){ return matchesOf(G.grid,ROWS,COLS); }

async function resolveBoard(){
  G.busy=true;
  let combo=0, moveDmg=0, moveCats={}, moveCleared=0, shineDue=null, leaderMixNote=false;
  const comboEl=document.getElementById('comboTxt'), dmgEl=document.getElementById('dmgTxt');
  while(true){
    const groups=findMatches(); if(!groups.length) break;
    const distinct=new Set(groups.map(g=>g.ci)).size;
    const mixMul = distinct>=4?2.0 : distinct>=3?1.5 : 1.0;
    if(distinct>=3){ G.rec.mixCount++; showMixBanner([...new Set(groups.map(g=>g.ci))],mixMul); }
    if(distinct>=4) shineDue=[...new Set(groups.map(g=>g.ci))];   /* ✨ かがやくなかま（あとで出す）*/
    moveCleared+=groups.reduce((a,g)=>a+g.cells.length,0);
    for(const g of groups){
      combo++;
      const cat=CATS[g.ci].key, n=g.cells.length;
      let att=100*(1+(n-3)*0.25);
      if(roleOf(G.deck[cat])==='attack') att*=1.5;      /* ⚔ こうげきの わざ（実行する）*/
      if(cat===G.leaderCat) att*=1.5;
      if(G.guessHit&&cat===G.guessCat) att*=1.5;
      if(cat===G.enemy.weak) att*=2.0;
      if(cat===G.enemy.resist) att*=0.5;
      const dmg=Math.round(att*(1+(combo-1)*0.25)*mixMul);
      moveDmg+=dmg; moveCats[cat]=(moveCats[cat]||0)+dmg;
      G.rec.catDmg[cat]=(G.rec.catDmg[cat]||0)+dmg;
      G.eDmg[cat]=(G.eDmg[cat]||0)+dmg;
      G.rec.catUse[cat]=(G.rec.catUse[cat]||0)+1;
      G.eUse[cat]=(G.eUse[cat]||0)+1;                      /* この つまずきで、この なかまを使った回数（v9.6）*/
      cheerChip(g.ci);
      SFX.combo(combo);
      comboEl.textContent=`${combo} コンボ`;
      comboEl.style.fontSize=Math.min(44,22+combo*2.5)+'px';
      comboEl.style.color = combo>=5 ? '#ffd54a' : '#fff';
      comboEl.style.transition='none'; comboEl.style.opacity='1';
      setTimeout(()=>{ comboEl.style.transition='opacity .5s'; comboEl.style.opacity='0'; },300);
      g.cells.forEach(([r,c])=>{ const el=G.els[r][c]; if(el){ el.classList.add('pop'); setTimeout(()=>el.remove(),240);} G.els[r][c]=null; G.grid[r][c]=-1; });
      await sleep(150);
    }
    G.rec.maxCombo=Math.max(G.rec.maxCombo,combo);
    await sleep(120); applyGravity(); await sleep(180);
  }
  if(moveDmg>0){
    G.lastMoveCats=Object.assign({},moveCats);              /* 直前の手で消した なかま（v9.6：受けるダメージの判定に使う）*/
    G.rec.moves++; G.rec.total+=moveDmg;
    const cats=Object.keys(moveCats).sort((a,b)=>moveCats[b]-moveCats[a]);
    if(cats.length>=2&&moveDmg>G.rec.bestMixDmg){ G.rec.bestMixDmg=moveDmg; G.rec.bestMix=[cats[0],cats[1]]; }
    if(moveCleared>=8) showBigClear(moveCleared);
    /* v9.8 ②：連鎖で大きなダメージ → よろこぶ音（ふつうの hit の音に重ねる） */
    if(moveDmg>=700 || combo>=6){ SFX.bigdmg(); }

    for(let r=ROWS-1;r>=0;r--){
      if(G.grid[r][c]!==-1){

/* ============================================================
   受けるダメージ（v9.6）
   ------------------------------------------------------------
   CEOご指摘（2026-09-10）：必ず1減るのは予想できて面白くない。数字で、高いときと低いときがあり、
   それを方略に関連させたい。
   受けるダメージ ＝ つまずきの強さ × 方略の状態 × ゆらぎ（0.85〜1.15）
     ×0.5：攻撃してくる なかまの たまを、直前の手で消していた（いま その方略を使っていた）
     ×1.5：この つまずきで、その なかまを まだ一度も使っていない（ほうっておいた つまずきは大きくなる）
     ×1.0：それ以外
   与えるダメージ（弱点×2）と同じ向き＝「つまずきには、その方略を使い続けるほど有利」。覚えることを増やさない。
   ============================================================ */
function incomingDamage(){
  const e=G.enemy, w=e.weak;
  const base=(e.atk||16)*(e.rare?1.3:1);
  let mul=1, why='';
  if(G.lastMoveCats && G.lastMoveCats[w]){ mul=0.5; why='recent'; }
  else if(!(G.eUse && G.eUse[w])){ mul=1.5; why='neglect'; }
  const jitter=0.85+Math.random()*0.30;
  const dmg=Math.max(1,Math.round(base*mul*jitter));
  return {dmg,mul,why};
}
function whyText(w,why,dmg){
  const lab=catLabel(w);
  if(why==='recent') return E(`〈${lab}〉の たまを いま 消していたから、<b>半分</b>で すんだ（−${dmg}）`,`〈${w}〉のドロップを直前に消していたので、<b>半分</b>ですみました（−${dmg}）`);
  if(why==='neglect') return E(`〈${lab}〉を まだ 一度も つかっていないから、つまずきが <b>大きく</b> なった（−${dmg}）`,`〈${w}〉をまだ一度も使っていないので、つまずきが<b>大きく</b>なりました（−${dmg}）`);
  return E(`−${dmg}`,`−${dmg}`);
}

   ============================================================ */
function onEnemyDown(){
  G.busy=true; stopTimer(); SFX.victory();
  hideLeaderSay(); hideCutIn();
  /* 大きな「◯個 同時に消した！」が のこっていたら片づける（勝利パネルと重ねない） */
  const bc=document.getElementById('bigClear'); if(bc) bc.classList.remove('show');
  document.getElementById('eSerif').textContent='';
  const em=document.getElementById('eMid'); em.classList.add('shake'); setTimeout(()=>em.classList.remove('shake'),320);
  /* 敵を薄くして「たおした」ことを絵でも見せる */
  const holder=document.getElementById('enemyCv');
  holder.style.transition='opacity .7s,transform .7s';
  holder.style.opacity='.18'; holder.style.transform='scale(.82) translateY(10px)';
  showWinPanel();
}
function nextFoe(){
  const holder=document.getElementById('enemyCv');
  holder.style.transition=''; holder.style.opacity=''; holder.style.transform='';
  const wp=document.getElementById('winPanel');
  wp.classList.remove('show'); clearTimeout(wp._t); wp.onclick=null;
  G.eIndex++;
  if(G.eIndex<G.foes.length){
    /* v9.8 ①：つぎの たたかいへ 進むとき、げんきを 20 もどす（ひと息つく） */
    G.pHp=Math.min(G.pMax,G.pHp+20); updateHp();
    startGuess(); G.busy=false;
  } else { startLook(); }
}
function showWinPanel(){
  const wp=document.getElementById('winPanel'), sv=normSave(loadSave());
  /* この つまずきに いちばん きいた なかま */
  const top=CATS.map(c=>({k:c.key,v:G.eDmg[c.key]||0})).sort((a,b)=>b.v-a.v)[0];
  const card=CARD[G.deck[top.k]] || CARD[G.leaderKey];
  const isNew=!sv.dex[card.title];
  const hits=G.eHits||0, pts=10+30*hits;
  const isBoss=!!G.enemy.boss;
  if(G.enemy.rare) G.rec.rares++;
  wp.innerHTML=
     `<span class="wttl">${isBoss?E('ボスに かった！','ボスに勝った！'):(G.enemy.rare?E('✨ レアを たおした！','✨ レアを倒した！'):E('たおした！','たおした！'))}</span>`
    +`<span class="wname">${G.enemy.name}</span>`
    +`<span class="wpts">＋${pts} ${E('ほうりゃくポイント','方略ポイント')}</span>`
    +`<div class="wrow"><span>${E('たおした つまずき','たおしたつまずき')}</span><span>＋10</span></div>`
    +(hits?`<div class="wrow"><span>${E('みたてが あたった','みたて的中')} ×${hits}</span><span>＋${30*hits}</span></div>`
          :`<div class="wrow"><span style="color:#7d85ad">${E('みたてが あたると ＋30 だったよ','みたてが的中すると ＋30 でした')}</span><span></span></div>`)
    +`<div class="wbest"><span data-emb="1" class="wemb${isNew?' isnew':''}"></span><span class="wtx">`
      +`<b style="color:${CATS[CI[card.cat]].color}">${E('いちばん きいた わざ','いちばん効いた方略')}</b><br>`
      +`${G.easy?card.easy:card.title}</span></div>`
    +`<span class="wdex">${isNew
        ? E('📖 ずかんに まだ ない わざ！ クエストの さいごに 手に入るよ','📖 図鑑にまだない方略！ クエストの最後に手に入ります')
        : E('📖 ずかんに ある わざ（きろく ずみ）','📖 図鑑に記録ずみの方略')}</span>`
    +`<span class="wcnt">${E('ずかん','図鑑')} <b>${Object.keys(sv.dex).length}</b> / 46</span>`
    +(G.eIndex+1<G.foes.length ? `<span class="wcnt" style="color:#86efac">💚 ${E('つぎの たたかいへ：げんき ＋20','つぎのたたかいへ：げんき ＋20')}</span>` : '')
    +`<span class="wtap">${E('▶ タップで つぎへ','▶ タップでつぎへ')}</span>`;
  /* ごほうびなので、くすませずに いつも色つきで出す。
     まだ手に入れていないことは「NEW」の札のほうで知らせる。 */
  wp.querySelector('[data-emb]').appendChild(
    emblemCanvas(card.cat, EMB_SLOT[card.title]||0, true, 38, card.phase));
  wp.classList.remove('show'); void wp.offsetWidth; wp.classList.add('show');
  wp.style.pointerEvents='auto';
  wp.onclick=()=>{ clearTimeout(wp._t); nextFoe(); };
  clearTimeout(wp._t); wp._t=setTimeout(nextFoe, 3600);
}

/* ============================================================ ⑤振り返り ============================================================ */
function startLook(){
  const r=G.rec, hits=r.guesses.filter(g=>g.hit).length;
  const hpUnits=Math.round(Math.max(0,G.pHp)/20);           /* v9.6：げんき20ごとに＋5（♥1つ＝＋5 と同じ尺度）*/
  const pts = hits*30 + r.mixCount*15 + r.maxCombo*4 + G.foes.length*10 + hpUnits*5;
  G.result={ points:pts, hits, mixes:r.mixCount, maxCombo:r.maxCombo,
    parts:[
      {k:E('みたてが あたった','みたてが的中'), n:hits, per:30},
      {k:E('3つ いじょう いっしょに','3種類以上を同時に'), n:r.mixCount, per:15},
      {k:E('いちばん ながい コンボ','最大コンボ'), n:r.maxCombo, per:4},
      {k:E('たおした つまずき','たおしたつまずき'), n:G.foes.length, per:10},
      {k:E('のこった げんき（20ごと）','のこったげんき（20ごと）'), n:hpUnits, per:5},
    ],
    stampTitles:[], useCount:Object.assign({},r.catUse),
    blocks:r.blocks, heals:r.heals, shines:r.shines, rares:r.rares, roleLog:r.roleLog.slice() };
  paintLook(); show('scLook');
}

    <div class="stat"><span>✨ ${E('かがやく なかまを よんだ かず','かがやくなかまをよんだ回数')}</span><b>${rec.shines}</b></div>

    <div class="stat" style="border:none"><span>${E('のこった げんき','のこったげんき')}</span><b>${Math.max(0,Math.round(G.pHp))} / ${G.pMax}</b></div>`
    + (rec.roleLog.length ? `<div class="rsub" style="margin-top:6px;color:#98a0c8">${E('はたらいた わざ：','はたらいた方略：')}`
        + rec.roleLog.slice(0,4).map(x=>`${x.r==='retreat'?'🔁':ROLE[x.r].icon}『${x.card}』`).join('　') + (rec.roleLog.length>4?'　…':'') + '</div>' : '');
  const bars=document.getElementById('lookBars'); bars.innerHTML='';
  const max=Math.max(1,...CATS.map(c=>rec.catDmg[c.key]||0));

    row.innerHTML=`<span class="bn" style="color:${cat.color}">${cat.chara}</span><span class="bb"><span class="bf" style="width:0;background:${cat.color}"></span></span><span class="bv">${v}</span>`;
    bars.appendChild(row);
    setTimeout(()=>{ row.querySelector('.bf').style.width=(v/max*100)+'%'; },60);
  });

    + (mix?`<b>${E('いちばん きいた あわせわざ','いちばん効いた組み合わせ')}</b><br>

        <span style="font-size:10.5px;color:#c3c9e8">${E(`この2つを いっしょに つかったとき、<b>${rec.bestMixDmg}</b> の はたらきに なったよ。`,`この2つをいっしょに使ったとき、<b>${rec.bestMixDmg}</b> のはたらきになりました。`)}</span><br><br>`:'')
    + `<b>${E('わかった こと','わかったこと')}</b><br><span style="font-size:10.5px;color:#c3c9e8">`
    + E(`1つの わざだけを くりかえすより、いくつかの わざを あわせた ときのほうが 大きく はたらいたね（3つ いじょう いっしょ：${rec.mixCount}かい）。<br>ほんとうの 学びでも、わざは あわせて つかうと 力が 出るよ。`,
        `1つの方略だけをくり返すより、いくつかの方略を組み合わせたときのほうが大きくはたらきました（3つ以上を同時に：${rec.mixCount}回）。<br>ほんとうの学びでも、方略は組み合わせて使うと力を発揮します。`)

     えらんだ1枚は その場で「もちもの」に開くので、46枚すべてに手が届く。 */
  const sv0=normSave(loadSave());
  const inDeck={}; CATS.forEach(c=>{ inDeck[G.deck[c.key]]=1; });
  const lowUse=CATS.map(c=>({k:c.key,v:rec.catUse[c.key]||0})).sort((a,b)=>a.v-b.v).slice(0,2).map(o=>o.k);
  const cand=Object.keys(CARD).filter(k=>!inDeck[k]).map((k,i)=>{
    const c=CARD[k]; let sc=0;
    if(sv0.dex[c.title]) sc+=100;                       /* もう持っている札は後回し */
    if(lowUse.indexOf(c.cat)<0) sc+=20;                 /* きょう出番の少なかったなかまを優先 */
    if(c.phase!=='振り返る') sc+=6;                     /* ふりかえりの場面に合う札を少し優先 */

  const pick=document.getElementById('lookPick'); pick.innerHTML='';
  four.forEach(k=>{

    b.addEventListener('click',()=>{ SFX.confirm(); G.pickKey=k; startEnd(); });
    pick.appendChild(b);
  });
}

/* ============================================================ ⑥おわり ============================================================ */
function startEnd(){
  /* 図鑑スタンプ＝きょう持っていった5枚＋つぎに選んだ1枚＋リーダー */
  const t=new Set();
  CATS.forEach(c=>t.add(CARD[G.deck[c.key]].title));
  t.add(CARD[G.leaderKey].title); t.add(CARD[G.pickKey].title);
  /* v9.5：いちど離れて やり直したなら、その方略も「使った」ものとして ずかんに記録する */
  if((G.rec.retreats||0)>0) t.add(CARD['一旦離れる'].title);
  G.result.stampTitles=[...t];
  G.result.pickKey=G.pickKey;
  G.applied=applyResult(G.result);
  if(G.applied.levelUp) SFX.victory(); else SFX.confirm();
  paintEnd(); show('scEnd');
}

  setTimeout(()=>{ const f=document.getElementById('eFill'); if(f) f.style.width=Math.max(3,Math.min(1,p0)*100)+'%'; },80);
}


/* ============================================================
   エンブレムとトロフィー（v8.4）
   ------------------------------------------------------------
   CEOご要望（2026-08-27）：
     ・ずかんの方略名の下に、ちょっとしたイラストやマーク（エンブレム）を
     ・称号は、もっと豪華なエンブレムやトロフィーを
   画像ファイルは使わない決まりなので、ドット絵をその場で描く。
   1ドットは必ず整数ピクセルの正方形にする（ドロップやモンスターと同じやり方）。
   ============================================================ */
function _pad(size,N){
  const px=Math.max(1,Math.floor(size*DPR/N));
  const c=document.createElement('canvas');
  c.width=N*px; c.height=N*px; c.style.width=size+'px'; c.style.height=size+'px';
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
  return {
    c:c, g:g, N:N,
    set(x,y,col){ if(!col||x<0||y<0||x>=N||y>=N) return; g.fillStyle=col; g.fillRect(x*px,y*px,px,px); },
    disc(cx,cy,r,col){ for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const dx=x+.5-cx, dy=y+.5-cy; if(dx*dx+dy*dy<=r*r) this.set(x,y,col); } },
    ring(cx,cy,r,t,col){ for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const dx=x+.5-cx, dy=y+.5-cy, d=Math.sqrt(dx*dx+dy*dy);
      if(d<=r && d>=r-t) this.set(x,y,col); } },
    box(x0,y0,x1,y1,col){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) this.set(x,y,col); },
    poly(pts,col){ for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const px2=x+.5, py=y+.5; let inside=false, n=pts.length, j=n-1;
      for(let i=0;i<n;i++){ const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
        if((yi>py)!==(yj>py) && px2<(xj-xi)*(py-yi)/(yj-yi)+xi) inside=!inside; j=i; }
      if(inside) this.set(x,y,col); } }
  };
}
function _dim(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*f), gg=Math.round(((n>>8)&255)*f), b=Math.round((n&255)*f);
  return 'rgb('+r+','+gg+','+b+')';
}

/* 方略ひとつぶんのエンブレム。
   なかまの色の盾＋、そのなかまの中での並び順で決まる印。
   同じなかまの中では印がすべて違うので、46枚が見分けられる。 */
const _embCache={};
const PHASE_COL={'見通す':'#2563EB','実行する':'#16A34A','振り返る':'#EA580C'};
function emblemCanvas(catKey,slot,owned,size,phase){
  const key=catKey+'_'+slot+'_'+(owned?1:0)+'_'+size+'_'+(phase||'')+'_'+DPR;
  if(_embCache[key]){
    const src=_embCache[key], c=document.createElement('canvas');
    c.width=src.width; c.height=src.height; c.style.width=size+'px'; c.style.height=size+'px';
    const g=c.getContext('2d'); g.imageSmoothingEnabled=false; g.drawImage(src,0,0); return c;
  }
  const cat=CATS[CI[catKey]], m=_pad(size,18);
  const edge = owned ? '#F5C842' : '#3b4370';
  const face = owned ? cat.color : '#262b4e';
  const shade= owned ? _dim(cat.color,.62) : '#1e2244';
  const mark = owned ? '#FFFFFF' : '#454d75';
  const band = owned ? (PHASE_COL[phase]||'#6b7399') : '#2b3157';   /* 学びの場面（フェーズ）の帯 */
  m.poly([[1,1],[17,1],[17,11],[9,17],[1,11]],edge);       /* 盾のふち */
  m.poly([[2,2],[16,2],[16,11],[9,16],[2,11]],face);       /* 中身 */
  m.box(2,2,16,3,band);                                    /* 学びの場面（フェーズ）の帯。盾の上に横一文字 */
  m.box(2,4,16,4,_dim(band,.55));
  m.poly([[2,11],[16,11],[16,11],[9,16],[2,11]],shade);    /* 先のほうを暗く */
  m.box(3,5,6,5,owned?'rgba(255,255,255,.45)':'rgba(255,255,255,.10)');  /* つや */
  /* 印：8種類 × 2（まわりの点あり／なし）＝16通り。なかまの中では必ず全部ちがう。 */
  const sym=slot%8, dot=Math.floor(slot/8)%2, cx=9, cy=8.6, R=4.2;
  if(sym===0){ /* 星 */
    const pts=[]; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, r=(i%2?R*0.46:R);
      pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); } m.poly(pts,mark);
  }else if(sym===1){ m.disc(cx,cy,R*0.92,mark); m.disc(cx,cy,R*0.42,face); }            /* 二重丸 */
  else if(sym===2){ m.poly([[cx,cy-R],[cx+R,cy],[cx,cy+R],[cx-R,cy]],mark); }           /* ひし形 */
  else if(sym===3){ m.poly([[cx,cy-R],[cx+R,cy+R*0.78],[cx-R,cy+R*0.78]],mark); }       /* 三角 */
  else if(sym===4){ /* 四方に伸びる光 */
    m.poly([[cx,cy-R],[cx+R*0.3,cy-R*0.3],[cx+R,cy],[cx+R*0.3,cy+R*0.3],[cx,cy+R],[cx-R*0.3,cy+R*0.3],[cx-R,cy],[cx-R*0.3,cy-R*0.3]],mark);
  }else if(sym===5){ m.ring(cx,cy,R,1.8,mark); }                                        /* 輪 */
  else if(sym===6){ /* 六角 */
    const pts=[]; for(let i=0;i<6;i++){ const a=-Math.PI/2+i*Math.PI/3;
      pts.push([cx+R*Math.cos(a), cy+R*Math.sin(a)]); } m.poly(pts,mark);
  }else{ m.box(cx-1,cy-4,cx+1,cy+4,mark); m.box(cx-4,cy-1,cx+4,cy+1,mark); }            /* 十字 */
  if(dot){ [[cx-6.3,cy-1.6],[cx+6.3,cy-1.6]].forEach(q=>m.disc(q[0],q[1],1.2,mark)); }
  _embCache[key]=m.c;
  return emblemCanvas(catKey,slot,owned,size,phase);
}

/* 称号のトロフィー。称号ごとに、カップの中の印が変わる。 */
const _trCache={};
function trophyCanvas(id,owned,size){
  const key=id+'_'+(owned?1:0)+'_'+size+'_'+DPR;
  if(_trCache[key]){
    const src=_trCache[key], c=document.createElement('canvas');
    c.width=src.width; c.height=src.height; c.style.width=size+'px'; c.style.height=size+'px';
    const g=c.getContext('2d'); g.imageSmoothingEnabled=false; g.drawImage(src,0,0); return c;
  }
  const m=_pad(size,24);
  const gold  = owned?'#F5C842':'#3a4066', goldD=owned?'#B8860B':'#2a2f52',
        goldL = owned?'#FFF3C4':'#4a5280', dark =owned?'#5A3A00':'#232848',
        ribbon= owned?'#DB2777':'#2b3157', mark =owned?'#6B4200':'#39406b';
  /* 光のすじ（豪華さ） */
  if(owned){ for(let i=0;i<8;i++){ const a=i*Math.PI/4;
    for(let r=9;r<12;r++) m.set(Math.round(12+r*Math.cos(a)),Math.round(10+r*Math.sin(a)),'rgba(245,200,66,.20)'); } }
  /* リボン */
  m.poly([[7,17],[12,20],[17,17],[17,22],[12,19],[7,22]],ribbon);
  /* 台座 */
  m.box(7,19,16,20,goldD); m.box(6,21,17,22,dark);
  m.box(11,16,12,19,goldD);
  /* カップ */
  m.poly([[5,2],[18,2],[17,10],[12,15],[6,10]],gold);
  m.poly([[6,3],[17,3],[16,9],[12,13],[7,9]],goldL);
  m.poly([[6,8],[17,8],[16,9],[12,14],[7,9]],goldD);
  /* 取っ手 */
  m.ring(4.0,6.0,3.2,1.4,gold); m.box(5,3,7,9,'rgba(0,0,0,0)');
  m.ring(19.0,6.0,3.2,1.4,gold); m.box(16,3,18,9,'rgba(0,0,0,0)');
  m.poly([[5,2],[18,2],[17,10],[12,15],[6,10]],gold);
  m.poly([[6,3],[17,3],[16,8],[12,13],[7,8]],goldL);
  m.poly([[6,8],[17,8],[16,9],[12,14],[7,9]],goldD);
  /* カップの中の印（称号ごと） */
  const cx=11.5, cy=6.5;
  if(id==='mix'){ m.ring(cx-1.8,cy,2.2,1.0,mark); m.ring(cx+1.8,cy,2.2,1.0,mark); }        /* かさなる輪 */
  else if(id==='guess'){ m.ring(cx,cy,3.0,1.0,mark); m.disc(cx,cy,1.0,mark); }             /* まと */
  else if(id==='combo'){ m.poly([[cx+1,cy-3.4],[cx-1.6,cy+.2],[cx-.2,cy+.2],[cx-1.4,cy+3.4],[cx+1.8,cy-.6],[cx+.4,cy-.6]],mark); } /* いなずま */
  else if(id==='keep'){ m.ring(cx,cy,3.2,1.0,mark); m.box(cx-1,cy-1,cx,cy+1,mark); }        /* 月桂の輪 */
  else if(id==='shine'){ m.poly([[cx,cy-3.6],[cx+1.1,cy-1.1],[cx+3.6,cy-.8],[cx+1.7,cy+.9],[cx+2.2,cy+3.4],[cx,cy+2.1],[cx-2.2,cy+3.4],[cx-1.7,cy+.9],[cx-3.6,cy-.8],[cx-1.1,cy-1.1]],mark); } /* 星 */
  else { m.box(cx-3,cy-2.5,cx+2,cy+2.5,mark); m.box(cx-1,cy-2.5,cx-1,cy+2.5,goldD); }       /* ひらいた本 */
  _trCache[id+'_'+(owned?1:0)+'_'+size+'_'+DPR]=m.c;
  return trophyCanvas(id,owned,size);
}

/* ============================================================
   音を鳴らしはじめる仕掛け（iPhone対策）
   ------------------------------------------------------------
   CEO報告（2026-08-25）：iPhoneで音が鳴らない。
     ①ブラウザの決まりで、最初に画面をさわるまで音は鳴らせない
        → さわられたら AudioContext を resume する。
          iPhoneはさわり方で届くできごとが変わるので、3種類とも待ち受け、
          一度きりにせず残しておく（1回目で鳴らなくても次のタップで試す）
     ②本体側面の消音スイッチ（マナーモード）が入っているときは、
        **すべての音が鳴らない**のが正しい動き（CEO決定 2026-08-25）。
        乗り物の中などで使うことを考えて、消音スイッチを尊重する。
        ＝WebAudioの音は「環境音」の扱いのままにしておく。
          消音でも鳴らす小細工（無音の音声を流し続ける方法）は
          いったん入れたが、この決定により取り外した。
     ③ホーム画面に戻ってからまた開くと、音が止まったままになることがある
        → 画面が戻ったときにもう一度かけ直す
   ============================================================ */
(function(){
  function restart(){
    if(!BGM.on) return;
    const n=bgmFor(current());
    BGM.name=null;            // 止まったままの状態から確実にかけ直す
    BGM.play(n);
  }
  function wake(){
    /* ① 眠っていたら起こす */
    const a=ac(); if(!a) return;
    if(a.state!=='running'){
      const r=a.resume();
      if(r&&r.then) r.then(restart,function(){});
      else restart();
    }else if(!BGM.timer){ restart(); }
  }
  /* さわり方で届くできごとが変わるので、3種類とも待ち受ける */
  ['pointerdown','touchend','click'].forEach(function(ev){
    document.addEventListener(ev,wake,{passive:true});
  });
  /* ③ 別のアプリから戻ってきたとき */
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) wake(); });
})();

/* ============================================================
   iPhone（iOS Safari）対策
   ------------------------------------------------------------
   CEO報告：パズル中に画面ごと動いてしまい、別の画面に変わってゲームが止まる。
   原因は3つ考えられるので、3つとも塞ぐ。
     ①指で盤面をなぞると、ページそのものがスクロールしてしまう
        → たまをつかんでいるあいだ、touchmove を全部止める（passive:false でないと効かない）
     ②画面の左右のふちから指を滑らせると、Safariが「前のページへ戻る」を実行する
        → ふちに透明な帯を置き、そこから始まった指の動きを受け止める
        → あわせて、盤面自体をふちから26px離す（layoutBoard）
     ③2本指や2回たたきで拡大してしまう
        → gesturestart と、素早い2回たたきを止める
   ============================================================ */
(function(){
  const held=()=>!!(G.held||G.tHeld);

  /* ① つかんでいるあいだは、ページを1ミリも動かさない */
  document.addEventListener('touchmove',function(e){
    if(held()) e.preventDefault();
  },{passive:false});

  /* 盤面の上では、つかんでいなくてもスクロールさせない。
     touchstart は止めない（止めると指の捕捉と噛み合わなくなることがある）。 */
  [boardWrap,tutoBoard].forEach(function(el){
    if(!el) return;
    el.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
  });

  /* ② 画面のふち：ここから始まった指の動きは、ぜんぶ受け止めて捨てる */
  ['edgeL','edgeR'].forEach(function(id){
    const g=document.getElementById(id); if(!g) return;
    ['touchstart','touchmove','touchend'].forEach(function(ev){
      g.addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); },{passive:false});
    });
  });
  /* 帯を出すのは、指でたまを動かす画面のときだけ（ボタンの邪魔をしないため） */
  window.setEdgeGuard=function(on){
    ['edgeL','edgeR'].forEach(function(id){
      const g=document.getElementById(id); if(g) g.classList.toggle('on',!!on);
    });
  };

  /* ③ 拡大させない */
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev,function(e){ e.preventDefault(); },{passive:false});
  });
  /* 2回たたきの拡大は、html/body の touch-action:manipulation が止める。
