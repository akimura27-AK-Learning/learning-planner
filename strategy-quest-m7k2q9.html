/* --- モンスター徘徊（プレイヤーを追いかける） --- */
setInterval(()=>{
  if(!gameActive || world.zone!=='cave' || inputLocked) return;
  const p = world.player;
  world.monsters.forEach(m=>{
    if(!m.alive || m.moving || m.still) return;
    let dx=0, dy=0;
    if(Math.random() < 0.6){
      // プレイヤーを追う
      const ddx = p.x - m.x, ddy = p.y - m.y;
      if(Math.abs(ddx) > Math.abs(ddy)) dx = Math.sign(ddx); else dy = Math.sign(ddy);
    } else {
      const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
      [dx,dy] = dirs[Math.floor(Math.random()*4)];
    }
    const nx = m.x+dx, ny = m.y+dy;
    if(nx===p.x && ny===p.y){ startBattle(m, true); return; }
    const occupied = world.monsters.some(o=>o!==m && o.alive && o.x===nx && o.y===ny);
    if(passable(world.map,nx,ny) && !occupied){ m.moving=true; m.tx=nx; m.ty=ny; }
  });
}, 520);

/* --- メインループ --- */
const WALK_SPEED = 2.4 * S; // px/frame
function moverStep(o, speed){
  if(!o.moving) return;
  const gx = o.tx*TILE, gy = o.ty*TILE;
  const ddx = gx - o.px, ddy = gy - o.py;
  const d = Math.abs(ddx)+Math.abs(ddy);
  if(d <= speed){ o.px=gx; o.py=gy; o.x=o.tx; o.y=o.ty; o.moving=false; }
  else { o.px += Math.sign(ddx)*Math.min(speed,Math.abs(ddx)); o.py += Math.sign(ddy)*Math.min(speed,Math.abs(ddy)); }
}
const TRAIL_GAP = Math.max(6, Math.round(TILE / WALK_SPEED) + 2);
function gameLoop(){
  if(!gameActive) return;
  animT += 0.016;
  const p = world.player;
  const beforeX = p.px, beforeY = p.py;
  moverStep(p, WALK_SPEED);
  if(trail.length && (Math.abs(trail[0].x-p.px)>TILE*2 || Math.abs(trail[0].y-p.py)>TILE*2)) trail=[];
  if(p.px!==beforeX || p.py!==beforeY){
    trail.unshift({x:p.px, y:p.py, dir:p.dir});
    if(trail.length > 220) trail.length = 220;
  }
  world.monsters.forEach(m=>moverStep(m, WALK_SPEED*0.55));
  if(!p.moving && heldDir && !inputLocked) attemptStep(heldDir);
  drawGame();
  requestAnimationFrame(gameLoop);
}

/* --- 描画 --- */
function drawGame(){
  fitCanvas();
  const p = world.player;
  const mapW = world.map[0].length*TILE, mapH = world.map.length*TILE;
  const vw = canvas.cssW, vh = canvas.cssH;
  const camX = Math.max(0, Math.min(mapW - vw, p.px + TILE/2 - vw/2));
  const camY = Math.max(0, Math.min(mapH - vh, p.py + TILE/2 - vh/2));
  ctx.fillStyle = world.zone==='castle' ? '#87A96B' : world.zone==='field' ? '#79B865' : caveTheme().bg;
  ctx.fillRect(0,0,vw,vh);
  const startCol = Math.floor(camX/TILE), startRow = Math.floor(camY/TILE);
  const cols = Math.ceil(vw/TILE)+2, rows = Math.ceil(vh/TILE)+2;
  for(let y=startRow; y<startRow+rows; y++){
    for(let x=startCol; x<startCol+cols; x++){
      if(y<0||x<0||y>=world.map.length||x>=world.map[0].length) continue;
      drawTile(world.map[y][x], x*TILE-camX, y*TILE-camY, x, y);
    }
  }
  if(world.zone==='field') drawCastleFacade(ctx, camX, camY);
  // 松明（城）
  if(world.zone==='castle'){
    TORCHES.forEach(([tx,ty])=>{
      const sx = tx*TILE-camX, sy = ty*TILE-camY;
      ctx.fillStyle='#8B6B3D'; ctx.fillRect(sx+TILE/2-2, sy+14, 4, 12);
      const f = Math.floor(animT*6)%2;
      ctx.fillStyle = f? '#F97316':'#F5C842';
      ctx.beginPath(); ctx.arc(sx+TILE/2, sy+10, f?5:6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#FFF3B0';
      ctx.beginPath(); ctx.arc(sx+TILE/2, sy+11, 2.5, 0, Math.PI*2); ctx.fill();
    });
  }
  // 描画物をy順に
  const drawables = [];
  /* なかまは どのゾーンでも、主人公の足あとを 少しおくれて たどる
     （自己調整だけのクエスト中は 城で待っているので描かない＝B案） */
  if(!soloQuest()) party.forEach((mem,i)=>{
    const t = trail[Math.min(trail.length-1, TRAIL_GAP*(i+1))];
    if(!t) return;
    drawables.push({y:t.y - 0.01, fn:()=>{
      const bob = Math.sin(animT*2.4 + i)*1.4;
      const spr = SPR[mem.spr];
      ctx.drawImage(spr, Math.round(t.x-camX), Math.round(t.y-camY + bob), spr.lw, spr.lh);
    }});
  });
  if(world.zone!=='cave'){
    world.npcs.forEach(n=>{
      drawables.push({y:n.y*TILE, fn:()=>{
        const bob = Math.sin(animT*2 + n.x)*1.5;
        ctx.drawImage(SPR[n.spr], Math.round(n.x*TILE-camX), Math.round(n.y*TILE-camY + bob), SPR[n.spr].lw, SPR[n.spr].lh);
      }});
    });
  }
  if(world.zone==='cave'){
    world.monsters.forEach(m=>{
      if(!m.alive) return;
      drawables.push({y:m.py, fn:()=>{
        const bob = Math.sin(animT*4 + m.x)*2;
        drawShadow(m.px-camX, m.py-camY);
        ctx.drawImage(SPR[m.spr], Math.round(m.px-camX), Math.round(m.py-camY + bob), SPR[m.spr].lw, SPR[m.spr].lh);
      }});
    });
    const b = world.boss;
    if(b && b.alive){
      drawables.push({y:b.py, fn:()=>{
        const bob = Math.sin(animT*2.2)*2.5;
        const bx = b.px-camX, by = b.py-camY;
        // 大魔王のオーラ
        const gl = 0.16 + Math.abs(Math.sin(animT*1.6))*0.16;
        ctx.fillStyle = `rgba(168,85,247,${gl})`;
        ctx.beginPath(); ctx.arc(bx+TILE/2, by+TILE/2, TILE*0.95, 0, Math.PI*2); ctx.fill();
        drawShadow(bx, by);
        ctx.drawImage(SPR[b.spr], Math.round(bx), Math.round(by + bob), SPR[b.spr].lw, SPR[b.spr].lh);
      }});
    }
  }
  drawables.push({y:p.py, fn:()=>{
    drawShadow(p.px-camX, p.py-camY);
    const set = p.dir==='down'? SPR.heroDown : p.dir==='up'? SPR.heroUp : p.dir==='left'? SPR.heroLeft : SPR.heroRight;
    const frame = p.moving ? (Math.floor((p.px+p.py)/12)%2) : 0;
    ctx.drawImage(set[frame], Math.round(p.px-camX), Math.round(p.py-camY), set[frame].lw, set[frame].lh);
  }});
  drawables.sort((a,b)=>a.y-b.y).forEach(d=>d.fn());
  /* 洞くつでは、ゆうしゃのまわりだけ明るい（たいまつの明かりのように） */
  if(world.zone==='cave' && caveTheme().dark){
    const lx = p.px-camX+TILE/2, ly = p.py-camY+TILE/2;
    const lg = ctx.createRadialGradient(lx, ly, TILE*1.3, lx, ly, TILE*5.4);
    lg.addColorStop(0,'rgba(5,3,12,0)'); lg.addColorStop(1,'rgba(5,3,12,.5)');
    ctx.fillStyle=lg; ctx.fillRect(0,0,vw,vh);
  }
}
function drawShadow(sx,sy){
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(sx+TILE/2, sy+TILE-3, 9, 3.2, 0,0,Math.PI*2); ctx.fill();
}
/* ============================================================
   タイルの描画（ロードマップと同じ質感）
   グラデーションを毎フレーム作ると重いので、タイル1種ごとに
   一度だけオフスクリーンへ描いて使い回す。光の明滅だけ後がけする。
   ============================================================ */
const TILE_CACHE = new Map();
function tileImg(key, painter){
  let c = TILE_CACHE.get(key);
  if(!c){
    c = document.createElement('canvas');
    c.width = Math.round(TILE*DPR); c.height = Math.round(TILE*DPR);
    const q = c.getContext('2d'); q.scale(DPR, DPR);
    painter(q);
    TILE_CACHE.set(key, c);
  }
  return c;
}
/* ちいさな道具：縦グラデーションで全面を塗る */
function tileBase(q, c0, c1){
  const gr = q.createLinearGradient(0,0,0,TILE);
  gr.addColorStop(0,c0); gr.addColorStop(1,c1);
  q.fillStyle=gr; q.fillRect(0,0,TILE,TILE);
}
function paintGrass(q, vr, bright){
  tileBase(q, bright?'#8AC671':'#8FBB74', bright?'#6FA95B':'#79A55F');
  const sp = [[6,9],[20,22],[13,15],[24,7]][vr];
  q.fillStyle='rgba(50,100,50,.35)';
  q.fillRect(sp[0],sp[1],5,2); q.fillRect((sp[0]+11)%26+2,(sp[1]+13)%26+2,4,2);
  q.fillStyle='rgba(230,250,215,.4)'; q.fillRect((sp[0]+5)%26+2,(sp[1]+7)%26+2,3,1.6);
  if(vr===2){ q.fillStyle=bright?'#FFF1A8':'#F5C842';
    q.beginPath(); q.arc(sp[0]+3, sp[1]-3, 1.8, 0, Math.PI*2); q.fill();
    q.fillStyle='rgba(255,255,255,.8)'; q.beginPath(); q.arc(sp[0]+2.4, sp[1]-3.7, 0.8, 0, Math.PI*2); q.fill(); }
  if(vr===3 && bright){ q.fillStyle='#FFC7D9';
    q.beginPath(); q.arc(sp[0], sp[1]+4, 1.6, 0, Math.PI*2); q.fill(); }
}
function paintTile(q, z, t, vr, par){
  if(z==='castle'){
    if(t===0){ paintGrass(q, vr, false); }
    else if(t===1){                                       // 石の床
      tileBase(q,'#E8DCBA','#CDBF98');
      if(par){ q.fillStyle='rgba(90,70,30,.05)'; q.fillRect(0,0,TILE,TILE); }
      q.fillStyle='#F4EACD'; q.fillRect(0,0,TILE,2); q.fillRect(0,0,1.6,TILE);
      q.fillStyle='#B4A57D'; q.fillRect(0,TILE-2,TILE,2); q.fillRect(TILE-2,0,2,TILE);
      if(vr===1){ q.strokeStyle='rgba(160,140,95,.6)'; q.lineWidth=1;
        q.beginPath(); q.moveTo(6,24); q.lineTo(13,17); q.lineTo(12,10); q.stroke(); }
    } else if(t===3){                                     // じゅうたん
      tileBase(q,'#B5404E','#93303D');
      q.fillStyle='#C9505E'; q.fillRect(3,3,TILE-6,TILE-6);
      if(vr%2){ q.fillStyle='#D8697A';
        q.beginPath(); q.moveTo(TILE/2,10); q.lineTo(TILE/2+6,TILE/2); q.lineTo(TILE/2,TILE-10); q.lineTo(TILE/2-6,TILE/2); q.closePath(); q.fill(); }
      q.fillStyle='#E8C464'; q.fillRect(0,0,2.4,TILE); q.fillRect(TILE-2.4,0,2.4,TILE);
      q.fillStyle='#8E2431'; q.fillRect(2.4,0,1.2,TILE); q.fillRect(TILE-3.6,0,1.2,TILE);
    } else if(t===4){                                     // 壇上
      tileBase(q,'#8E3040','#75242F');
      q.fillStyle='#A24350'; q.fillRect(3,3,TILE-6,TILE-6);
      q.fillStyle='rgba(232,196,100,.9)'; q.fillRect(0,TILE-3.4,TILE,3.4);
      q.fillStyle='rgba(255,255,255,.15)'; q.fillRect(3,3,TILE-6,2);
    } else if(t===2){                                     // 城のかべ
      tileBase(q,'#6C5E8E','#4A3F63');
      q.fillStyle='#7E70A6'; q.fillRect(0,0,TILE,3.4);
      q.fillStyle='#3B3153';
      q.fillRect(0,10,TILE,2); q.fillRect(0,21,TILE,2);
      q.fillRect(par?8:18,12,2,9); q.fillRect(par?22:6,23,2,9);
      q.fillStyle='rgba(0,0,0,.22)'; q.fillRect(0,TILE-2.4,TILE,2.4);
      q.fillStyle='rgba(255,255,255,.10)'; q.fillRect(par?4:14,5,6,3);
    } else if(t===5){                                     // 門
      tileBase(q,'#5E5178','#463C5E');
      const gr=q.createLinearGradient(0,0,0,TILE);
      gr.addColorStop(0,'#2A2148'); gr.addColorStop(1,'#0F0A20');
      q.fillStyle=gr;
      q.beginPath(); q.moveTo(4,TILE); q.lineTo(4,12);
      q.quadraticCurveTo(TILE/2,2,TILE-4,12); q.lineTo(TILE-4,TILE); q.closePath(); q.fill();
      q.fillStyle='#F5D36B'; q.fillRect(TILE/2-1,14,2,9);
      q.fillStyle='rgba(255,255,255,.14)'; q.fillRect(0,0,TILE,2);
    }
  } else if(z==='field'){
    if(t===0){ paintGrass(q, vr, true); }
    else if(t===13){                                      // 道（つち）
      tileBase(q,'#E2C494','#CBAA77');
      q.fillStyle='rgba(255,255,255,.22)'; q.fillRect(0,0,TILE,1.6);
      const st=[[7,11],[20,22],[12,24],[22,8]][vr];
      q.fillStyle='#B79A6C'; q.beginPath(); q.ellipse(st[0],st[1],2.6,1.8,0,0,Math.PI*2); q.fill();
      q.fillStyle='rgba(255,244,214,.6)'; q.beginPath(); q.ellipse(st[0]-0.7,st[1]-0.7,0.9,0.7,0,0,Math.PI*2); q.fill();
      if(vr===1){ q.fillStyle='#C4A071'; q.beginPath(); q.ellipse(9,22,2,1.4,0,0,Math.PI*2); q.fill(); }
    } else if(t===10){                                    // 砂浜
      tileBase(q,'#F4E6BE','#E2CFA0');
      for(let i=0;i<5;i++){ q.fillStyle='rgba(190,155,105,.45)';
        q.fillRect(((i*13+vr*7)%26)+3, ((i*19+vr*5)%26)+3, 2, 1.6); }
      if(vr===3){ q.strokeStyle='#C98F5F'; q.lineWidth=1.2;
        q.beginPath(); q.arc(20,20,3,Math.PI*0.15,Math.PI*0.95); q.stroke(); }
    } else if(t>=110 && t<113){                           // 海（3コマ）
      const ph=t-110;
      tileBase(q,'#58ABDF','#2C7CB8');
      q.fillStyle='rgba(255,255,255,.28)'; q.fillRect(0,0,TILE,2);
      q.fillStyle='rgba(20,70,120,.28)'; q.fillRect(0,TILE-6,TILE,6);
      q.fillStyle='rgba(255,255,255,.6)'; q.lineCap='round';

function drawTile(t, sx, sy, mx, my){
  sx = Math.round(sx); sy = Math.round(sy);
  const z = world.zone;
  const vr = ((mx*7+my*13)%4+4)%4;
  const par = (mx+my)&1;
  /* うごきのあるタイルは、コマ番号をタイル番号にたたんでキャッシュする */
  let tt = t;
  if(z==='field' && t===11) tt = 110 + Math.floor(animT*2 + mx*0.7 + my*1.3)%3;   // 海の波
  if(z==='cave'  && t===6)  tt = 160 + Math.floor(animT*3)%2;                     // 水晶の明滅
  const key = z+'|'+tt+'|'+vr+'|'+par + (z==='cave' ? '|'+(questEv().vtheme||'cave') : '');
  ctx.drawImage(tileImg(key, q=>paintTile(q, z, tt, vr, par)), sx, sy, TILE, TILE);
  /* 光の明滅だけ、その場で後がけする */
  if(z==='field' && t===14){
    const gl = 0.24 + Math.abs(Math.sin(animT*2.4))*0.26;
    const gr = ctx.createRadialGradient(sx+TILE/2, sy+TILE*0.72, 1, sx+TILE/2, sy+TILE*0.72, TILE*0.5);
    gr.addColorStop(0, `rgba(167,139,250,${gl})`); gr.addColorStop(1,'rgba(167,139,250,0)');
    ctx.fillStyle=gr; ctx.fillRect(sx,sy,TILE,TILE);
  } else if(z==='cave' && t===8){
    const pulse = 0.45 + Math.abs(Math.sin(animT*1.8))*0.45;
    ctx.strokeStyle = `rgba(245,200,66,${pulse})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx+TILE/2, sy+TILE/2, 8, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sx+TILE/2, sy+7); ctx.lineTo(sx+TILE/2+7, sy+TILE/2+5);
    ctx.lineTo(sx+TILE/2-7, sy+TILE/2+5); ctx.closePath(); ctx.stroke();
    ctx.lineWidth = 1;
  } else if(z==='cave' && t===15){
    const gl2 = 0.35 + Math.abs(Math.sin(animT*1.4))*0.35;
    ctx.fillStyle = `rgba(255,243,176,${gl2})`;
    ctx.fillRect(sx+8, sy+16, 16, TILE-16);
  }
}

/* --- HP表示 --- */
function heartsHTML(hp, maxHp){
  let s = '';
  for(let i=0;i<maxHp;i++){ s += i<hp ? '♥' : '♡'; }
  return s;
}
function updateHudHp(){
  const el = document.getElementById('hudHp');
  if(el) el.textContent = heartsHTML(world.player.hp, world.player.maxHp);
  if(typeof updateHudLv==='function') updateHudLv();
}

/* ============================================================
   ④ 戦闘（HPダメージ制 + ドット演出）
   ============================================================ */
const battleOverlay = document.getElementById('battleOverlay');
const btUi = document.getElementById('btUi');
const btCanvas = document.getElementById('btCanvas');
const btx = btCanvas.getContext('2d');
let usedCardIdx = new Set();
/* You（なかまと）：1回だけ「声かけ」で つぎのカードの効きが1段階上がる */
let btAssist = {avail:false, armed:false};

/* ============================================================
   成長システム：ストラテジーポイント（SP）とレベル
   モンスターに勝つとSPがもらえ、たまるとレベルが上がる。
   ・Lv2／Lv4：ねばり強さ＋1（さいだいHPが増える）
   ・Lv3：おまもり「ふみとどまる力」×1（クエスト中1回、ミスのダメージを0に）
   ・Lv5：おまもりが×2に
   がんばりの記録は この端末に残る（localStorage）。
   ============================================================ */
const growth = { sp:0, lv:1, spells:[] };
const LV_TH = [0, 10, 24, 42, 64];   // Lv1..Lv5 に必要な累計SP
const LV_REWARD = {
  2:'ねばり強さが 高まった！（さいだいHP +1）',
  3:'おまもり「ふみとどまる力」を おぼえた！（クエスト中1回、ミスのダメージを 0にする）',
  4:'ねばり強さが さらに 高まった！（さいだいHP +1）',
  5:'「ふみとどまる力」が 2回 つかえるように なった！',
};
function calcMaxHp(){ return 5 + (growth.lv>=2?1:0) + (growth.lv>=4?1:0); }
function charmMax(){ return growth.lv>=5? 2 : (growth.lv>=3? 1 : 0); }
function saveGrowth(){ try{ localStorage.setItem('sq-growth', JSON.stringify(growth)); }catch(e){} }
function loadGrowth(){ try{ const g=JSON.parse(localStorage.getItem('sq-growth')||'null');
  if(g && g.sp>=0){ growth.sp=g.sp; growth.lv=g.lv||1; growth.spells=g.spells||[]; } }catch(e){} }
loadGrowth();
function updateHudLv(){
  const next = LV_TH[growth.lv] !== undefined && growth.lv < 5 ? LV_TH[growth.lv] : null;
  const text = `Lv${growth.lv} ⭐${growth.sp}` + (next? `／${next}` : '') + ` ⚡${growth.spells.length}`;
  const el = document.getElementById('hudLv');
  if(el) el.textContent = text;
  const bl = document.getElementById('boardLv');
  if(bl) bl.textContent = text;
}
/* ぴったりで勝った方略は「じゅもん」として身につく */
function learnSpell(title){
  if(growth.spells.includes(title)) return false;
  growth.spells.push(title);
  saveGrowth(); updateHudLv();
  lvToast(`⚡ じゅもん『${title}』を おぼえた！<br>つぎから この方略は <b>3ダメージ</b>の こうげきに なる！`);
  return true;
}
/* レベルアップの お知らせ（戦闘の流れを止めない小さなトースト） */
function lvToast(text){
  let t = document.getElementById('lvToast');
  if(!t){
    t = document.createElement('div'); t.id='lvToast';
    t.style.cssText = 'position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:60;'+
      'font-family:"DotGothic16",monospace;font-size:13px;color:#fff;background:rgba(20,16,44,.95);'+
      'border:3px solid #F5C842;border-radius:12px;padding:10px 16px;max-width:86%;text-align:center;'+
      'box-shadow:0 6px 20px rgba(0,0,0,.5);transition:opacity .4s;line-height:1.8;pointer-events:none;';
    document.getElementById('stage').appendChild(t);
  }
  t.innerHTML = text;
  t.style.opacity = '1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>{ t.style.opacity='0'; }, 3200);
}
function gainSP(n){
  growth.sp += n;
  while(growth.lv < 5 && growth.sp >= LV_TH[growth.lv]){
    growth.lv++;
    const p = world.player;
    p.maxHp = calcMaxHp();
    p.hp = Math.min(p.maxHp, p.hp + 1);
    quest.charmLeft = Math.min(charmMax(), (quest.charmLeft||0) + 1);
    SFX.victory();
    lvToast(`⭐ <span style="color:#F5C842">レベルアップ！ Lv${growth.lv}</span><br>${LV_REWARD[growth.lv]||''}`);
  }
  saveGrowth();
  updateHudLv();
  updateHudHp();
}
let btMonster = null;
let btAnim = {t:0, flashW:0, flashR:0, lunge:0, dead:false, deadT:0, raf:null};

/* ============================================================
   戦闘モンスターのイラスト（グラデーション描き）
   探索中の小さな姿はレトロなドット絵のまま、戦闘の大きな姿は
   ロードマップ・けんじゃと同じなめらかなイラストで描く。
   一度描いたらキャッシュして使い回す。
   ============================================================ */
const MON_CACHE = new Map();
function monsterArt(m, w, h){
  const kind = (m.big||'').replace(/Big$/,'');
  const face = m.faces ? (m.faceIdx % m.faces.length) : -1;
  const cw = Math.round(Math.min(w * (m.boss ? 0.54 : 0.44), h * 0.82));
  const key = kind+'|'+(m.bkey||'')+'|'+face+'|'+cw;
  let c = MON_CACHE.get(key);
  if(!c){
    const ch = Math.round(cw * (m.boss ? 1.08 : 0.94));
    c = document.createElement('canvas');
    c.width = Math.max(1,Math.round(cw*DPR)); c.height = Math.max(1,Math.round(ch*DPR));
    const q = c.getContext('2d'); q.scale(DPR, DPR);
    const paint = MON_PAINTERS[kind];
    if(paint) paint(q, cw, ch, face, m);
    c.cssW = cw; c.cssH = ch;
    MON_CACHE.set(key, c);
  }
  return c;
}
/* 目（白目＋ひとみ）。lid=まぶたの下がり具合0〜1、angry=つり目 */
function monEye(q, x, y, r, px, py, lid, angry){
  q.fillStyle='#FFFFFF'; q.beginPath(); q.ellipse(x,y,r,r*1.05,0,0,Math.PI*2); q.fill();
  q.fillStyle='#2B2340'; q.beginPath(); q.arc(x+px*r*0.35, y+py*r*0.35, r*0.45, 0, Math.PI*2); q.fill();
  q.fillStyle='rgba(255,255,255,.85)'; q.beginPath(); q.arc(x+px*r*0.35-r*0.15, y+py*r*0.35-r*0.18, r*0.13, 0, Math.PI*2); q.fill();
  if(lid>0){ q.fillStyle=q.lidColor||'#4A3F63';
    q.beginPath(); q.ellipse(x, y-r*(1-lid), r*1.15, r*lid*1.1, 0, Math.PI, 0); q.fill(); }
  if(angry){ q.strokeStyle=q.lidColor||'#4A3F63'; q.lineWidth=r*0.32; q.lineCap='round';
    q.beginPath(); q.moveTo(x-r, y-r*1.15+(x<0?0:0)); q.lineTo(x+r*0.7, y-r*0.55); q.stroke(); }
}
const MON_PAINTERS = {

    q.beginPath(); q.arc(cx-16*u, cy-6*u, 12*u, Math.PI*0.2, Math.PI*1.05); q.stroke();

    q.lidColor='#6D7CA0';

    q.beginPath(); q.arc(cx, cy+12*u, 6*u, Math.PI*1.15, Math.PI*1.85); q.stroke();

  },
  /* ゆうわくインプ：むらさきの小悪魔。光るスマホで さそってくる */
  imp(q, W, H){

        q.strokeStyle='#1B1430'; q.lineWidth=r*0.13; q.lineCap='round';
        q.beginPath(); q.moveTo(mx2-r*0.48,my2-r*0.1); q.lineTo(mx2-r*0.12,my2-r*0.26); q.stroke();
        q.beginPath(); q.moveTo(mx2+r*0.48,my2-r*0.1); q.lineTo(mx2+r*0.12,my2-r*0.26); q.stroke();
        q.beginPath(); q.ellipse(mx2,my2+r*0.4,r*0.16,r*0.22,0,0,Math.PI*2); q.fill();
      } else {
        q.strokeStyle='#1B1430'; q.lineWidth=r*0.13; q.lineCap='round';
        q.beginPath(); q.moveTo(mx2-r*0.45,my2-r*0.12); q.lineTo(mx2-r*0.1,my2-r*0.12); q.stroke();
        q.beginPath(); q.moveTo(mx2+r*0.45,my2-r*0.12); q.lineTo(mx2+r*0.1,my2-r*0.12); q.stroke();
        q.beginPath(); q.ellipse(mx2,my2+r*0.35,r*0.28,r*0.18,0,0,Math.PI*2); q.fill();
      }
      q.restore();
    });
  },
};

function fitBt(){
  const r = btCanvas.getBoundingClientRect();
  fitHiDPI(btCanvas, btx, r.width, r.height);
}
function drawBattleFrame(){
  if(!battleOverlay.classList.contains('show')){ btAnim.raf=null; return; }
  btAnim.t += 0.016;
  const w = btCanvas.cssW, h = btCanvas.cssH;
  // 舞台の背景（テーマ色）
  const bTH = caveTheme();
  const grd = btx.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,bTH.battle[0]); grd.addColorStop(1,bTH.battle[1]);
  btx.fillStyle = grd; btx.fillRect(0,0,w,h);
  // 遠景シルエット
  btx.fillStyle=bTH.battle[2];
  btx.beginPath(); btx.moveTo(0,h*0.5);
  for(let i=0;i<=8;i++){ btx.lineTo(w*i/8, h*(0.42 + (i%2)*0.1 + (i%3)*0.03)); }
  btx.lineTo(w,h); btx.lineTo(0,h); btx.closePath(); btx.fill();
  // 水晶
  [[0.12,0.72],[0.88,0.68]].forEach(([px,py],i)=>{
    const x=px*w, y=py*h, gl = Math.floor(btAnim.t*3+i)%2;
    btx.fillStyle = gl? bTH.accent : bTH.accent+'B0';
    btx.beginPath(); btx.moveTo(x,y-22); btx.lineTo(x+12,y); btx.lineTo(x-12,y); btx.closePath(); btx.fill();
  });
  // 床
  btx.fillStyle = bTH.dark ? '#2E2347' : 'rgba(0,0,0,.18)';
  btx.beginPath(); btx.ellipse(w/2, h*0.88, w*0.36, h*0.12, 0, 0, Math.PI*2); btx.fill();
  if(btMonster){
    const spr = monsterArt(btMonster, w, h);
    const mw = spr.cssW, mh = spr.cssH;
    let mx = w/2 - mw/2, my = h*0.82 - mh;
    if(!btAnim.dead){
      my += Math.sin(btAnim.t*2.4)*4;
      if(btAnim.lunge > 0){
        my += btAnim.lunge*36; mx += Math.sin(btAnim.lunge*Math.PI*3)*8;
        btAnim.lunge = Math.max(0, btAnim.lunge - 0.05);
      }
      btx.save();
      btx.imageSmoothingEnabled = true;
      btx.drawImage(spr, Math.round(mx), Math.round(my), mw, mh);
      /* ダメージ数字が ふわりと うかぶ */
      if(btAnim.pop && btAnim.pop.t < 1){
        const pp = btAnim.pop; pp.t += 0.022;
        const px2 = pp.onMonster ? mx + mw/2 : w*0.5;
        const py2 = (pp.onMonster ? my + mh*0.3 : h*0.82) - pp.t*36;
        btx.globalAlpha = Math.min(1, 2-2*pp.t);
        btx.font = 'bold ' + Math.round(h*0.085) + 'px DotGothic16, monospace';
        btx.textAlign='center';
        btx.lineWidth = 5; btx.strokeStyle = 'rgba(10,8,24,.85)';
        btx.strokeText(pp.text, px2, py2);
        btx.fillStyle = pp.color;
        btx.fillText(pp.text, px2, py2);
        btx.globalAlpha = 1;
      }
      if(btAnim.flashW > 0){
        btx.globalAlpha = btAnim.flashW;
        btx.globalCompositeOperation = 'source-atop';
        btx.fillStyle = '#fff'; btx.fillRect(mx,my,mw,mh);
        btAnim.flashW = Math.max(0, btAnim.flashW - 0.07);
      }
      btx.restore();
      btx.globalAlpha = 1; btx.globalCompositeOperation = 'source-over';
    } else {
      btAnim.deadT += 0.03;
      const a = Math.max(0, 1 - btAnim.deadT);
      if(a > 0){
        btx.save(); btx.globalAlpha = a;
        btx.drawImage(spr, Math.round(mx), Math.round(my + btAnim.deadT*20), mw, mh);
        btx.restore();
      }
    }
  }
  if(btAnim.flashR > 0){
    btx.fillStyle = `rgba(220,40,60,${btAnim.flashR*0.55})`;
    btx.fillRect(0,0,w,h);
    btAnim.flashR = Math.max(0, btAnim.flashR - 0.06);
  }
  btAnim.raf = requestAnimationFrame(drawBattleFrame);
}

/* ============================================================
   We（みんなで）：さくせん会議
   ボス戦の前に、めあて・進め方・時間くばりを なかまと共有する
   （見通すフェーズの「社会的に共有された調整」）。
   そろった数だけ「みんなの おうえん」がたまり、ボス戦で身がわりになる。
   正解に見た目の印はつけない——自分たちで考えて選ぶのが学び。
   ============================================================ */
function showCouncil(done){
  const ev = questEv();
  quest.cheer = 0;
  quest.councilDone = true;
  const qs = [
    { q:'なかま「まず、<b>めあて</b>を そろえよう。この旅は、なんのための 旅だっけ？」',
      opts:[
        {t:`「${ev.goal}」のため！`, good:true},
        {t:'はやく おわらせるため', good:false},
        {t:'なんとなく……', good:false}] },
    { q:'なかま「つぎは <b>進め方</b>。ボスには どう いどむ？」',
      opts:[
        {t:'ぜんいんで 順番に 声を出す', good:true},
        {t:'つよい人に ぜんぶ まかせる', good:false},
        {t:'その場に なったら 考える', good:false}] },
    { q:'なかま「さいごに <b>時間</b>。のこりの時間は どう つかう？」',
      opts:[
        {t:'進みぐあいを 見て、くばり直す', good:true},
        {t:'さいごに まとめて がんばる', good:false},
        {t:'時間の ことは 気にしない', good:false}] },
  ];
  let idx = 0, fb = '';
  const step = ()=>{
    if(idx >= qs.length){
      const n = quest.cheer;
      SFX.appear();
      showBanner(
        `<div class="bn-text">さくせん会議 おわり！</div>
         <div class="bn-sub">${fb}みんなの おうえん <span style="color:#FFD166">${'♥'.repeat(n)}${'♡'.repeat(3-n)}</span><br>
         ${n===3?'みんなの 心が ひとつに なった！':(n>0?'まずまず そろった。':'心は まだ バラバラかも……。')}<br>
         おうえんは、ボス戦で ダメージの 身がわりに なってくれる。</div>`,
        [{label:'ボスの もとへ！', gold:true, fn:done}]);
      return;
    }
    const cur = qs[idx];
    showBanner(
      `<div class="bn-text">さくせん会議 ${idx+1}／3</div>
       <div class="bn-sub">${fb}${cur.q}</div>`,
      cur.opts.map(o=>({label:o.t, fn:()=>{
        if(o.good){ quest.cheer++; fb = 'なかま「いいね！ 心が そろってきた！」<br><br>'; }
        else { fb = 'なかま「うーん……それだと 心は そろわないかも」<br><br>'; }
        idx++; step();
      }})), true);
  };
  SFX.talk();
  step();
}

function startBattle(monster, ambush){
  /* We（みんなで）：ボス戦の前に「さくせん会議」で めあて・進め方・時間を共有する */
  if(monster.boss && (questEv().modes||[]).includes('We') && !quest.councilDone){
    showCouncil(()=>startBattle(monster, ambush));
    return;
  }
  inputLocked = true;
  heldDir = null;
  usedCardIdx = new Set();
  btAssist = {avail:(questEv().modes||[]).includes('You'), armed:false};
  monster.hp = monster.maxHp;
  btMonster = monster;
  btAnim = {t:0, flashW:0, flashR:0, lunge:0, dead:false, deadT:0, raf:btAnim.raf};
  bgmPlay(monster.boss ? 'boss' : 'battle');
  SFX.appear();
  btUi.innerHTML = renderBattleUI(monster, ambush);
  battleOverlay.classList.toggle('many', monster.cards.length >= 5);
  battleOverlay.classList.add('show');
  fitBt();
  if(!btAnim.raf) requestAnimationFrame(drawBattleFrame);
  bindBattleButtons(monster);
  const vb = document.getElementById('btVoice');
  if(vb) vb.onclick = ()=>{
    if(!btAssist.avail || btAssist.armed) return;
    btAssist.avail = false; btAssist.armed = true;
    vb.classList.add('armed'); vb.textContent = '声かけ 中！';
    SFX.talk();
    const r = document.getElementById('btResult');
    if(r) r.innerHTML = `<span class="tag">なかまが 声を かけてくれた！</span><br>「だいじょうぶ、いっしょに 考えよう。つぎの 一手に 力を こめて！」`;
  };
}
/* 大魔王は三つの顔が代わるがわる話しかけてくる。通常モンスターは固定のせりふ */
function curLine(m){
  if(m.faces && m.faces.length) return m.faces[m.faceIdx % m.faces.length];
  return m.line;
}
const FACE_NAMES = ['ゆうわく','ふあん','あき'];
const FACE_EMS   = ['◕‿◕','◔_◔','－_－'];
function facesHTML(m){
  if(!m.faces) return '';
  const cur = m.faceIdx % m.faces.length;
  return `<div class="bt-faces" id="btFaces">` + (m.faceNames||FACE_NAMES).map((nm,i)=>
    `<div class="fc f${i}${i===cur?' on':''}"><span class="em">${FACE_EMS[i]}</span>${nm}の顔</div>`
  ).join('') + `</div>`;
}
function updateFacesUI(m){
  const box = document.getElementById('btFaces');
  if(!box || !m.faces) return;
  const cur = m.faceIdx % m.faces.length;
  [...box.children].forEach((el,i)=> el.classList.toggle('on', i===cur));
}
function renderBattleUI(m, ambush){
  const intro = ambush ? `${m.name}が おそいかかってきた！` : `${m.name}が あらわれた！`;
  let html = `<div class="bt-hprow">
      <div class="dqwin bt-hpbox"><span class="who">ゆうしゃ</span><span class="bt-hearts" id="pHp">${heartsHTML(world.player.hp, world.player.maxHp)}</span></div>
      <div class="dqwin bt-hpbox" style="text-align:right"><span class="who">${m.name}</span><span class="bt-hearts enemy" id="mHp">${heartsHTML(m.hp, m.maxHp)}</span></div>
    </div>`;
  html += facesHTML(m);
  if(m.boss && (questEv().modes||[]).includes('We')){
    html += `<div class="dqwin bt-cheer" id="btCheer">みんなの おうえん ${'♥'.repeat(quest.cheer)}${'♡'.repeat(Math.max(0,3-quest.cheer))}</div>`;
  }
  html += `<div class="dqwin bt-msg" id="btResult"><span class="tag">${intro}</span><br>${curLine(m)}</div>`;
  if(btAssist.avail || btAssist.armed){
    html += `<div class="bt-assist"><span class="who2">なかまが いっしょに いる</span><button id="btVoice">なかまと 声かけ（あと1回）</button></div>`;
  }
  html += `<div class="dqwin bt-cmd"><div class="bt-cmd-label">▼ どの方略カードを つかう？</div><div id="btHand">`;
  m.cards.forEach((c,i)=>{
    const sp = growth.spells.includes(c.title) ? `<span class="bt-chip" style="background:#B8860B">⚡じゅもん</span>` : '';
    html += `<button class="bt-card-choice" data-i="${i}"><span class="cur">▶</span><span class="bt-chip ${c.phase}">${c.phase}</span>${sp}${c.title}</button>`;
  });
  html += `</div></div>`;
  return html;
}
function bindBattleButtons(monster){
  btUi.querySelectorAll('.bt-card-choice').forEach(btn=>{
    const i = +btn.dataset.i;
    btn.disabled = usedCardIdx.has(i);
    btn.onclick = ()=>onBattlePick(monster, i);
  });
}
function updateBattleHpUI(monster){
  const pHp = document.getElementById('pHp');
  if(pHp) pHp.textContent = heartsHTML(world.player.hp, world.player.maxHp);
  if(monster){
    const mHp = document.getElementById('mHp');
    if(mHp) mHp.textContent = heartsHTML(monster.hp, monster.maxHp);
  }
  updateHudHp();
}
function onBattlePick(m, i){
  const card = m.cards[i];
  /* 声かけ中なら、カードの効きが1段階上がる（合わない→おしい、おしい→ぴったり） */
  let judge = card.judge, boosted = false;
  if(btAssist.armed){
    btAssist.armed = false;
    const vb = document.getElementById('btVoice');
    if(vb){ vb.classList.remove('armed'); vb.disabled = true; vb.textContent = '声かけずみ'; }
    if(judge==='miss'){ judge='good'; boosted=true; }
    else if(judge==='good'){ judge='perfect'; boosted=true; }
  }
  usedCardIdx.add(i);
  if(m.faces){ m.faceIdx = (m.faceIdx + 1) % m.faces.length; updateFacesUI(m); }
  btUi.querySelectorAll('.bt-card-choice').forEach(b=>b.disabled=true);
  const resDiv = document.getElementById('btResult');

  if(judge==='miss'){
    let dmg = m.power + world.missStreak;
    world.missStreak++;
    let cheerHTML = '';
    /* We：さくせん会議でためた「みんなの おうえん」が 身がわりになる */
    if(m.boss && quest.cheer > 0){
      quest.cheer--;
      dmg = 0;
      cheerHTML = `<div class="dqwin bt-msg rescue" style="margin-top:8px"><span class="tag">みんなの おうえんが 守ってくれた！</span><br>ダメージを うけなかった。つぎの 一手を えらぼう。</div>`;
      const cb = document.getElementById('btCheer');
      if(cb) cb.textContent = 'みんなの おうえん ' + '♥'.repeat(quest.cheer) + '♡'.repeat(Math.max(0,3-quest.cheer));
    }
    /* Lv3で おぼえる おまもり「ふみとどまる力」 */
    if(dmg > 0 && (quest.charmLeft||0) > 0){
      quest.charmLeft--;
      dmg = 0;
      cheerHTML += `<div class="dqwin bt-msg rescue" style="margin-top:8px"><span class="tag">おまもり「ふみとどまる力」が 光った！</span><br>ダメージを うけなかった。（のこり ${quest.charmLeft}回）</div>`;
    }
    world.player.hp = Math.max(0, world.player.hp - dmg);
    btAnim.lunge = 1; btAnim.flashR = 1;
    btAnim.pop = dmg>0 ? {text:'-'+dmg, color:'#FF6E7E', t:0} : {text:'まもった！', color:'#8FD3F4', t:0};
    SFX.damage();
    updateBattleHpUI(m);
    /* まちがえすぎると、ゆうわくに まけて 学習・活動が 中断してしまう */
    if(world.player.hp <= 0){
      resDiv.className = 'dqwin bt-msg dmg shake';
      resDiv.innerHTML = `<span class="tag">${m.name}の はんげき！ ${dmg}の ダメージ！</span><br>目のまえが ぐらり……ゆうわくの ささやきに のみこまれていく……`;
      resDiv.insertAdjacentHTML('afterend', `<button class="bt-next" id="btFail">……</button>`);
      document.getElementById('btFail').onclick = ()=>questInterrupted(m);
      return;
    }
    resDiv.className = 'dqwin bt-msg dmg shake';
    const missTag = dmg===0 ? `${m.name}の はんげき！ ……しかし！` : `${m.name}の はんげき！ ${dmg}の ダメージ！`;
    resDiv.innerHTML = `<span class="tag">${missTag}</span><br>${m.result.missHint}`;
    resDiv.insertAdjacentHTML('afterend', cheerHTML + `<button class="bt-next" id="btRetry">もう一度 えらぶ</button>`);
    document.getElementById('btRetry').onclick = ()=>{
      SFX.confirm();
      btUi.querySelectorAll('.bt-msg.rescue, #btRetry').forEach(el=>el.remove());
      resDiv.className = 'dqwin bt-msg';
      resDiv.innerHTML = `<span class="tag">どうする？</span><br>${curLine(m)}`;
      bindBattleButtons(m);
    };
    return;
  }

  world.missStreak = 0;
  const isSpell = judge==='perfect' && growth.spells.includes(card.title);
  const dmgToMonster = isSpell ? 3 : (judge==='perfect' ? 2 : 1);
  m.hp = Math.max(0, m.hp - dmgToMonster);
  btAnim.flashW = 1;
  btAnim.pop = {text:'-'+dmgToMonster, color:'#FFF3C4', t:0, onMonster:true};
  SFX.hit();
  updateBattleHpUI(m);
  const boostTag = boosted ? 'なかまの 声かけが 力になった！ ' : '';
  const spellTag = isSpell ? `⚡じゅもん発動 『${card.title}』！ ` : '';
  const label = judge==='perfect' ? `${spellTag}${boostTag}ぴったり！ ${m.name}に ${dmgToMonster}の こうげき！` : `${boostTag}おしい！ ${m.name}に ${dmgToMonster}の こうげき！`;
  const text = judge==='perfect' ? m.result.perfect : m.result.good;
  resDiv.className = 'dqwin bt-msg';
  resDiv.innerHTML = `<span class="tag">${label}</span><br>${text}`;

  if(m.hp<=0){
    btAnim.dead = true; btAnim.deadT = 0;
    SFX.victory();
    const spGain = m.boss ? 5 : 2;
    gainSP(spGain);
    if(judge==='perfect') setTimeout(()=>learnSpell(card.title), 900);
    resDiv.innerHTML += `<br><span style="color:#F5C842">⭐ ストラテジーポイント +${spGain}！（合計 ${growth.sp}）</span>`;
    resDiv.insertAdjacentHTML('afterend', `<button class="bt-next" id="btNext">たびを つづける</button>`);
    document.getElementById('btNext').onclick = ()=>{
      m.alive = false;
      battleOverlay.classList.remove('show');
      btMonster = null;
      inputLocked = false;
      bgmPlay('cave');
      if(m.boss){
        setTimeout(onBossDown, 350);
      } else if(world.monsters.length && world.monsters.every(mm=>!mm.alive) && !quest.sealOpen){
        setTimeout(openSeal, 350);
      }
    };
  } else {
    resDiv.insertAdjacentHTML('afterend', `<button class="bt-next" id="btContinue">つづけて たたかう</button>`);
    document.getElementById('btContinue').onclick = ()=>{
      SFX.confirm();
      document.getElementById('btContinue').remove();
      resDiv.innerHTML = `<span class="tag">どうする？</span><br>${curLine(m)}`;
      bindBattleButtons(m);
    };
  }
}

/* ============================================================
   幼稚園のミニゲーム（指先で あそぶ・生活を ととのえる）
   ============================================================ */
const miniWrap = document.getElementById('miniWrap');
const miniCard = document.getElementById('miniCard');
function startMiniGame(ev){
  miniWrap.style.display='flex';
  if(ev.mini==='katazuke') mgKatazuke(ev);
  else if(ev.mini==='junbi') mgJunbi(ev);
  else mgHamigaki(ev);
}
function miniClear(ev, word){
  SFX.victory();
  gainSP(2);
  board.cleared.add(board.pos);
  setTimeout(()=>{
    miniWrap.style.display='none';
    showBanner(
      `<div class="bn-text">できた！ 『${ev.label}』</div>
       <div class="bn-sub">${word}<br><span style="color:#F5C842">⭐ ストラテジーポイント +2！</span></div>`,
      [{label:'つぎへ！', gold:true, fn:()=>{ diceBtn.disabled=false; boardSay('サイコロを ふって すすもう！'); }}]);
  }, 500);
}
/* ① おかたづけ：おもちゃを ドラッグして はこへ */
function mgKatazuke(ev){
  const toys=['🧸','⚽','🚗','🧩','📚','🖍'];
  miniCard.innerHTML = `<div class="mg-title">おかたづけ</div>
    <div class="mg-sub">おもちゃを ゆびで つまんで、はこに いれてね</div>
    <div id="mgArea"><div id="mgBox">おもちゃばこ</div></div>`;
  const area = document.getElementById('mgArea');
  const box = document.getElementById('mgBox');
  let done = 0;
  toys.forEach((t,i)=>{
    const el = document.createElement('div');
    el.className='mg-toy'; el.textContent=t;
    el.style.left = (8 + (i%3)*33 + (i*7)%8) + '%';
    el.style.top  = (6 + Math.floor(i/3)*26 + (i*11)%10) + '%';
    area.appendChild(el);
    el.addEventListener('pointerdown', e=>{
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      const r0 = el.getBoundingClientRect(), a0 = area.getBoundingClientRect();
      const ox = e.clientX - r0.left, oy = e.clientY - r0.top;
      const move = me=>{
        el.style.left = Math.max(0, Math.min(a0.width-40, me.clientX - a0.left - ox)) + 'px';
        el.style.top  = Math.max(0, Math.min(a0.height-40, me.clientY - a0.top - oy)) + 'px';
      };
      const up = ue=>{
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        const rb = box.getBoundingClientRect(), rt = el.getBoundingClientRect();
        const cx = rt.left + rt.width/2, cy = rt.top + rt.height/2;
        if(cx>rb.left && cx<rb.right && cy>rb.top-20 && cy<rb.bottom){
          SFX.confirm();
          el.remove();
          box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
          done++;
          box.textContent = `おもちゃばこ（${done}こ）`;
          if(done>=toys.length) miniClear(ev,'つかったものを もとに もどすと、つぎに あそぶとき すぐ 見つかるね！');
        }
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
    });
  });
}
/* ② あさのじゅんび：ただしい じゅんばんに タップ */
function mgJunbi(ev){
  const steps = [['🛌','おきる'],['🧼','かおを あらう'],['🍚','あさごはん'],['🎒','しゅっぱつ！']];
  const order = [0,1,2,3];
  const shuffled = [2,0,3,1];
  let next = 0;
  miniCard.innerHTML = `<div class="mg-title">あさの じゅんび</div>
    <div class="mg-sub">あさに やる ことを、じゅんばんに タップしてね</div>
    <div id="mgCards"></div>
    <div class="mg-done-row" id="mgDone"></div>`;
  const wrap = document.getElementById('mgCards');
  shuffled.forEach(idx=>{
    const b = document.createElement('button');
    b.className='mg-card';
    b.innerHTML = `<span class="big">${steps[idx][0]}</span>${steps[idx][1]}`;
    wrap.appendChild(b);
    b.onclick = ()=>{
      if(idx===order[next]){
        SFX.confirm();
        b.disabled = true;
        document.getElementById('mgDone').textContent += steps[idx][0] + '→';
        next++;
        if(next>=order.length){
          document.getElementById('mgDone').textContent = steps.map(s=>s[0]).join('→') + '　できた！';
          miniClear(ev,'じゅんばんに やると、あわてないで じゅんびできるね！');
        }
      } else {
        SFX.talk();
        b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      }
    };
  });
}
/* ③ はみがき：バイキンを タップで やっつける */
function mgHamigaki(ev){
  miniCard.innerHTML = `<div class="mg-title">はみがき</div>
    <div class="mg-sub">歯に ついた バイキンを ぜんぶ タップしてね</div>
    <div id="mgArea" style="background:#FFF3F0"><div style="position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:120px">😁</div></div>`;
  const area = document.getElementById('mgArea');
  const spots = [[26,34],[42,58],[58,36],[68,56],[34,62],[52,24]];
  let left = spots.length;
  spots.forEach(([x,y])=>{
    const g = document.createElement('div');
    g.className='mg-germ'; g.textContent='🦠';
    g.style.left = x+'%'; g.style.top = y+'%';
    area.appendChild(g);
    g.addEventListener('pointerdown', ()=>{
      SFX.hit();
      g.textContent='✨';
      g.style.pointerEvents='none';
      setTimeout(()=>g.remove(), 350);
      left--;
      if(left<=0) miniClear(ev,'ピッカピカ！ からだを きれいに すると、気もちも すっきりするね！');
    });
  });
}

/* ============================================================
   高校のマリオ風ミニゲーム（横スクロール）
   ◀▶で走り、ジャンプで とびこえ、★方略スターを あつめて 旗へ。
   モンスターは ふんづけると たおせる。おちたり ぶつかったりすると
   げんきが へり、0になると「つかれに まけて 中断」。
   ============================================================ */
const platWrap = document.getElementById('platWrap');
const platCanvas = document.getElementById('platCanvas');
const plx = platCanvas.getContext('2d');
const PT = 34;
const PLAT_LEVELS = {
  club:{ name:'部活の 走りこみ！', sky:['#FFC98A','#F4845F'], hill:'#B65D3C',
    gtop:'#7FB06B', gbody:'#8B6B3D', plat:'#C9A876',
    len:60, gaps:[[18,20],[34,36],[48,49]],
    plats:[[10,14,9],[22,26,7],[38,42,9]],
    stars:[[12,8],[24,6],[40,8],[30,11],[45,11],[6,11]],
    enemies:[[16,'slime'],[29,'oni'],[44,'bat'],[24,'imp']],
    flag:56 },
  baito:{ name:'アルバイト はじめての おとどけ！', sky:['#8FC0E8','#C6DDF0'], hill:'#6E7A8A',
    gtop:'#B0B6C0', gbody:'#7A828E', plat:'#D9B08A',
    len:62, gaps:[[12,13],[26,28],[42,44]],
    plats:[[8,11,9],[20,24,8],[32,36,9],[46,49,8]],
    stars:[[9,8],[22,7],[34,8],[48,7],[16,11],[55,11]],
    enemies:[[17,'mouse'],[38,'timebug'],[52,'imp'],[33,'bee']],
    flag:58 },
};
let plat = null;
function buildPlatGrid(def){
  const rows = 14;
  const g = [];
  for(let y=0;y<rows;y++) g.push(Array(def.len).fill('.'));
  for(let x=0;x<def.len;x++){
    if(!def.gaps.some(([a,b])=>x>=a&&x<=b)){ g[12][x]='#'; g[13][x]='#'; }
  }
  def.plats.forEach(([a,b,y])=>{ for(let x=a;x<=b;x++) g[y][x]='='; });
  def.stars.forEach(([x,y])=>{ g[y][x]='*'; });
  return g;
}
function platSolid(g,x,y){
  if(x<0||y<0||y>=g.length||x>=g[0].length) return x<0;
  const t=g[y][x]; return t==='#'||t==='=';
}
function startPlatformer(ev){
  quest.event = ev;
  const def = PLAT_LEVELS[ev.level];
  const grid = buildPlatGrid(def);
  const enemies = def.enemies.map(([col,spr])=>{
    let gy=0; while(gy<13 && !platSolid(grid,col,gy+1)) gy++;
    return { x:col*PT+4, y:gy*PT+PT-26, vx:0.7*(col%2?1:-1), spr, alive:true };
  });
  plat = { ev, def, grid, t:0,
    px:PT*1.2, py:10*PT, vx:0, vy:0, onG:false, face:1, inv:0,
    stars:0, enemies, L:false, R:false, raf:null, over:false };
  world.player.hp = world.player.maxHp;
  platWrap.style.display='block';
  board.active = false;
  bgmPlay('battle');
  platFit();
  platLoop();
}
function platFit(){
  const r = platWrap.getBoundingClientRect();
  fitHiDPI(platCanvas, plx, r.width, r.height);
}
function platEnd(){
  if(plat && plat.raf) cancelAnimationFrame(plat.raf);
  plat = null;
  platWrap.style.display='none';
  board.active = true;
  bgmPlay('board');
  requestAnimationFrame(drawBoard);
}
function platWin(){
  if(!plat || plat.over) return;
  plat.over = true;
  SFX.victory();
  const got = plat.stars, ev = plat.ev;
  gainSP(3 + got);
  board.cleared.add(board.pos);
  setTimeout(()=>{
    platEnd();
    showBanner(
      `<div class="bn-text">ゴール！ 『${ev.label}』クリア！</div>
       <div class="bn-sub">★方略スター ×${got}　<span style="color:#F5C842">⭐ ストラテジーポイント +${3+got}！</span><br>
       さいごまで 走りぬく力が ついてきた！</div>`,
      [{label:'つぎへ！', gold:true, fn:()=>{ diceBtn.disabled=false; boardSay('サイコロを ふって すすもう！'); }}]);
  }, 700);
}
function platFail(){
  if(!plat || plat.over) return;
  plat.over = true;
  const ev = plat.ev;
  setTimeout(()=>{
    platEnd();
    showBanner(
      `<div class="bn-text" style="color:#FF9EAA">『${ev.label}』を 中断してしまった……</div>
       <div class="bn-sub">つかれと ゆうわくに まけてしまった。<br>でも だいじょうぶ。同じマスに 止まれば、なんども ちょうせんできる！</div>`,
      [{label:'すごろくへ もどる', fn:()=>{ diceBtn.disabled=false; boardSay('もういちど ちょうせんしよう！'); }}]);
  }, 500);
}
function platHurt(knock){
  if(!plat || plat.inv>0 || plat.over) return;
  SFX.damage();
  world.player.hp = Math.max(0, world.player.hp-1);
  plat.inv = 75;
  plat.vy = -5; plat.vx = knock;
  if(world.player.hp<=0) platFail();
}
function platStep(){
  if(!plat || plat.over) return;
  const P = plat, g = P.grid;
  P.t += 0.016;
  if(P.inv>0) P.inv--;
  const SPD = 2.7;
  P.vx = (P.R?SPD:0) - (P.L?SPD:0) + (P.inv>60 ? P.vx*0.5 : 0);
  if(P.vx>0.2) P.face=1; else if(P.vx<-0.2) P.face=-1;
  const W=20, H=26, ox=6;
  /* よこ移動 */
  P.px += P.vx;
  if(P.vx>0){
    const cx = Math.floor((P.px+ox+W)/PT);
    if(platSolid(g,cx,Math.floor((P.py+4)/PT)) || platSolid(g,cx,Math.floor((P.py+H-2)/PT)))
      P.px = cx*PT - ox - W - 0.1;
  } else if(P.vx<0){
    const cx = Math.floor((P.px+ox)/PT);
    if(platSolid(g,cx,Math.floor((P.py+4)/PT)) || platSolid(g,cx,Math.floor((P.py+H-2)/PT)))
      P.px = (cx+1)*PT - ox + 0.1;
  }
  if(P.px < 0) P.px = 0;
  /* たて移動 */
  P.vy = Math.min(9, P.vy + 0.5);
  P.py += P.vy;
  P.onG = false;
  if(P.vy > 0){
    const cy = Math.floor((P.py+H)/PT);
    if(platSolid(g,Math.floor((P.px+ox+2)/PT),cy) || platSolid(g,Math.floor((P.px+ox+W-2)/PT),cy)){
      P.py = cy*PT - H - 0.1; P.vy = 0; P.onG = true;
    }
  } else if(P.vy < 0){
    const cy = Math.floor(P.py/PT);
    if(platSolid(g,Math.floor((P.px+ox+2)/PT),cy) || platSolid(g,Math.floor((P.px+ox+W-2)/PT),cy)){
      P.py = (cy+1)*PT + 0.1; P.vy = 0;
    }
  }
  /* おっこちた */
  if(P.py > g.length*PT + 60){
    world.player.hp = Math.max(0, world.player.hp-1);
    SFX.damage();
    if(world.player.hp<=0){ platFail(); return; }
    P.px = PT*1.2; P.py = 10*PT; P.vx=0; P.vy=0; P.inv=70;
  }
  /* 星あつめ */
  const scx = Math.floor((P.px+ox+W/2)/PT), scy = Math.floor((P.py+H/2)/PT);
  if(g[scy] && g[scy][scx]==='*'){ g[scy][scx]='.'; P.stars++; SFX.confirm(); }
  /* ゴールの旗 */
  if(scx >= P.def.flag){ platWin(); return; }
  /* モンスター */
  P.enemies.forEach(en=>{
    if(!en.alive) return;
    const ecx = Math.floor((en.x+12)/PT), ecy = Math.floor((en.y+12)/PT);
    const aheadX = Math.floor((en.x+12+Math.sign(en.vx)*16)/PT);
    if(platSolid(g,aheadX,ecy) || !platSolid(g,aheadX,ecy+1)) en.vx = -en.vx;
    en.x += en.vx;
    /* あたりはんてい */
    if(P.px+ox < en.x+22 && P.px+ox+W > en.x+2 && P.py < en.y+24 && P.py+H > en.y+4){
      if(P.vy > 1.5 && P.py+H < en.y+16){
        en.alive = false; P.vy = -6; P.stars++; SFX.hit();   // ふんづけた！
      } else {
        platHurt(Math.sign(P.px-en.x)*3);
      }
    }
  });
}
function platDraw(){
  if(!plat) return;
  const P = plat, g = P.grid, def = P.def;
  const w = platCanvas.cssW, h = platCanvas.cssH;
  const camX = Math.max(0, Math.min(def.len*PT - w, P.px - w*0.38));
  const camY = Math.max(0, g.length*PT - h + 20);
  let gr = plx.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,def.sky[0]); gr.addColorStop(1,def.sky[1]);
  plx.fillStyle=gr; plx.fillRect(0,0,w,h);
  /* とおくの山なみ */
  plx.fillStyle = def.hill; plx.globalAlpha = 0.35;
  for(let i=0;i<6;i++){
    const bx = ((i*260) - camX*0.4) % (w+520) - 130;
    plx.beginPath(); plx.moveTo(bx-130, h*0.72);
    plx.quadraticCurveTo(bx, h*0.42, bx+130, h*0.72); plx.fill();
  }
  plx.globalAlpha = 1;
  /* タイル */
  const x0 = Math.floor(camX/PT), x1 = Math.min(def.len-1, x0 + Math.ceil(w/PT) + 1);
  for(let y=0;y<g.length;y++){
    for(let x=x0;x<=x1;x++){
      const t = g[y][x];
      const sx = x*PT-camX, sy = y*PT-camY;
      if(t==='#'){
        plx.fillStyle = def.gbody; plx.fillRect(sx,sy,PT,PT);
        if(!platSolid(g,x,y-1)){ plx.fillStyle = def.gtop; plx.fillRect(sx,sy,PT,8); }
        plx.fillStyle = 'rgba(0,0,0,.08)'; plx.fillRect(sx,sy,1.6,PT);
      } else if(t==='='){
        gr = plx.createLinearGradient(0,sy,0,sy+PT*0.5);
        gr.addColorStop(0,def.plat); gr.addColorStop(1,'#8B6B3D');
        plx.fillStyle=gr; plx.fillRect(sx,sy,PT,PT*0.5);
        plx.fillStyle='rgba(255,255,255,.35)'; plx.fillRect(sx,sy,PT,3);
      } else if(t==='*'){
        const tw = 0.8 + Math.sin(P.t*5 + x)*0.2;
        plx.save(); plx.translate(sx+PT/2, sy+PT/2); plx.rotate(Math.sin(P.t*3+x)*0.3);
        plx.fillStyle='#F5C842';
        plx.beginPath();
        for(let k=0;k<10;k++){ const r=k%2? 5*tw : 11*tw; const a2=-Math.PI/2+k*Math.PI/5;
          k? plx.lineTo(Math.cos(a2)*r, Math.sin(a2)*r) : plx.moveTo(Math.cos(a2)*r, Math.sin(a2)*r); }
        plx.closePath(); plx.fill();
        plx.restore();
      }
    }
  }
  /* ゴールの旗 */
  const fx = def.flag*PT - camX;
  plx.strokeStyle='#5C3A21'; plx.lineWidth=4;
  plx.beginPath(); plx.moveTo(fx+PT/2, 12*PT-camY); plx.lineTo(fx+PT/2, 7*PT-camY); plx.stroke();
  plx.fillStyle='#E84C4C';
  plx.beginPath(); plx.moveTo(fx+PT/2, 7*PT-camY);
  plx.lineTo(fx+PT/2+26, 7.45*PT-camY); plx.lineTo(fx+PT/2, 7.9*PT-camY); plx.closePath(); plx.fill();
  /* モンスター */
  plx.imageSmoothingEnabled = false;
  P.enemies.forEach(en=>{
    if(!en.alive) return;
    const spr = SPR[en.spr] || SPR.slime;
    plx.drawImage(spr, Math.round(en.x-camX-4), Math.round(en.y-camY-6), spr.lw, spr.lh);
  });
  /* ゆうしゃ */
  if(!(P.inv>0 && Math.floor(P.t*20)%2)){
    const hs = P.face>=0 ? SPR.heroRight : SPR.heroLeft;
    const frame = P.onG && Math.abs(P.vx)>0.5 ? hs[Math.floor(P.t*8)%2] : hs[0];
    plx.drawImage(frame, Math.round(P.px-camX-6), Math.round(P.py-camY-6), frame.lw, frame.lh);
  }
  /* HUD */
  const hud = document.getElementById('platHud');
  hud.innerHTML = `${def.name}　${heartsHTML(world.player.hp, world.player.maxHp)}　★×${P.stars}`;
}
function platLoop(){
  if(!plat) return;
  platStep();
  if(plat){ platDraw(); plat.raf = requestAnimationFrame(platLoop); }
}
/* そうさ：ボタンとキーボード */
[['plL','L'],['plR','R']].forEach(([id,key])=>{
  const b = document.getElementById(id);
  const on = e=>{ e.preventDefault(); if(plat) plat[key]=true; };
  const off = e=>{ e.preventDefault(); if(plat) plat[key]=false; };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointerleave', off);
});
document.getElementById('plJ').addEventListener('pointerdown', e=>{
  e.preventDefault();
  if(plat && plat.onG){ plat.vy = -8.8; SFX.hop(); }
});
window.addEventListener('keydown', e=>{
  if(!plat) return;
  if(e.key==='ArrowLeft') plat.L=true;
  if(e.key==='ArrowRight') plat.R=true;
  if((e.key===' '||e.key==='ArrowUp') && plat.onG){ plat.vy=-8.8; SFX.hop(); }
});
window.addEventListener('keyup', e=>{
  if(!plat) return;
  if(e.key==='ArrowLeft') plat.L=false;
  if(e.key==='ArrowRight') plat.R=false;
});
window.addEventListener('resize', ()=>{ if(plat) platFit(); });

/* ---------------- 起動 ---------------- */
window.addEventListener('resize', ()=>{ if(battleOverlay.classList.contains('show')) fitBt(); });
/* ブラウザの決まりで、画面を一度さわるまで音は鳴らせない。
   最初のタップ（またはキー操作）で音を起こし、校庭の曲をはじめる。 */
function startAudio(){
  const a = ac(); if(!a) return;
  if(a.state === 'suspended') a.resume();
  applySound();
  if(!bgmCur) bgmPlay('board');
}
document.addEventListener('pointerdown', startAudio, {once:true});
document.addEventListener('keydown', startAudio, {once:true});
document.getElementById('soundBtn').addEventListener('click', e=>{
  e.stopPropagation();
  soundOn = !soundOn;
  try{ localStorage.setItem('sq-sound', soundOn ? 'on' : 'off'); }catch(err){}
  startAudio();
  applySound();
  if(soundOn) SFX.confirm();
});
applySound();
fitBoard();
boardSay('サイコロを ふって すすもう！<br><span style="color:#8890b8;font-size:11px">イベントマスに とまると、あたまの中の ぼうけんが はじまるよ</span>');
requestAnimationFrame(drawBoard);
showOpening();          // まずオープニング → 人生のロードマップ → すごろく の順で始まる
</script>
