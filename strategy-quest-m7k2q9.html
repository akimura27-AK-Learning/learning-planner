<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>ストラテジークエスト -ストクエ- 探索デモ v3（モニター版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF9F4; --ink:#273041; --line:#E3DDCB;
  --blue:#2563EB; --green:#16A34A; --orange:#EA580C;
  --gold:#F59E0B; --purple:#7C3AED;
  --win:#0a0e23;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"DotGothic16","Zen Maru Gothic",sans-serif;
  background:#14101f; color:var(--ink);
  display:flex; align-items:center; justify-content:center;
}
#stage{
  position:relative; width:100%; max-width:480px; aspect-ratio:3/4;
  background:#000; overflow:hidden; margin:0 auto;
  box-shadow:0 0 0 6px #1c1730, 0 20px 40px rgba(0,0,0,.5);
}
@media (min-height:700px) and (min-width:481px){ #stage{ border-radius:20px; } }
.layer{position:absolute; inset:0;}
canvas{image-rendering:pixelated;}

/* ===== ドラクエ風ウィンドウ ===== */
.dqwin{
  background:var(--win); border:3px solid #fff; border-radius:8px;
  box-shadow:0 0 0 3px var(--win);
  color:#fff; font-family:"DotGothic16",monospace;
}

/* ===== すごろくボード ===== */
#boardworld{ background:#79B865; }
#boardCanvas{ width:100%; height:100%; display:block; }
.board-hud{
  position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none;
}
.board-title{ font-size:13px; padding:6px 12px; }
.board-msg{
  position:absolute; left:12px; right:12px; bottom:86px;
  font-size:13px; line-height:1.8; padding:10px 12px; display:none;
}
.board-foot{
  position:absolute; left:0; right:0; bottom:0; padding:12px 14px 16px;
  display:flex; align-items:center; gap:12px;
  background:linear-gradient(0deg,rgba(0,0,0,.45),transparent);
}
#diceBtn{
  font-family:"DotGothic16",monospace; font-size:15px; color:#fff;
  background:var(--gold); border:3px solid #fff; border-radius:10px;
  padding:12px 22px; box-shadow:0 4px 0 #8a5a06;
}
#diceBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #8a5a06; }
#diceBtn:disabled{ opacity:.5 }
#diceFace{
  width:52px; height:52px; background:#fff; border-radius:10px; border:3px solid #221833;
  display:flex; align-items:center; justify-content:center;
  font-size:26px; font-weight:900; color:#221833; font-family:"DotGothic16",monospace;
}

/* ===== 汎用ポップアップ ===== */
#banner{
  position:absolute; inset:0; z-index:30; display:none;
  align-items:center; justify-content:center; padding:22px;
  background:rgba(10,8,20,.62);
}
#banner .bn-box{ width:100%; max-width:360px; padding:18px 16px; text-align:center; }
#banner .bn-illust{ margin:0 auto 8px; display:block; }
#banner .bn-text{ font-size:14px; line-height:2; color:#fff; }
#banner .bn-sub{ font-size:11px; color:#9aa3c7; margin-top:6px; line-height:1.8 }
#banner .bn-btns{ display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap }
#banner .bn-btns.col{ flex-direction:column; align-items:stretch; }
#banner .bn-btns.col button{ text-align:left; font-size:12.5px; line-height:1.6; padding:10px 12px; }
#banner .bn-btns.col button .pchip{ font-size:9.5px; padding:1px 6px; border-radius:4px; margin-right:6px; }
#banner .bn-btns.col button .pcat{ display:block; font-size:9.5px; color:#d8cffb; margin-top:3px; }
#banner button{
  font-family:"DotGothic16",monospace; font-size:14px; color:#fff;
  background:var(--purple); border:3px solid #fff; border-radius:10px; padding:11px 22px;
  box-shadow:0 4px 0 #4c1d95;
}
#banner button.gold{ background:var(--gold); box-shadow:0 4px 0 #8a5a06; }
#banner button:active{ transform:translateY(3px); box-shadow:none; }

/* ===== 脳内ダイブ ===== */
#swirl{ background:#000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; z-index:40;}
#swirl canvas{width:100%;height:100%}
#swirl .swirl-text{
  position:absolute; color:#fff; font-size:14px; letter-spacing:.15em;
  text-shadow:0 0 12px #7C3AED; opacity:0;
}

/* ===== ゲーム世界 ===== */
#gameworld{ opacity:0; pointer-events:none; background:#000; }
#gameCanvas{ width:100%; height:100%; display:block; }
.hud-top{
  position:absolute; top:0; left:0; right:0; padding:10px 12px;
  display:flex; align-items:center; justify-content:space-between; z-index:5; pointer-events:none;
}
.hud-zone{ font-size:12px; padding:6px 12px; }
.hud-hp{ font-size:12px; padding:6px 12px; color:#ff8fa8; }
.hud-left{ display:flex; gap:6px; align-items:center; }
.hud-phase{ font-size:11px; padding:6px 10px; background:var(--blue); border-color:#fff; }

/* ===== フェーズ切りかえ演出 ===== */
#phaseBand{
  position:absolute; inset:0; z-index:26; display:none;
  align-items:center; justify-content:center; pointer-events:none;
  background:rgba(8,6,18,.55); opacity:0; transition:opacity .35s ease;
}
#phaseBand .pb-in{ width:100%; text-align:center; padding:18px 0; }
#phaseBand .pb-bar{ height:5px; width:100%; }
#phaseBand .pb-title{ font-size:26px; color:#fff; letter-spacing:.22em; margin:12px 0 6px; text-shadow:0 3px 0 rgba(0,0,0,.5); }
#phaseBand .pb-sub{ font-size:12px; color:#dfe3f7; letter-spacing:.06em; }

#dialogueBox{
  position:absolute; left:10px; right:10px; bottom:104px; z-index:6;
  padding:12px 14px; font-size:14px; line-height:1.9; display:none;
}
#dialogueBox .dlg-name{font-size:11px;color:#ffd166;margin-bottom:4px}
#dialogueBox .dlg-hint{font-size:10px;color:#8890b8;text-align:right;margin-top:4px}

#controls{
  position:absolute; left:0; right:0; bottom:0; z-index:5;
  display:flex; align-items:flex-end; justify-content:space-between;
  padding:14px 14px 16px;
  background:linear-gradient(0deg,rgba(0,0,0,.5),transparent);
}
.dpad{ position:relative; width:132px; height:132px; }
.dpad button{
  position:absolute; width:44px; height:44px; border-radius:8px;
  background:rgba(10,14,35,.72); border:2px solid #fff;
  color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center;
}
.dpad button:active{ background:rgba(124,58,237,.8); }
.dpad .up{ top:0; left:44px; } .dpad .down{ bottom:0; left:44px; }
.dpad .left{ top:44px; left:0; } .dpad .right{ top:44px; right:0; }
.actionbtn{
  width:74px; height:74px; border-radius:50%; background:var(--gold);
  color:#fff; font-size:13px; border:3px solid #fff;
  font-family:"DotGothic16",monospace; box-shadow:0 4px 0 #8a5a06;
  display:flex; align-items:center; justify-content:center;
}
.actionbtn:active{ transform:translateY(3px); box-shadow:none; }

/* ===== 戦闘 ===== */
#battleOverlay{
  position:absolute; inset:0; z-index:20; opacity:0; pointer-events:none;
  background:#000; display:flex; flex-direction:column;
  transition:opacity .35s ease;
}
#battleOverlay.show{ opacity:1; pointer-events:auto; }
#btCanvas{ width:100%; height:36%; flex:0 0 36%; min-height:0; display:block; }
/* 手札が多いとき（大魔王戦＝5枚）は絵を小さくして、カードを全部見せる */
#battleOverlay.many #btCanvas{ height:25%; flex:0 0 25%; }
#battleOverlay.many .bt-msg{ font-size:12.5px; line-height:1.7; min-height:40px; padding:7px 10px; }
#battleOverlay.many .bt-card-choice{ font-size:12.5px; padding:5px 6px; }
#battleOverlay.many .bt-hpbox{ padding:4px 9px; font-size:11px; line-height:1.55 }
#battleOverlay.many .bt-cmd{ padding:6px 8px; }
#battleOverlay.many .bt-cmd-label{ padding:0 6px 4px; }
#battleOverlay.many .bt-faces .fc{ padding:3px 2px 4px; font-size:10px; }
#battleOverlay.many .bt-faces .fc .em{ font-size:13px; }
#battleOverlay.many .bt-ui{ gap:5px; }
/* 大魔王の「三つの顔」＝ゆうわく・ふあん・あき。いま話しかけている顔が光る */
.bt-faces{ display:flex; gap:6px; }
.bt-faces .fc{
  flex:1; text-align:center; padding:5px 2px 6px; font-size:10.5px;
  border-radius:6px; border:2px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.04); color:#9aa3c8; line-height:1.5;
  transition:all .25s ease;
}
.bt-faces .fc .em{ display:block; font-size:15px; line-height:1.1; opacity:.5 }
.bt-faces .fc.on{ border-color:#fff; color:#fff; }
.bt-faces .fc.on .em{ opacity:1 }
.bt-faces .fc.f0.on{ background:rgba(168,85,247,.42) }
.bt-faces .fc.f1.on{ background:rgba(125,211,232,.34) }
.bt-faces .fc.f2.on{ background:rgba(201,138,75,.38) }
.bt-ui{ flex:1; overflow-y:auto; padding:8px 10px 12px; display:flex; flex-direction:column; gap:8px; }
.bt-ui > *{ flex:0 0 auto; }
.bt-hprow{ display:flex; gap:8px; }
.bt-hpbox{ flex:1; padding:7px 10px; font-size:12px; line-height:1.7 }
.bt-hpbox .who{ color:#ffd166; font-size:10.5px; display:block }
.bt-hearts{ color:#ff6e8e; letter-spacing:2px; font-size:14px }
.bt-hearts.enemy{ color:#b18cff }
.bt-msg{ padding:10px 12px; font-size:13.5px; line-height:1.9; min-height:52px }
.bt-msg .tag{ color:#ffd166; }
.bt-msg.dmg .tag{ color:#ff6e8e }
.bt-msg.rescue{ border-color:#b18cff }
.bt-msg.rescue .tag{ color:#b18cff }
.bt-cmd{ padding:8px 8px; }
.bt-cmd-label{ font-size:11px; color:#8890b8; padding:2px 6px 6px; }
.bt-card-choice{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  background:none; border:none; color:#fff; font-family:"DotGothic16",monospace;
  font-size:13.5px; padding:8px 6px; line-height:1.5; border-radius:6px;
}
.bt-card-choice .cur{ width:14px; color:#fff; opacity:0; }
.bt-card-choice:hover .cur, .bt-card-choice:focus .cur{ opacity:1 }
.bt-card-choice:active{ background:rgba(124,58,237,.4) }
.bt-card-choice:disabled{ opacity:.35 }
.bt-chip{ font-size:10px; padding:2px 7px; border-radius:4px; color:#fff; flex:0 0 auto; }
.bt-chip.見通す{background:var(--blue)} .bt-chip.実行する{background:var(--green)} .bt-chip.振り返る{background:var(--orange)}
.bt-next{
  margin:2px auto 0; display:block; font-family:"DotGothic16",monospace; font-size:13.5px;
  color:#fff; background:var(--gold); border:3px solid #fff; border-radius:10px;
  padding:10px 26px; box-shadow:0 4px 0 #8a5a06;
}
.bt-next:active{ transform:translateY(3px); box-shadow:none }
/* ===== オープニング（ゲームの目的を語る場面） ===== */
#opening{ z-index:16; background:#05060f; transition:opacity .7s ease; }
#opening.hide{ opacity:0; pointer-events:none; }
#opCanvas{ width:100%; height:100%; display:block; }
#opCrawlWrap{
  position:absolute; left:0; right:0; top:7%; bottom:19%; overflow:hidden;
  perspective:300px;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 20%, #000 76%, transparent 96%);
  mask-image:linear-gradient(to bottom, transparent 0%, #000 20%, #000 76%, transparent 96%);
}
#opCrawl{
  position:absolute; left:7%; right:7%; top:0;
  transform-origin:50% 0; text-align:center;
  font-family:"DotGothic16",monospace; font-size:15px; line-height:2.15;
  color:#FFF3D6; text-shadow:0 0 14px rgba(255,196,86,.55), 0 2px 0 rgba(0,0,0,.6);
}
#opCrawl .op-lead{ color:#ffd166; font-size:12px; letter-spacing:.18em; margin-bottom:14px; }
#opCrawl p{ margin:0 0 22px; }
#opCrawl .op-key{ color:#ffd166; }
#opCrawl rt{ font-size:.5em; color:#ffd166; }
#opStart{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:9px; padding:22px; z-index:3;
}
#opStart .op-title{
  font-family:"DotGothic16",monospace; font-size:25px; color:#fff; letter-spacing:.10em;
  text-shadow:0 0 18px rgba(255,196,86,.7), 0 3px 0 rgba(0,0,0,.6); text-align:center; line-height:1.4;
}
#opStart .op-sub{ font-size:12px; color:#ffd166; letter-spacing:.3em; margin-bottom:16px; }
#opStart button{
  font-family:"DotGothic16",monospace; font-size:13.5px; color:#fff;
  background:var(--gold); border:3px solid #fff; border-radius:10px;
  padding:11px 20px; box-shadow:0 4px 0 #8a5a06; min-width:230px;
}
#opStart button.quiet{ background:#2b3357; box-shadow:0 4px 0 #151a31; font-size:12.5px; }
#opStart button:active{ transform:translateY(3px); box-shadow:none; }
#opStart .op-note{ font-size:10.5px; color:#8890b8; line-height:1.8; text-align:center; margin-top:6px; }
#opTeller{
  position:absolute; left:12px; bottom:12px; z-index:3; display:none;
  font-size:10.5px; padding:5px 10px; color:#ffd166;
}
#opSkip{
  position:absolute; right:12px; bottom:12px; z-index:3; display:none;
  font-family:"DotGothic16",monospace; font-size:11.5px; color:#fff;
  background:rgba(10,14,35,.85); border:2px solid #fff; border-radius:8px; padding:7px 13px;
}
#opSkip:active{ transform:translateY(2px); }

/* ===== 人生のロードマップ（現実世界の ひとつ上の階層） ===== */
#roadmap{ z-index:12; background:#0d1424; transition:opacity .55s ease; }
#roadmap.hide{ opacity:0; pointer-events:none; }
#roadCanvas{ width:100%; height:100%; display:block; }
.road-title{ position:absolute; top:10px; left:10px; font-size:12px; padding:6px 12px; }
#roadPanel{
  position:absolute; left:10px; right:10px; bottom:10px; padding:8px 11px;
  font-size:12px; line-height:1.7;
  background:rgba(10,14,35,.90);
}
#roadPanel .rp-stage{ color:#ffd166; font-size:13.5px; }
#roadPanel .rp-age{ color:#8890b8; font-size:10.5px; margin-left:6px; }
#roadPanel .rp-cap{ color:#fff; }
#roadPanel .rp-note{ color:#9aa3c7; font-size:10.5px; line-height:1.6; margin-top:3px; }
#roadPanel .rp-scenes{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
#roadPanel .rp-chip{
  font-size:9.5px; padding:1px 6px; border-radius:4px; color:#dfe3f7; line-height:1.6;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.22);
}
#roadPanel .rp-chip.on{ background:var(--green); border-color:#fff; color:#fff; }
#roadBtn{
  display:block; margin:8px auto 1px; font-family:"DotGothic16",monospace; font-size:12.5px;
  color:#fff; background:var(--gold); border:3px solid #fff; border-radius:9px;
  padding:7px 18px; box-shadow:0 4px 0 #8a5a06;
}
#roadBtn:active{ transform:translateY(3px); box-shadow:none }

/* ===== 音の オン・オフ ===== */
#soundBtn{
  position:absolute; right:8px; top:8px; z-index:60;
  width:34px; height:34px; padding:0; font-size:16px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  background:var(--win); border:3px solid #fff; border-radius:8px;
  box-shadow:0 0 0 3px var(--win); color:#fff; font-family:"DotGothic16",monospace;
}
#soundBtn:active{ transform:translateY(2px); }
#soundBtn.off{ color:#7a7f9c; }
#soundBtn.off::after{
  content:''; position:absolute; left:4px; right:4px; top:50%; height:2px;
  background:#ff6e8e; transform:rotate(-38deg);
}
/* HUDが音ボタンと重ならないよう、右側に場所をあける */
.hud-top{ padding-right:50px; }
.board-hud{ right:50px; }

@keyframes uiShake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }
.shake{ animation:uiShake .4s ease }
</style>
</head>
<body>
<!-- ▼▼ モニター版の入口（あいことば）　※モニター版_作成スクリプト.py が自動で挿入 ▼▼ -->
<div id="mgate" role="dialog" aria-modal="true" aria-label="あいことばの入力">
  <div id="mgate-card">
    <p id="mgate-badge">モニター版</p>
    <h1 id="mgate-title">ストラテジークエスト<br>-ストクエ-</h1>
    <p id="mgate-lead">あそんでみて、きづいたことを おしえてください。</p>
    <label id="mgate-label" for="mgate-input">あいことば</label>
    <input id="mgate-input" type="text" inputmode="latin" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="ここに入力してね">
    <p id="mgate-msg" aria-live="polite"></p>
    <button id="mgate-btn" type="button">はじめる</button>
    <p id="mgate-note">あいことばは、おしらせした人にきいてください。<br>
      きづいたこと・こまったことは、LINEにコメントしてください。</p>
  </div>
</div>
<style>
#mgate{
  position:fixed; inset:0; z-index:2147483647;
  display:flex; align-items:center; justify-content:center;
  padding:20px; background:#14101f;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  overflow:auto;
}
#mgate-card{
  width:100%; max-width:360px; background:#FAF9F4; color:#273041;
  border-radius:20px; padding:28px 24px 24px; text-align:center;
  box-shadow:0 18px 40px rgba(0,0,0,.45);
}
#mgate-badge{
  display:inline-block; margin:0 0 14px; padding:4px 14px;
  background:#F59E0B; color:#fff; border-radius:999px;
  font-size:12px; font-weight:700; letter-spacing:.08em;
}
#mgate-title{ margin:0 0 10px; font-size:19px; font-weight:900; line-height:1.5; }
#mgate-lead{ margin:0 0 22px; font-size:13px; line-height:1.8; color:#5b6472; }
#mgate-label{ display:block; margin:0 0 8px; font-size:13px; font-weight:700; }
#mgate-input{
  width:100%; padding:13px 14px; font-size:17px; text-align:center;
  border:2px solid #E3DDCB; border-radius:12px; background:#fff; color:#273041;
  font-family:inherit; user-select:text; -webkit-user-select:text;
}
#mgate-input:focus{ outline:none; border-color:#2563EB; }
#mgate-msg{ min-height:1.6em; margin:10px 0 0; font-size:13px; color:#2563EB; line-height:1.6; }
#mgate-btn{
  width:100%; margin:12px 0 0; padding:14px; font-size:16px; font-weight:700;
  color:#fff; background:#2563EB; border:none; border-radius:12px;
  font-family:inherit; cursor:pointer; box-shadow:0 4px 0 #1d4ed8;
}
#mgate-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #1d4ed8; }
#mgate-note{ margin:18px 0 0; font-size:11.5px; line-height:1.9; color:#8a8f99; }
</style>
<script>
(function(){
  var KEY = "sq-monitor", WANT = 1841026764;
  var gate = document.getElementById("mgate");
  function h32(s){ var h=5381; for(var i=0;i<s.length;i++){ h=(((h*33)>>>0) ^ s.charCodeAt(i))>>>0; } return h; }
  function store(v){ try{ localStorage.setItem(KEY, v); }catch(e){} }
  function open(){ if(gate && gate.parentNode){ gate.parentNode.removeChild(gate); } }
  try{ if(localStorage.getItem(KEY) === "ok"){ open(); return; } }catch(e){}
  var input = document.getElementById("mgate-input");
  var msg = document.getElementById("mgate-msg");
  function tryOpen(){
    var v = (input.value || "").trim().toLowerCase();
    if(!v){ msg.textContent = "あいことばを 入力してください。"; return; }
    if(h32(v) === WANT){ store("ok"); msg.textContent = "ようこそ！ はじめます。"; setTimeout(open, 250); }
    else { msg.textContent = "ちがうみたいです。もういちど たしかめてみてね。"; input.select(); }
  }
  document.getElementById("mgate-btn").addEventListener("click", tryOpen);
  // ゲーム本体が w/a/s/d や Enter を移動・決定に使い preventDefault することがあるため、
  // 入力欄のキー操作は本体へ渡さない（これをしないと「a」などが打てない）
  ["keydown","keyup","keypress","input"].forEach(function(type){
    input.addEventListener(type, function(e){ e.stopPropagation(); });
  });
  input.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); tryOpen(); } });
  setTimeout(function(){ try{ input.focus(); }catch(e){} }, 300);
})();
</script>
<!-- ▲▲ モニター版の入口（あいことば） ▲▲ -->

<div id="stage">

/* ---------------- 解像度（Retina対応） ----------------
   Canvasの内部解像度を画面の実ピクセル数に合わせる。
   これをしないと、Retinaでは絵を2〜3倍に引きのばして表示することになり、
   背景・校舎・トラックの白線・水しぶきなどの線がぼやける。
   座標系は今までどおりCSSピクセルのまま使えるよう、setTransformで倍率を吸収する。 */
const DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
function fitHiDPI(cv, cx, cssW, cssH){
  const w = Math.max(1, Math.round(cssW * DPR)), h = Math.max(1, Math.round(cssH * DPR));
  if(cv.width === w && cv.height === h && cv.cssW === cssW) return;   // 変わっていなければ何もしない
  cv.width = w; cv.height = h;
  cv.cssW = cssW; cv.cssH = cssH;      // 描画側はこちらを見る（cv.widthは実ピクセル数になるため）
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.imageSmoothingEnabled = false;    // ドット絵をぼかさない
}

/* ---------------- 効果音（WebAudio・レトロ電子音） ---------------- */
let AC = null, SFX_BUS = null, BGM_BUS = null;
function ac(){
  if(!AC){
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      SFX_BUS = AC.createGain(); SFX_BUS.gain.value = 1;    SFX_BUS.connect(AC.destination);
      BGM_BUS = AC.createGain(); BGM_BUS.gain.value = 0.85; BGM_BUS.connect(AC.destination);
      applySound();
    }catch(e){}
  }
  return AC;
}
function tone(freq, dur, type='square', vol=0.07, when=0, slideTo=null){
  const a = ac(); if(!a) return;
  const t0 = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.linearRampToValueAtTime(slideTo, t0+dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.connect(g).connect(SFX_BUS);
  o.start(t0); o.stop(t0+dur+0.02);
}

/* ============================================================

const SCALE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midiOf(n){
  const m = /^([A-G]#?)(-?\d+)$/.exec(n);
  return m ? SCALE_NAMES.indexOf(m[1]) + (parseInt(m[2],10)+1)*12 : 69;
}
function hzOf(mi){ return 440 * Math.pow(2, (mi-69)/12); }
/* コードのルート音の並びから低音パートを組み立てる（offsetは半音） */
function bassFrom(roots, pattern){
  const out = [];
  roots.forEach(r=>{ const b = midiOf(r); pattern.forEach(([off,d])=> out.push([b+off, d])); });
  return out;
}

let bgmBus = null, bgmTimer = null, bgmCur = null, bgmNextT = 0;
function bgmNote(freq, dur, type, vol, when){
  const a = ac(); if(!a || !bgmBus) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(vol, when+0.015);
  g.gain.setValueAtTime(vol, when+dur*0.6);
  g.gain.exponentialRampToValueAtTime(0.0008, when+dur);
  o.connect(g).connect(bgmBus);
  o.start(when); o.stop(when+dur+0.05);
}
/* 1周ぶんをまとめて予約する。戻り値は1周の長さ（秒） */
function scheduleSong(song, at){
  const beat = 60/song.bpm;
  let t = at;
  song.lead.forEach(([n,d])=>{
    if(n !== '-') bgmNote(hzOf(typeof n==='number'? n : midiOf(n)), d*beat*0.88, song.leadWave||'square', song.leadVol||0.045, t);
    t += d*beat;
  });
  const total = t - at;
  t = at;
  (song.bass||[]).forEach(([n,d])=>{
    if(n !== '-') bgmNote(hzOf(typeof n==='number'? n : midiOf(n)), d*beat*0.9, song.bassWave||'triangle', song.bassVol||0.035, t);
    t += d*beat;
  });
  return total;
}
function bgmTick(){
  const a = ac(); if(!a || !bgmCur) return;
  bgmNextT += scheduleSong(SONGS[bgmCur], bgmNextT);
  bgmTimer = setTimeout(bgmTick, Math.max(80, (bgmNextT - a.currentTime - 0.3)*1000));
}
function bgmStop(){
  if(bgmTimer){ clearTimeout(bgmTimer); bgmTimer = null; }
  bgmCur = null;
  if(bgmBus){
    const a = ac(), b = bgmBus; bgmBus = null;
    try{
      b.gain.cancelScheduledValues(a.currentTime);
      b.gain.setValueAtTime(b.gain.value, a.currentTime);
      b.gain.linearRampToValueAtTime(0.0001, a.currentTime + 0.25);   // ぶつっと切らずに消す
    }catch(e){}
    setTimeout(()=>{ try{ b.disconnect(); }catch(e){} }, 700);
  }
}
function bgmPlay(name){
  if(bgmCur === name) return;
  const a = ac(); if(!a || !SONGS[name]) return;
  bgmStop();
  if(a.state === 'suspended') a.resume();
  bgmBus = a.createGain(); bgmBus.gain.value = 1; bgmBus.connect(BGM_BUS);
  bgmCur = name;
  bgmNextT = a.currentTime + 0.1;
  bgmTick();
}

/* ---------------- ドット絵スプライト ---------------- */
function makeSprite(rowsRaw, pal, mirror){
  // 行の長さが不ぞろいでも崩れないように、最大幅に合わせて中央そろえで補正する
  const w = rowsRaw.reduce((a,r)=>Math.max(a, r.length), 0);
  const rows = rowsRaw.map(r=>{
    if(r.length === w) return r;
    const pad = w - r.length, l = Math.floor(pad/2);
    return '.'.repeat(l) + r + '.'.repeat(pad-l);
  });
  const h = rows.length;
  // 1ドット＝1ピクセルの素の大きさで作っておき、描くときに整数倍へ拡大する。
  // こうすると拡大率が必ず整数になり、ドットの大きさが場所によってズレない。
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((row,y)=>{
    for(let x=0;x<w;x++){
      const ch = row[mirror ? w-1-x : x];
      const col = pal[ch];
      if(col){ g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
  });
  c.dotW = w; c.dotH = h;        // ドットの数
  c.lw = w*S; c.lh = h*S;        // 画面に描くときの大きさ（CSSピクセル）
  return c;
}

/* けんじゃのイラスト（グラデーションで描く。u＝大きさの単位、身長は約130u） */
function drawSageIllust(g, cx, by, u, t){
  const bob = Math.sin(t*1.6)*1.5*u;
  const Y = v => by - v*u + bob;      // 足もとを0とした高さで指定する
  let gr;
  /* 足もとの光と かげ */
  gr = g.createRadialGradient(cx, Y(45), 2, cx, Y(45), 95*u);
  gr.addColorStop(0,'rgba(255,214,120,.26)'); gr.addColorStop(1,'rgba(255,214,120,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(cx, Y(45), 95*u, 0, Math.PI*2); g.fill();
  g.fillStyle='rgba(8,6,20,.5)';
  g.beginPath(); g.ellipse(cx, by, 30*u, 6*u, 0, 0, Math.PI*2); g.fill();
  /* つえ（からだの右がわ） */
  const sx2 = cx + 30*u;
  g.lineCap='round';
  g.strokeStyle='#5C3E24'; g.lineWidth=3.6*u;
  g.beginPath(); g.moveTo(sx2+3*u, Y(0)); g.lineTo(sx2-1*u, Y(96)); g.stroke();
  g.strokeStyle='#8B5E3C'; g.lineWidth=1.5*u;
  g.beginPath(); g.moveTo(sx2+2*u, Y(3)); g.lineTo(sx2-1.4*u, Y(93)); g.stroke();
  /* ローブ */
  gr = g.createLinearGradient(cx, Y(85), cx, Y(0));
  gr.addColorStop(0,'#22BCB2'); gr.addColorStop(0.55,'#0E8B85'); gr.addColorStop(1,'#095F5C');
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(cx-10*u, Y(85));
  g.bezierCurveTo(cx-20*u, Y(78), cx-24*u, Y(50), cx-27*u, Y(1));
  g.quadraticCurveTo(cx, Y(-3), cx+27*u, Y(1));
  g.bezierCurveTo(cx+24*u, Y(50), cx+20*u, Y(78), cx+10*u, Y(85));
  g.closePath(); g.fill();
  /* すそのかげ */
  g.fillStyle='rgba(3,42,40,.4)';
  g.beginPath(); g.ellipse(cx, Y(2), 25*u, 4.5*u, 0, 0, Math.PI); g.fill();
  /* 帯 */
  gr = g.createLinearGradient(cx-17*u, 0, cx+17*u, 0);
  gr.addColorStop(0,'#C89A18'); gr.addColorStop(0.5,'#F5C842'); gr.addColorStop(1,'#C89A18');
  g.fillStyle=gr; g.fillRect(cx-17*u, Y(50), 34*u, 5*u);
  /* そで（右手はつえへ） */
  g.fillStyle='#0C7F7A';
  g.beginPath(); g.ellipse(cx-16*u, Y(54), 11*u, 7*u,  0.45, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(cx+16*u, Y(58), 12*u, 7.5*u, -0.55, 0, Math.PI*2); g.fill();
  g.fillStyle='#FFD9A6';
  g.beginPath(); g.arc(sx2, Y(58), 4.6*u, 0, Math.PI*2); g.fill();
  /* 顔 */
  gr = g.createRadialGradient(cx-3*u, Y(93), 2, cx, Y(90), 14*u);
  gr.addColorStop(0,'#FFE6C0'); gr.addColorStop(1,'#EEC08E');
  g.fillStyle=gr;
  g.beginPath(); g.arc(cx, Y(90), 11.5*u, 0, Math.PI*2); g.fill();
  /* 白いひげ */
  gr = g.createLinearGradient(cx, Y(86), cx, Y(46));
  gr.addColorStop(0,'#FFFFFF'); gr.addColorStop(1,'#D6D1C4');
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(cx-13*u, Y(86));
  g.quadraticCurveTo(cx-17*u, Y(66), cx-8*u, Y(52));
  g.quadraticCurveTo(cx, Y(44), cx+8*u, Y(52));
  g.quadraticCurveTo(cx+17*u, Y(66), cx+13*u, Y(86));
  g.closePath(); g.fill();
  /* 口ひげ */
  g.fillStyle='#F5F2EA';
  g.beginPath(); g.ellipse(cx-4.4*u, Y(84.5), 5*u, 2.5*u,  0.28, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(cx+4.4*u, Y(84.5), 5*u, 2.5*u, -0.28, 0, Math.PI*2); g.fill();
  /* 目と まゆ */
  g.fillStyle='#2B2340';
  g.beginPath(); g.ellipse(cx-4.6*u, Y(90), 1.5*u, 2*u, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(cx+4.6*u, Y(90), 1.5*u, 2*u, 0, 0, Math.PI*2); g.fill();
  g.strokeStyle='#F5F2EA'; g.lineWidth=1.9*u;
  g.beginPath(); g.moveTo(cx-7.4*u, Y(95)); g.lineTo(cx-2.2*u, Y(94.2)); g.stroke();
  g.beginPath(); g.moveTo(cx+7.4*u, Y(95)); g.lineTo(cx+2.2*u, Y(94.2)); g.stroke();
  /* ぼうし（先が少しおじぎしている） */
  gr = g.createLinearGradient(cx, Y(130), cx, Y(96));
  gr.addColorStop(0,'#26C8BE'); gr.addColorStop(1,'#0B7C7C');
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(cx-15*u, Y(99));
  g.quadraticCurveTo(cx-10*u, Y(119), cx+2*u, Y(130));
  g.quadraticCurveTo(cx+9*u, Y(124), cx+7*u, Y(116));
  g.quadraticCurveTo(cx+8*u, Y(106), cx+15*u, Y(99));
  g.closePath(); g.fill();
  gr = g.createLinearGradient(cx, Y(103), cx, Y(93));
  gr.addColorStop(0,'#17A29C'); gr.addColorStop(1,'#095F5C');
  g.fillStyle=gr;
  g.beginPath(); g.ellipse(cx, Y(98), 21*u, 5*u, 0, 0, Math.PI*2); g.fill();
  g.fillStyle='#F5C842'; g.fillRect(cx-14.5*u, Y(102), 29*u, 3.2*u);
  /* つえの玉（ゆっくり明滅する） */
  const ox = sx2-1.2*u, oy = Y(101);
  const pulse = 0.6 + Math.abs(Math.sin(t*2.2))*0.4;
  gr = g.createRadialGradient(ox, oy, 1, ox, oy, 17*u);
  gr.addColorStop(0, 'rgba(210,190,255,'+(0.5*pulse)+')'); gr.addColorStop(1,'rgba(139,107,232,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(ox, oy, 17*u, 0, Math.PI*2); g.fill();
  gr = g.createRadialGradient(ox-2*u, oy-2.4*u, 1, ox, oy, 6.6*u);
  gr.addColorStop(0,'#F2EBFF'); gr.addColorStop(0.55,'#B79BFF'); gr.addColorStop(1,'#7C5BD6');
  g.fillStyle=gr; g.beginPath(); g.arc(ox, oy, 6.6*u, 0, Math.PI*2); g.fill();
  g.fillStyle='rgba(255,255,255,.9)';
  g.beginPath(); g.arc(ox-2*u, oy-2.6*u, 1.7*u, 0, Math.PI*2); g.fill();
}

/* 夜明け前の空と、語り手のけんじゃ */
function drawOpening(){
  const w = opCanvas.cssW, h = opCanvas.cssH;
  if(!w || !h) return;
  let g = opx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#05060F'); g.addColorStop(0.55,'#0D1330'); g.addColorStop(1,'#2A2350');
  opx.fillStyle=g; opx.fillRect(0,0,w,h);
  /* 星（ゆっくりまたたく） */
  for(let i=0;i<90;i++){
    const x = w*seeded(i,31), y = h*0.80*seeded(i,32);
    const tw = 0.35 + 0.65*Math.abs(Math.sin(opT*1.1 + i));
    opx.fillStyle = `rgba(255,246,214,${0.20+tw*0.55})`;
    opx.fillRect(x, y, 1.6, 1.6);
  }
  /* 地平線のほのかな明かり */
  g = opx.createRadialGradient(w*0.5, h*0.99, 0, w*0.5, h*0.99, h*0.42);
  g.addColorStop(0,'rgba(255,190,110,.34)'); g.addColorStop(1,'rgba(255,190,110,0)');
  opx.fillStyle=g; opx.fillRect(0,h*0.55,w,h*0.45);
  /* 語り手（けんじゃ）：ロードマップと同じ、なめらかなイラストで描く */
  if(opRunning){
    const u = Math.min(w*0.33, h*0.26) / 130;   // けんじゃの身長が画面の約4分の1になる単位
    drawSageIllust(opx, w*0.5, h*0.985, u, opT);
  }
}
function opLoop(){
  opT += 0.016;
  opFit();
  drawOpening();
  if(opRunning){
    const k = Math.min(1, (performance.now()-opCrawlT0)/opCrawlDur);
    const travel = opWrap.clientHeight + opCrawl.offsetHeight;
    opCrawl.style.transform = `rotateX(13deg) translateY(${opWrap.clientHeight - travel*k}px)`;
    if(k>=1 && !opCrawlDone){ opCrawlDone = true; opMaybeFinish(); }
  }
  opRaf = requestAnimationFrame(opLoop);
}
/* 端末に入っている声のなかから、いちばん自然な日本語の声を選ぶ。
   （Chromeの「Google 日本語」＞Siriの声＞高品質版Kyoko＞ふつうのKyoko の順）
   声そのものは端末のものを借りるので、音声ファイルは増えない。 */
function pickJaVoice(){
  try{
    const vs = speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang)||/日本語|Japanese/i.test(v.name));
    const rank = v=>{
      const n = v.name||'';
      if(/Google\s*日本語/i.test(n)) return 0;
      if(/Siri/i.test(n)) return 1;
      if(/Enhanced|拡張|Premium/i.test(n)) return 2;
      if(/Kyoko|Otoya|O-?ren|Hattori/i.test(n)) return 3;
      return 4;
    };
    return vs.sort((a,b)=>rank(a)-rank(b))[0] || null;
  }catch(e){ return null; }
}
/* 端末のよみあげ機能で語る（音声ファイルは使わない） */
function opSpeak(){
  if(!('speechSynthesis' in window)) return false;
  try{
    opVoiceDone = false;
    const finish = ()=>{ if(opVoiceWatch){ clearInterval(opVoiceWatch); opVoiceWatch=null; }
                         if(!opVoiceDone){ opVoiceDone = true; opMaybeFinish(); } };
    let li = 0;
    const speakNext = ()=>{
      if(!opRunning || li >= OP_LINES.length){ finish(); return; }
      const u = new SpeechSynthesisUtterance(OP_LINES[li++]);
      u.lang='ja-JP'; u.rate=0.96; u.pitch=1.0; u.volume=1;
      const v = pickJaVoice(); if(v) u.voice = v;
      u.onend  = ()=>setTimeout(speakNext, 650);   // 文と文のあいだの ひと呼吸
      u.onerror= finish;
      speechSynthesis.speak(u);
    };
    speechSynthesis.cancel();
    speakNext();
    /* 見はり役：声を持たない端末や、途中で止まるブラウザでも 先へ進めるように */
    let quiet = 0, ticks = 0;
    if(opVoiceWatch) clearInterval(opVoiceWatch);
    opVoiceWatch = setInterval(()=>{
      ticks++;
      try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){}
      const alive = speechSynthesis.speaking || speechSynthesis.pending;
      quiet = alive ? 0 : quiet+1;
      if(quiet >= 5 || ticks > 120) finish();      // 2.5秒 声がない／60秒たった
    }, 500);
    return true;
  }catch(e){ opVoiceDone = true; return false; }
}
function opBegin(withVoice){
  if(opRunning) return;
  SFX.confirm();
  opStart.style.display = 'none';
  opTeller.style.display = 'block';
  opSkip.style.display   = 'block';
  opCrawl.innerHTML = OP_CRAWL_HTML;
  opCrawlDone = false; opFinished = false;
  opRunning = true;
  opCrawlT0 = performance.now();
  if(withVoice){
    soundOn = true;
    try{ localStorage.setItem('sq-sound','on'); }catch(e){}
    startAudio();
    applySound();
    opVoiceDone = !opSpeak();      // よみあげが使えない端末では 文字だけで進む
  } else {
    opVoiceDone = true;
  }
}
/* 文字が流れ終わり、語りも終わったら つぎへ */
function opMaybeFinish(){
  if(opFinished || !opCrawlDone || !opVoiceDone) return;
  opFinished = true;
  setTimeout(opEnd, 700);
}
function opEnd(){
  if(opRaf){ cancelAnimationFrame(opRaf); opRaf=null; }
  if(opVoiceWatch){ clearInterval(opVoiceWatch); opVoiceWatch=null; }
  try{ speechSynthesis.cancel(); }catch(e){}
  opRunning = false;
  opEl.classList.add('hide');
  setTimeout(()=>{ opEl.style.display='none'; }, 800);
  showRoadmap('intro');
}
function showOpening(){
  opEl.classList.remove('hide');
  opFit();
  if(!opRaf) opRaf = requestAnimationFrame(opLoop);
}
document.getElementById('opBtnVoice').addEventListener('click', ()=>opBegin(true));
document.getElementById('opBtnMute').addEventListener('click',  ()=>opBegin(false));
opSkip.addEventListener('click', ()=>{ SFX.confirm(); opFinished = true; opEnd(); });

/* 480×640を基準にした位置（左右にふりながら 手前から奥へ のぼっていく道）
   下の1/4は説明パネルが出るので、道はそこに入らないように置く */
const LIFE_POS = [
  [0.22,0.660],[0.67,0.594],[0.22,0.528],[0.70,0.462],
  [0.25,0.396],[0.70,0.330],[0.41,0.268],
];
const ROAD_HZ = 0.21;      // 地平線の高さ（画面の高さに対する比）

const roadEl     = document.getElementById('roadmap');
const roadCanvas = document.getElementById('roadCanvas');
const rctx       = roadCanvas.getContext('2d');
const roadPanel  = document.getElementById('roadPanel');

function roadFit(){
  const r = stageEl.getBoundingClientRect();
  fitHiDPI(roadCanvas, rctx, r.width, r.height);
}
/* 決まった値を返す“乱数”（毎フレーム同じ絵になるように） */
function seeded(i, seed){ const x = Math.sin(i*127.1 + seed*311.7)*43758.5453; return x - Math.floor(x); }

/* --- 節をなめらかにつなぐ曲線（Catmull-Rom） --- */
function crPoint(p0,p1,p2,p3,t){
  const t2=t*t, t3=t2*t;
  return {
    x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
    y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
  };
}
function roadPath(w,h){
  if(roadPathCache && roadPathCache.w===w && roadPathCache.h===h) return roadPathCache;
  const nodes = LIFE_POS.map(([rx,ry])=>({x:rx*w, y:ry*h}));
  const P = [nodes[0], ...nodes, nodes[nodes.length-1]];
  const pts = [], idx = [], SAMP = 26;
  for(let i=1;i<P.length-2;i++){
    idx.push(pts.length);
    for(let k=0;k<SAMP;k++) pts.push(crPoint(P[i-1],P[i],P[i+1],P[i+2],k/SAMP));
  }
  idx.push(pts.length);
  pts.push(nodes[nodes.length-1]);
  roadPathCache = {w,h,pts,idx,nodes};
  return roadPathCache;
}
/* 節番号（小数OK）から道の上の座標を求める */
function roadPointAt(f,w,h){
  const P = roadPath(w,h);
  const i = Math.max(0, Math.min(LIFE.length-2, Math.floor(f)));
  const k = Math.round(P.idx[i] + (P.idx[i+1]-P.idx[i])*(f-i));
  return P.pts[Math.max(0, Math.min(P.pts.length-1, k))];
}

/* ---------------- 背景の部品 ---------------- */
function roundRectPath(x,y,w,h,r){
  rctx.beginPath();
  rctx.moveTo(x+r,y); rctx.lineTo(x+w-r,y); rctx.quadraticCurveTo(x+w,y,x+w,y+r);
  rctx.lineTo(x+w,y+h-r); rctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  rctx.lineTo(x+r,y+h); rctx.quadraticCurveTo(x,y+h,x,y+h-r);
  rctx.lineTo(x,y+r); rctx.quadraticCurveTo(x,y,x+r,y);
  rctx.closePath();
}
function softShadow(x,y,rx,ry){
  for(let i=3;i>=1;i--){
    rctx.fillStyle = `rgba(20,30,20,${0.055*i})`;
    rctx.beginPath(); rctx.ellipse(x, y, rx*(1+i*0.16), ry*(1+i*0.16), 0, 0, Math.PI*2); rctx.fill();
  }
}
function cloud(x,y,r,alpha){
  rctx.save();
  rctx.fillStyle = `rgba(255,255,255,${alpha})`;
  [[0,0,1],[-0.55,0.14,0.72],[0.58,0.16,0.66],[-0.24,-0.2,0.7],[0.28,-0.16,0.62]].forEach(([dx,dy,sc])=>{
    rctx.beginPath(); rctx.ellipse(x+r*dx, y+r*dy*0.9, r*sc*0.62, r*sc*0.34, 0, 0, Math.PI*2); rctx.fill();
  });
  rctx.restore();
}
/* 遠くの山なみ（上ほど淡い色にして 奥行きを出す） */
function ridge(w, topY, baseY, c0, c1, count, seed, snow){
  const g = rctx.createLinearGradient(0,topY,0,baseY);
  g.addColorStop(0,c0); g.addColorStop(1,c1);
  rctx.fillStyle = g;
  const n = count*2, span = baseY-topY, peaks = [];
  rctx.beginPath(); rctx.moveTo(-4, baseY+3);
  for(let i=0;i<=n;i++){
    const r = seeded(i,seed), r2 = seeded(i,seed+41), r3 = seeded(i,seed+77);
    // 峰は左右にずらして 山のかたむきを 非対称にする（三角形の並びに見えないように）
    const x = w*i/n + (i%2===1 ? (r3-0.5)*(w/n)*0.85 : 0);
    const y = (i%2===1) ? topY + span*(0.02 + r*0.44)      // 峰（高さはまちまち）
                        : baseY - span*(0.02 + r2*0.34);   // 谷
    if(i%2===1) peaks.push([x, y, (y-topY)/span]);
    rctx.lineTo(x, y);
  }
  rctx.lineTo(w+4, baseY+3); rctx.closePath(); rctx.fill();
  if(snow){
    // 高い峰だけ 雪をのせる
    peaks.filter(pk=>pk[2] < 0.30).forEach(([x,y])=>{
      rctx.fillStyle = 'rgba(255,255,255,.62)';
      rctx.beginPath(); rctx.moveTo(x, y+span*0.01);
      rctx.lineTo(x-span*0.085, y+span*0.16); rctx.lineTo(x-span*0.02, y+span*0.11);
      rctx.lineTo(x+span*0.035, y+span*0.17); rctx.lineTo(x+span*0.09, y+span*0.15);
      rctx.closePath(); rctx.fill();
    });
  }
}

    rctx.beginPath(); rctx.arc(x+dx*sc, y+dy*sc, r*sc, 0, Math.PI*2); rctx.fill();
  });
}

function schoolBuilding(x,y,sc,roofC0,roofC1,rows,cols,flag){

function clockFace(x,y,r){

/* ---------------- ロードマップの描画 ---------------- */
function drawRoadmap(){
  const w = roadCanvas.cssW, h = roadCanvas.cssH;
  if(!w || !h) return;
  const HZ = h*ROAD_HZ;                                // 地平線
  const P  = roadPath(w,h);

  /* 空 */
  let g = rctx.createLinearGradient(0,0,0,HZ*1.05);
  g.addColorStop(0,'#5D93D8'); g.addColorStop(0.5,'#A6CCEC'); g.addColorStop(1,'#FCE8C2');
  rctx.fillStyle=g; rctx.fillRect(0,0,w,HZ+2);
  /* 朝日 */
  const sx=w*0.74, sy=HZ*0.50, sr=h*0.23;
  g = rctx.createRadialGradient(sx,sy,0,sx,sy,sr);
  g.addColorStop(0,'rgba(255,247,216,.95)'); g.addColorStop(0.32,'rgba(255,226,164,.42)'); g.addColorStop(1,'rgba(255,222,152,0)');
  rctx.fillStyle=g; rctx.beginPath(); rctx.arc(sx,sy,sr,0,Math.PI*2); rctx.fill();
  rctx.fillStyle='#FFF8DA'; rctx.beginPath(); rctx.arc(sx,sy,h*0.024,0,Math.PI*2); rctx.fill();
  /* 雲（ゆっくり流れる） */
  const drift = (roadT*4)%(w+240);
  cloud((w*0.16+drift)%(w+240)-120, HZ*0.28, w*0.20, .55);
  cloud((w*0.62+drift*0.6)%(w+240)-120, HZ*0.17, w*0.15, .40);
  cloud((w*0.88+drift*0.35)%(w+240)-120, HZ*0.64, w*0.22, .30);
  /* 鳥（ゆっくり はばたきながら 流れていく） */
  for(let i=0;i<3;i++){
    const bx2 = (w*(0.2+i*0.33) + roadT*(10+i*4)) % (w+70) - 35;
    const by2 = HZ*(0.30+0.15*i) + Math.sin(roadT*1.2+i*2.1)*4;
    const fl = Math.sin(roadT*6+i*1.7)*2.8;
    rctx.strokeStyle='rgba(56,66,88,.6)'; rctx.lineWidth=1.5; rctx.lineCap='round';
    rctx.beginPath();
    rctx.moveTo(bx2-5, by2-fl); rctx.quadraticCurveTo(bx2-2, by2+2, bx2, by2);
    rctx.quadraticCurveTo(bx2+2, by2+2, bx2+5, by2-fl);
    rctx.stroke();
  }
  /* 山なみ（奥→手前） */
  ridge(w, HZ*0.30, HZ+6,  '#AEC2D8','#C6D4E2', 6, 3,  true);
  ridge(w, HZ*0.52, HZ+9,  '#93AEBE','#AAC0C6', 7, 11, true);
  ridge(w, HZ*0.74, HZ+12, '#7E9E92','#96B3A4', 9, 29, false);

  /* 地面 */
  g = rctx.createLinearGradient(0,HZ-2,0,h);
  g.addColorStop(0,'#9CC783'); g.addColorStop(0.35,'#84B76C'); g.addColorStop(1,'#5C9150');
  rctx.fillStyle=g; rctx.fillRect(0,HZ-2,w,h-HZ+2);
  /* 遠くの畑（横のしま模様）と、ところどころの畑地 */
  for(let i=0;i<6;i++){
    rctx.fillStyle = i%2 ? 'rgba(255,255,255,.07)' : 'rgba(60,110,60,.08)';
    rctx.fillRect(0, HZ + i*(h*0.016), w, h*0.016);
  }
  for(let i=0;i<7;i++){
    const y = HZ + (h-HZ)*(0.10+seeded(i,21)*0.70), x = w*seeded(i,22);
    const bw = w*(0.10+seeded(i,23)*0.16), bh = h*(0.014+seeded(i,24)*0.026);
    rctx.fillStyle = seeded(i,25)>0.5 ? 'rgba(150,190,120,.30)' : 'rgba(110,160,105,.28)';
    rctx.beginPath(); rctx.ellipse(x, y, bw, bh, 0, 0, Math.PI*2); rctx.fill();
  }
  /* 草の点々 */
  for(let i=0;i<260;i++){
    const t = seeded(i,1), u = seeded(i,2);
    const y = HZ + (h-HZ)*Math.pow(u,0.75), x = w*t;
    const sc = 0.4 + (y-HZ)/(h-HZ);
    rctx.fillStyle = seeded(i,3)>0.5 ? 'rgba(255,255,255,.13)' : 'rgba(45,95,50,.16)';
    rctx.fillRect(x, y, 2.2*sc, 1.4*sc);
  }

  /* 道（下ほど太く＝手前ほど太く見せる） */
  const wAt = y => 8 + 21*Math.max(0, Math.min(1,(y-HZ)/(h-HZ)));
  for(let pass=0; pass<3; pass++){
    rctx.lineCap='round'; rctx.lineJoin='round';
    for(let i=1;i<P.pts.length;i++){
      const a=P.pts[i-1], b=P.pts[i], lw=wAt(a.y);
      if(pass===0){ rctx.strokeStyle='rgba(60,80,55,.20)'; rctx.lineWidth=lw+6; }
      else if(pass===1){ rctx.strokeStyle='#C9B78C'; rctx.lineWidth=lw; }
      else { rctx.strokeStyle='#E6D9B4'; rctx.lineWidth=lw*0.52; }
      rctx.beginPath(); rctx.moveTo(a.x,a.y); rctx.lineTo(b.x,b.y); rctx.stroke();
    }
  }
  /* 小石 */
  for(let i=6;i<P.pts.length;i+=7){
    const q=P.pts[i], sc=wAt(q.y)/22, o=(seeded(i,5)-0.5)*wAt(q.y)*0.5;
    rctx.fillStyle='rgba(120,105,75,.35)';
    rctx.beginPath(); rctx.ellipse(q.x+o, q.y, 1.7*sc, 1.1*sc, 0, 0, Math.PI*2); rctx.fill();
  }

  /* 木・しげみ・花（道の上に置かないよう、道からの きょりを見てから置く） */
  const far = (x,y)=>{
    let d = 1e9;
    for(let i=0;i<P.pts.length;i+=3){
      const q=P.pts[i], dx=q.x-x, dy=(q.y-y)*1.6;
      d = Math.min(d, dx*dx+dy*dy);
    }
    return d > 34*34;
  };
  for(let i=0;i<58;i++){
    const y = HZ + (h-HZ)*Math.pow(seeded(i,7), 0.85);
    const x = w*seeded(i,8);
    if(x<10 || x>w-10 || !far(x,y)) continue;
    const sc = 0.40 + (y-HZ)/(h-HZ)*0.95;
    if(seeded(i,9) > 0.34) tree(x,y,sc);
    else {                                        // しげみ
      softShadow(x,y+1,8*sc,3*sc);
      const g2 = rctx.createRadialGradient(x-2*sc,y-6*sc,1,x,y-4*sc,8*sc);
      g2.addColorStop(0,'#8CD183'); g2.addColorStop(1,'#3F7F46');
      rctx.fillStyle=g2;
      [[-4,-3,4.6],[0,-5,5.4],[4,-3,4.2]].forEach(([dx,dy,r])=>{
        rctx.beginPath(); rctx.arc(x+dx*sc,y+dy*sc,r*sc,0,Math.PI*2); rctx.fill(); });
    }
  }
  for(let i=0;i<90;i++){                          // 小さな花
    const y = HZ + (h-HZ)*Math.pow(seeded(i,12), 0.8);
    const x = w*seeded(i,13);
    if(x<6 || x>w-6 || !far(x,y)) continue;
    const sc = 0.5 + (y-HZ)/(h-HZ)*0.8;
    rctx.fillStyle = ['#FFF1A8','#FFC7D9','#FFFFFF','#CDE7FF'][i%4];
    rctx.beginPath(); rctx.arc(x, y-1.5*sc, 1.5*sc, 0, Math.PI*2); rctx.fill();
  }

  /* ステージ（奥から手前へ重ねる） */
  const order = LIFE.map((s,i)=>i).sort((a,b)=>LIFE_POS[a][1]-LIFE_POS[b][1]);
  order.forEach(i=>{
    const st = LIFE[i], n = P.nodes[i];
    const sc = 0.52 + (n.y-HZ)/(h-HZ)*0.62;
    const past = i < life.idx, here = i === life.idx;
    const labelLeft = LIFE_POS[i][0] > 0.5;              // 名前の札を左に出すか
    const bdx = (labelLeft ? 1 : -1) * 30 * sc;          // 建物は札の反対がわへ
    rctx.save();
    if(!past && !here) rctx.globalAlpha = 0.62;          // これからのステージは うすく
    LM[st.key](n.x + bdx, n.y, sc);
    rctx.restore();
    /* いまいる場所の 光のわ */
    if(here && !life.walking){
      const pulse = 0.5 + Math.sin(roadT*2.6)*0.5;
      rctx.strokeStyle = `rgba(255,214,102,${0.35+pulse*0.45})`;
      rctx.lineWidth = 2.4;
      rctx.beginPath(); rctx.ellipse(n.x, n.y+2, (26+pulse*5)*sc, (9+pulse*2)*sc, 0, 0, Math.PI*2); rctx.stroke();
    }
    /* 名前の札（道の反対がわに置く） */
    const label = st.name;
    rctx.font = `${Math.round(11*Math.min(1.25,sc+0.35))}px DotGothic16, monospace`;
    const tw = rctx.measureText(label).width;
    const leftSide = labelLeft;
    const px = leftSide ? n.x - 20*sc - tw - 14 : n.x + 20*sc;
    const py = n.y - 16*sc;
    rctx.fillStyle = past ? 'rgba(22,34,56,.72)' : here ? 'rgba(234,88,12,.95)' : 'rgba(30,44,70,.70)';
    roundRectPath(px, py, tw+13+(past?13:0), 19, 5); rctx.fill();
    if(here){ rctx.strokeStyle='#fff'; rctx.lineWidth=1.6; rctx.stroke(); }
    rctx.fillStyle = past ? 'rgba(255,255,255,.72)' : '#fff';
    rctx.textBaseline='middle';
    rctx.fillText(label, px+6.5, py+10.5);
    if(past){
      rctx.fillStyle='#7EE79B'; rctx.font='11px DotGothic16, monospace';
      rctx.fillText('✓', px+tw+10, py+10.5);
    }
  });

  /* きみのコマ（歩くほど大きくなる＝成長） */
  const q = roadPointAt(life.pos, w, h);
  const gsc = 0.62 + life.pos*0.045;
  const spr = SPR.heroUp[ life.walking ? (Math.floor(roadT*7)%2) : 0 ];
  softShadow(q.x, q.y+1, 9*gsc, 3.2*gsc);
  rctx.imageSmoothingEnabled = false;
  rctx.drawImage(spr, Math.round(q.x-spr.lw*gsc/2), Math.round(q.y-spr.lh*gsc+3), spr.lw*gsc, spr.lh*gsc);
  /* 「いま ここ」のふきだし */
  if(!life.walking){
    const bob = Math.sin(roadT*3)*2;
    rctx.font='10.5px DotGothic16, monospace';
    const t2='いま ここ', tw2=rctx.measureText(t2).width;
    const bx=q.x-tw2/2-7, by=q.y-spr.lh*gsc-20+bob;
    rctx.fillStyle='rgba(234,88,12,.95)';
    roundRectPath(bx,by,tw2+14,17,5); rctx.fill();
    rctx.strokeStyle='#fff'; rctx.lineWidth=1.6; rctx.stroke();
    rctx.fillStyle='#fff'; rctx.textBaseline='middle'; rctx.fillText(t2, bx+7, by+9);
    rctx.fillStyle='rgba(234,88,12,.95)';
    rctx.beginPath(); rctx.moveTo(q.x-4,by+17); rctx.lineTo(q.x+4,by+17); rctx.lineTo(q.x,by+22); rctx.closePath(); rctx.fill();
  }

  /* まわりを少し暗くして、まん中に目がいくように */
  g = rctx.createRadialGradient(w*0.5,h*0.5,h*0.28,w*0.5,h*0.5,h*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(8,12,26,.42)');
  rctx.fillStyle=g; rctx.fillRect(0,0,w,h);
}

function roadLoop(){
  if(!roadVisible){ roadRaf=null; return; }
  roadT += 0.016;
  roadFit();
  drawRoadmap();
  roadRaf = requestAnimationFrame(roadLoop);
}

/* ---------------- 進み方（自動） ---------------- */
function roadWalk(to, done){
  const from = life.pos, dur = 950*Math.abs(to-from);
  const t0 = performance.now();
  life.walking = true;
  (function step(){
    const k = Math.min(1, (performance.now()-t0)/dur);
    const e = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;   // ゆっくり動き出して ゆっくり止まる
    life.pos = from + (to-from)*e;
    if(k<1) requestAnimationFrame(step);
    else { life.pos=to; life.idx=to; life.walking=false; SFX.hop(); done && done(); }
  })();
}
function roadCaption(text){
  roadPanel.innerHTML = `<div class="rp-cap">${text}</div>`;
}
function roadShowPanel(i){
  const st = LIFE[i];
  const chips = (st.scenes||[]).map(sc=>{
    const on = (st.state==='play');
    return `<span class="rp-chip${on?' on':''}">${sc}</span>`;
  }).join('');
  let note, btn;
  if(st.state==='play'){
    note = 'この ステージの 場面を すすめよう。';
    btn  = `<button id="roadBtn">${st.name}ステージへ すすむ</button>`;
  } else {
    note = 'このステージは これから つくられます。<br>いまは 小学校ステージを あそべます。';
    btn  = `<button id="roadBtn">小学校に もどって あそぶ</button>`;
  }
  roadPanel.innerHTML =
    `<div><span class="rp-stage">${st.name}</span><span class="rp-age">${st.age}</span></div>
     <div class="rp-cap">${st.cap}</div>
     <div class="rp-scenes">${chips}</div>
     <div class="rp-note">${note}</div>${btn}`;
  const b = document.getElementById('roadBtn');
  b.onclick = ()=>{
    SFX.confirm();
    if(st.state==='play'){ hideRoadmap(); }
    else { roadPanel.innerHTML = `<div class="rp-cap">小学校に もどろう。</div>`; roadWalk(2, ()=>hideRoadmap()); }
  };
}
function showRoadmap(mode){
  roadVisible = true;
  roadEl.classList.remove('hide');
  diceBtn.disabled = true;
  roadFit();
  if(!roadRaf) roadRaf = requestAnimationFrame(roadLoop);
  if(mode==='intro'){
    life.pos = 0; life.idx = 0;
    roadCaption(LIFE[0].cap);
    setTimeout(()=>roadWalk(1, ()=>{
      roadCaption(LIFE[1].cap);
      setTimeout(()=>roadWalk(2, ()=>{
        roadCaption(LIFE[2].cap);
        setTimeout(()=>roadShowPanel(2), 1000);
      }), 1600);
    }), 1300);
  } else {
    const to = Math.min(LIFE.length-1, life.idx+1);
    roadCaption('小学校ステージの たびを やりきった！');
    setTimeout(()=>roadWalk(to, ()=>roadShowPanel(to)), 1200);
  }
}
function hideRoadmap(){
  roadEl.classList.add('hide');
  diceBtn.disabled = false;
  setTimeout(()=>{ roadVisible = false; }, 600);
  startAudio();
  boardSay('サイコロを ふって すすもう！<br><span style="color:#8890b8;font-size:11px">イベントマスに とまると、あたまの中の ぼうけんが はじまるよ</span>');
}

  life.cleared.add('elem');
  board.pos = 0; board.cleared.clear();
  showRoadmap('next');
}

/* --- 小学校の校庭を描く（すごろく盤の背景・ロードマップと同じ質感） ---
   毎フレーム描き直すと重いので、一度オフスクリーンに描いて使い回す */
let schoolBgCache = null;
function drawSchoolBg(g, w, h){
  if(!schoolBgCache || schoolBgCache.cw!==w || schoolBgCache.ch!==h){
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w*DPR)); c.height = Math.max(1, Math.round(h*DPR));
    const q = c.getContext('2d'); q.scale(DPR, DPR);
    paintSchoolBg(q, w, h);
    c.cw = w; c.ch = h; schoolBgCache = c;
  }
  g.drawImage(schoolBgCache, 0, 0, w, h);
}
function paintSchoolBg(g, w, h){
  const sh = (x,y,rx,ry)=>{ for(let i=3;i>=1;i--){ g.fillStyle=`rgba(60,45,25,${0.05*i})`;
    g.beginPath(); g.ellipse(x,y,rx*(1+i*0.15),ry*(1+i*0.15),0,0,Math.PI*2); g.fill(); } };
  /* 校庭の土（中央がほんのり明るい） */
  let gr = g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#E3C28E'); gr.addColorStop(0.6,'#DDBB86'); gr.addColorStop(1,'#D2AF7A');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  gr = g.createRadialGradient(w*0.5,h*0.42,h*0.05,w*0.5,h*0.42,h*0.55);
  gr.addColorStop(0,'rgba(255,244,214,.20)'); gr.addColorStop(1,'rgba(255,244,214,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  for(let i=0;i<260;i++){
    const x=(i*97)%w, y=(i*211)%h;
    g.fillStyle = i%3? 'rgba(180,140,90,.35)' : 'rgba(240,215,165,.5)';
    g.fillRect(x,y,2.4,2.4);
  }
  /* 手前の芝生 */
  gr = g.createLinearGradient(0,h*0.72,0,h);
  gr.addColorStop(0,'#8FC276'); gr.addColorStop(1,'#6FA35B');
  g.fillStyle=gr; g.fillRect(0,h*0.725,w,h*0.275);
  g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(0,h*0.725,w,2);
  for(let i=0;i<90;i++){
    const x=(i*137)%w, y=h*0.735+((i*53)%(h*0.25));
    g.fillStyle = i%2? 'rgba(50,95,50,.25)' : 'rgba(220,245,205,.3)';
    g.fillRect(x,y,3.4,1.8);
  }
  for(let i=0;i<26;i++){
    const x=(i*173)%w, y=h*0.745+((i*97)%(h*0.23));
    g.fillStyle=['#FFF1A8','#FFC7D9','#FFFFFF'][i%3];
    g.beginPath(); g.arc(x,y,1.7,0,Math.PI*2); g.fill();
  }

  /* ===== 校舎 ===== */
  const bx=w*0.03, by=h*0.028, bw=w*0.67, bh=h*0.108;
  sh(bx+bw/2, by+bh+3, bw*0.52, 6);
  g.fillStyle='#A9A090'; g.fillRect(bx-3,by-7,bw+6,8);            // 屋上のふち
  g.fillStyle='rgba(255,255,255,.4)'; g.fillRect(bx-3,by-7,bw+6,2);
  gr = g.createLinearGradient(bx,by,bx,by+bh);
  gr.addColorStop(0,'#F4EEDF'); gr.addColorStop(1,'#DAD0B9');
  g.fillStyle=gr; g.fillRect(bx,by,bw,bh);
  g.fillStyle='#C8BDA4'; g.fillRect(bx,by+bh-5,bw,5);             // 土台
  for(let r=0;r<3;r++){
    for(let c=0;c<11;c++){
      const ww=(bw-16)/11, wx=bx+8+c*ww, wy=by+5+r*(bh-13)/3, wh=(bh-13)/3-4;
      g.fillStyle='#7E93A6'; g.fillRect(wx-1,wy-1,ww-4,wh+2);      // わく
      const lit = (r*7+c*3)%5===0;
      gr = g.createLinearGradient(wx,wy,wx,wy+wh);
      if(lit){ gr.addColorStop(0,'#FFF6CE'); gr.addColorStop(1,'#F2CE79'); }
      else   { gr.addColorStop(0,'#CFE8F6'); gr.addColorStop(1,'#96C2DC'); }
      g.fillStyle=gr; g.fillRect(wx,wy,ww-6,wh);
      g.fillStyle='rgba(255,255,255,.55)'; g.fillRect(wx,wy,(ww-6)*0.4,1.6);
      g.fillStyle='#CFC5AE'; g.fillRect(wx-2,wy+wh+1,ww-2,2);      // まどの下のふち
    }
  }
  /* 玄関（ひさし・とびら・時計） */
  const ex=bx+bw*0.44;
  g.fillStyle='#B9AE96'; g.fillRect(ex-8,by+bh-16,50,4);
  gr = g.createLinearGradient(ex,by+bh-13,ex,by+bh);
  gr.addColorStop(0,'#93714A'); gr.addColorStop(1,'#6E5433');
  g.fillStyle=gr; g.fillRect(ex,by+bh-13,34,13);
  g.fillStyle='#4E3B22'; g.fillRect(ex+16,by+bh-13,2,13);
  g.fillStyle='rgba(255,240,200,.5)'; g.fillRect(ex+3,by+bh-11,10,5); g.fillRect(ex+21,by+bh-11,10,5);
  g.fillStyle='#C9BFA9'; g.fillRect(ex-6,by+bh,46,4);
  const ccx=ex+17, ccy=by-1;
  g.fillStyle='#F8F3E2'; g.beginPath(); g.arc(ccx,ccy,6,0,Math.PI*2); g.fill();
  g.strokeStyle='#8C7A5C'; g.lineWidth=1.4; g.stroke();
  g.strokeStyle='#3E4657'; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(ccx,ccy); g.lineTo(ccx,ccy-3.8); g.moveTo(ccx,ccy); g.lineTo(ccx+2.8,ccy+0.8); g.stroke();

  /* ===== 体育館 ===== */
  const gx=w*0.72, gy=h*0.052, gw2=w*0.26, gh2=h*0.082;

function drawBoard(){
  if(!board.active) return;
  fitBoard();
  boardT += 0.016;
  fitBoard();   // 画面の大きさが変わっていたら合わせ直す（変わっていなければ何もしない）
  const w = boardCanvas.cssW, h = boardCanvas.cssH;
  const g = bctx;
  g.imageSmoothingEnabled = false;
  // 小学校の校庭
  drawSchoolBg(g, w, h);
  // 道＝校庭のトラックのライン（グラフの辺ごとに描く：分岐対応）
  [[24,'rgba(255,255,255,.42)'],[15,'rgba(255,255,255,.80)']].forEach(([lw,col])=>{
    g.strokeStyle = col; g.lineWidth = lw; g.lineCap='round';
    BOARD.forEach((sq,i)=>{
      sq.next.forEach(n=>{
        g.beginPath();
        g.moveTo(BOARD_POS[i][0]*w, BOARD_POS[i][1]*h);
        g.lineTo(BOARD_POS[n][0]*w, BOARD_POS[n][1]*h);
        g.stroke();
      });
    });
  });
  // マス
  BOARD_POS.forEach(([px,py],i)=>{
    const x = px*w, y = py*h; const sq = BOARD[i];
    if(sq.type==='fork'){
      // 分岐：金のひし形の道しるべ
      g.fillStyle='#8a5a06';
      g.beginPath(); g.moveTo(x,y-24); g.lineTo(x+24,y); g.lineTo(x,y+24); g.lineTo(x-24,y); g.closePath(); g.fill();
      g.fillStyle='#F5C842';
      g.beginPath(); g.moveTo(x,y-20); g.lineTo(x+20,y); g.lineTo(x,y+20); g.lineTo(x-20,y); g.closePath(); g.fill();
      g.fillStyle='#6b4a05'; g.font='15px DotGothic16, monospace'; g.textAlign='center';
      g.fillText('？', x, y+5);
      return;
    }
    const size = sq.type==='plain'? 34 : sq.type==='move'? 40 : 48;
    let fill = '#FAF9F4', edge = '#8B6B3D';
    if(sq.type==='start'){ fill='#DFF3D8'; edge='#16A34A'; }
    if(sq.type==='goal'){ fill='#FDE8E8'; edge='#D64545'; }
    if(sq.type==='event'){ fill = sq.locked? '#EDEAF5' : '#FFF3D6'; edge = sq.locked? '#8A7FB0' : '#D98A0B'; }
    if(sq.type==='move'){ fill = sq.fwd? '#E2F6E6' : '#FBE3E9'; edge = sq.fwd? '#1E9E4A' : '#D64578'; }
    g.fillStyle = edge; g.fillRect(x-size/2-3, y-size/2-3, size+6, size+6);
    g.fillStyle = fill; g.fillRect(x-size/2, y-size/2, size, size);
    if(sq.type==='move'){
      g.fillStyle = sq.fwd? '#0F5D2C' : '#9B2C50';
      g.font='13px DotGothic16, monospace'; g.textAlign='center';
      g.fillText(sq.fwd? '→→' : '←', x, y-2);
      g.font='9px DotGothic16, monospace';
      g.fillText(sq.label, x, y+13);
      return;
    }
    if(sq.type==='event'){
      if(board.cleared.has(i)){
        g.fillStyle='#F59E0B'; g.beginPath(); g.arc(x, y-4, 11, 0, Math.PI*2); g.fill();
        g.strokeStyle='#fff'; g.lineWidth=3.5; g.beginPath();
        g.moveTo(x-5,y-4); g.lineTo(x-1,y+1); g.lineTo(x+6,y-9); g.stroke();
      } else if(sq.event==='homework'){
        g.fillStyle='#B4690A'; g.fillRect(x-10, y-13, 20, 13);
        g.fillStyle='#FFF7E6'; g.fillRect(x-8, y-11, 16, 9);
        g.fillStyle='#B4690A'; g.fillRect(x-5, y-8, 10, 2); g.fillRect(x-5, y-5, 7, 2);
      } else if(sq.label==='授業'){
        g.fillStyle='#2563EB'; g.fillRect(x-10, y-14, 20, 14);
        g.fillStyle='#EAF1FE'; g.fillRect(x-8, y-12, 16, 10);
        g.fillStyle='#2563EB'; g.fillRect(x-1, y-12, 2, 10);
      } else if(sq.label==='運動会'){
        g.fillStyle='#8B6B3D'; g.fillRect(x-1, y-16, 2, 15);
        g.fillStyle='#D64545'; g.beginPath(); g.moveTo(x+1,y-16); g.lineTo(x+13,y-12); g.lineTo(x+1,y-8); g.closePath(); g.fill();
      } else if(sq.label==='学芸会'){
        g.fillStyle='#F5C842';
        g.beginPath();
        for(let k=0;k<10;k++){ const r = k%2? 4.5:10; const a = -Math.PI/2 + k*Math.PI/5;
          const sx2=x+Math.cos(a)*r, sy2=y-7+Math.sin(a)*r; k? g.lineTo(sx2,sy2): g.moveTo(sx2,sy2); }
        g.closePath(); g.fill();
      } else if(sq.label==='クラブ活動'){
        g.fillStyle='#EA580C'; g.beginPath(); g.arc(x, y-7, 9, 0, Math.PI*2); g.fill();
        g.strokeStyle='#fff'; g.lineWidth=1.5;
        g.beginPath(); g.moveTo(x-9,y-7); g.lineTo(x+9,y-7); g.stroke();
        g.beginPath(); g.arc(x, y-16, 6, 0.3, Math.PI-0.3); g.stroke();
      } else if(sq.label==='総合的な学習'){
        g.strokeStyle='#2563EB'; g.lineWidth=3;
        g.beginPath(); g.arc(x-2, y-9, 6.5, 0, Math.PI*2); g.stroke();
        g.beginPath(); g.moveTo(x+3,y-4); g.lineTo(x+9,y+2); g.stroke();
      } else if(sq.label==='修学旅行'){
        g.fillStyle='#2563EB'; g.fillRect(x-12, y-14, 24, 12);
        g.fillStyle='#EAF1FE'; g.fillRect(x-9, y-12, 7, 5); g.fillRect(x+2, y-12, 7, 5);
        g.fillStyle='#221833'; g.beginPath(); g.arc(x-6,y-1,3,0,Math.PI*2); g.fill();
        g.beginPath(); g.arc(x+6,y-1,3,0,Math.PI*2); g.fill();
      } else {
        g.fillStyle='#F6C453'; g.beginPath(); g.arc(x-6, y-8, 6, 0, Math.PI*2); g.fill();
        g.fillStyle='#F4A6B8'; g.beginPath(); g.arc(x+6, y-8, 6, 0, Math.PI*2); g.fill();
      }
      g.fillStyle='#4A3A20'; g.font = (sq.label.length>4? '9px':'10px')+' DotGothic16, monospace'; g.textAlign='center';
      g.fillText(sq.label, x, y+size/2-5);
    } else {
      g.fillStyle = sq.type==='start' ? '#0F5D2C' : sq.type==='goal'? '#9B2C2C' : '#B7A275';
      g.font='10px DotGothic16, monospace'; g.textAlign='center';
      g.fillText(sq.label || '・', x, y+4);
    }
  });
  // 主人公コマ
  let tokenX, tokenY;
  if(board.hop){
    const hp = board.hop;
    const t = Math.min(1, (performance.now()-hp.t0)/hp.dur);
    const [ax,ay] = BOARD_POS[hp.from], [bx,by] = BOARD_POS[hp.to];
    tokenX = (ax + (bx-ax)*t) * w;
    tokenY = (ay + (by-ay)*t) * h - Math.sin(t*Math.PI)*26;
    if(t>=1){ board.pos = hp.to; board.hop = null; SFX.hop(); hp.done && hp.done(); }
  } else {
    tokenX = BOARD_POS[board.pos][0]*w;
    tokenY = BOARD_POS[board.pos][1]*h + Math.sin(boardT*3)*2;
  }
  bctx.save();
  bctx.translate(tokenX-16, tokenY-40);
  bctx.drawImage(SPR.heroDown[0], 0, 0, SPR.heroDown[0].lw, SPR.heroDown[0].lh);
  bctx.restore();

  requestAnimationFrame(drawBoard);
}

function boardSay(text){
  boardMsg.innerHTML = text;
  boardMsg.style.display = 'block';
}
function rollDice(){
  if(board.rolling || board.hop) return;
  board.rolling = true; diceBtn.disabled = true;
  boardMsg.style.display='none';
  SFX.dice();
  let n = 0;
  const iv = setInterval(()=>{ diceFace.textContent = 1+Math.floor(Math.random()*3); n++;
    if(n>7){
      clearInterval(iv);
      const roll = 1+Math.floor(Math.random()*3);
      diceFace.textContent = roll;
      moveToken(roll);
    }
  }, 70);
}
function moveToken(steps){ traverse(steps); }
function hopTo(to, done){
  board.hop = { from:board.pos, to, t0:performance.now(), dur:260, done };
}
// グラフをたどる。分岐では道を選び、あそべる未クリアイベントとゴールで強制ストップ
function traverse(stepsLeft){
  if(stepsLeft<=0){ board.rolling=false; arriveSquare(); return; }
  const node = BOARD[board.pos];
  if(!node.next.length){ board.rolling=false; arriveSquare(); return; }
  if(node.next.length>1){
    SFX.appear();
    showBanner(
      `<div class="bn-text">みちが ふたてに わかれている！</div><div class="bn-sub">どちらの みちへ すすむ？</div>`,
      node.next.map(n=>({label:`${BOARD[n].label}の みち`, fn:()=>hopTo(n, ()=>afterHop(stepsLeft-1))}))
    );
    return;
  }
  hopTo(node.next[0], ()=>afterHop(stepsLeft-1));
}
function afterHop(stepsLeft){
  const sq = BOARD[board.pos];
  const stopHere = (sq.type==='event' && !sq.locked && !board.cleared.has(board.pos)) || sq.type==='goal';
  if(stopHere){ board.rolling=false; arriveSquare(); return; }
  traverse(stepsLeft);
}
function arriveSquare(){
  const i = board.pos, sq = BOARD[i];
  if(sq.type==='event' && !board.cleared.has(i)){
    if(sq.locked){
      SFX.talk();
      showBanner(
        `<div class="bn-text">『${sq.label}』の イベントマス！</div>
         <div class="bn-sub">このクエストは 本編で かいほうされるよ。<br>（デモでは「家庭学習」だけ あそべます）</div>`,
        [{label:'とじる', fn:()=>{ diceBtn.disabled=false; boardSay('つぎの サイコロを ふろう！'); }}]
      );
    } else {
      SFX.appear();
      showBanner(
        `<svg class="bn-illust" width="150" height="110" viewBox="0 0 200 150">
          <rect x="10" y="90" width="180" height="55" rx="6" fill="#E7D7B4"/>
          <rect x="24" y="40" width="70" height="55" rx="4" fill="#C9A876"/>
          <rect x="30" y="46" width="58" height="34" rx="2" fill="#FDF6E9"/>
          <rect x="34" y="50" width="18" height="26" fill="#EAD9AE"/>
          <rect x="56" y="50" width="26" height="16" fill="#F3E6C3"/>
          <circle cx="150" cy="35" r="18" fill="#F6C453"/>
          <rect x="118" y="90" width="18" height="40" fill="#8B6B3D"/>
          <ellipse cx="127" cy="88" rx="24" ry="12" fill="#7FB06B"/>
        </svg>
        <div class="bn-text">イベント『家庭学習』！</div>
        <div class="bn-sub">学校からかえって、つくえに向かった。<br>目を閉じると、あたまの中で ぼうけんが はじまる……</div>`,
        [{label:'あたまの中へ！', gold:true, fn:startDive}]
      );
    }
  } else if(sq.type==='move' && sq.fwd){
    SFX.confirm();
    showBanner(
      `<div class="bn-text">ラッキーマス！</div><div class="bn-sub">ともだちが よんでいる！ ${sq.fwd}マス すすむ！</div>`,
      [{label:'すすむ！', gold:true, fn:()=>{ board.rolling=true; traverse(sq.fwd); }}]
    );
  } else if(sq.type==='move' && sq.backTo!==undefined){
    SFX.talk();
    showBanner(
      `<div class="bn-text">わすれものマス…</div><div class="bn-sub">教室に わすれものを した！ １マス もどる…</div>`,
      [{label:'もどる…', fn:()=>{ hopTo(sq.backTo, ()=>arriveSquare()); }}]
    );
  } else if(sq.type==='goal'){
    SFX.victory();
    showBanner(
      `<div class="bn-text">ゴール！</div>
       <div class="bn-sub">小学校ステージの たびは ここまで。<br>人生の ロードマップに もどって、つぎの ステージを 見てみよう。</div>`,
      [{label:'ロードマップへ', gold:true, fn:advanceLife}]
    );
  } else {
    diceBtn.disabled = false;
    boardSay('サイコロを ふって すすもう！');
  }
}

const swirlEl = document.getElementById('swirl');
const swirlCanvas = document.getElementById('swirlCanvas');
const sctx = swirlCanvas.getContext('2d');
let swirlAnim = null, swirlT = 0;
function fitSwirl(){ const r=stageEl.getBoundingClientRect(); fitHiDPI(swirlCanvas, sctx, r.width, r.height); }
function drawSwirlFrame(){
  const w=swirlCanvas.cssW, h=swirlCanvas.cssH, cx=w/2, cy=h/2;
  swirlT += 0.020;
  sctx.clearRect(0,0,w,h);
  const bgAlpha = Math.min(0.97, 0.55 + swirlT*0.6);
  sctx.fillStyle = `rgba(8,4,20,${bgAlpha})`;
  sctx.fillRect(0,0,w,h);
  const armCount = 5;
  for(let arm=0; arm<armCount; arm++){
    const baseA = (arm/armCount)*Math.PI*2;
    sctx.beginPath();
    for(let t=0; t<=1; t+=0.02){
      const a = baseA + t*Math.PI*3.2 + swirlT*4.2;
      const rad = t * Math.max(w,h) * 0.62;
      const x = cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad*0.94;
      if(t===0) sctx.moveTo(x,y); else sctx.lineTo(x,y);
    }
    sctx.strokeStyle = `hsla(${262+arm*10},85%,68%,0.55)`;
    sctx.lineWidth = 4;
    sctx.stroke();
  }
  const n=34;
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2 - swirlT*5;
    const rad = Math.max(0, Math.max(w,h)*0.6 * (1 - Math.min(1,swirlT*0.85)) + (i%6)*10);
    const x = cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad;
    sctx.fillStyle = `hsla(${250+i*4},90%,72%,0.95)`;
    sctx.beginPath(); sctx.arc(x,y, 4.5, 0, Math.PI*2); sctx.fill();
  }
  const coreR = 10 + Math.min(1,swirlT)*40;
  const grad = sctx.createRadialGradient(cx,cy,0,cx,cy,coreR);
  grad.addColorStop(0,'rgba(255,255,255,0.95)');
  grad.addColorStop(0.4,'rgba(196,158,255,0.85)');
  grad.addColorStop(1,'rgba(124,58,237,0)');
  sctx.fillStyle = grad;
  sctx.beginPath(); sctx.arc(cx,cy,coreR,0,Math.PI*2); sctx.fill();
  const flash = Math.min(1, Math.max(0,(swirlT-1.05)*2.6));
  if(flash>0){ sctx.fillStyle='rgba(255,255,255,'+flash+')'; sctx.fillRect(0,0,w,h); }
  if(swirlT < 1.55){ swirlAnim = requestAnimationFrame(drawSwirlFrame); }
}

// 0草 1床 2壁 3絨毯 4壇上 5門 6水晶(通行不可) 7岩(通行不可) 9洞窟床
function rectFill(map,x0,y0,x1,y1,v){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) map[y][x]=v; }
function makeCastleMap(){
  const w=14,h=14;
  const map = Array.from({length:h},()=>Array(w).fill(0));
  rectFill(map,0,0,w-1,0,2); rectFill(map,0,h-1,w-1,h-1,2); rectFill(map,0,0,0,h-1,2); rectFill(map,w-1,0,w-1,h-1,2);
  rectFill(map,2,2,11,9,1);
  rectFill(map,1,1,12,1,2); rectFill(map,1,10,12,10,2);
  rectFill(map,1,2,1,9,2); rectFill(map,12,2,12,9,2);
  // 絨毯：玉座から門へ
  rectFill(map,6,2,7,9,3);
  // 壇上
  rectFill(map,5,2,8,3,4);
  // 門の開口部
  map[10][6]=3; map[10][7]=3;
  map[11][6]=1; map[11][7]=1; map[12][6]=5; map[12][7]=5;
  return map;
}
// 10砂浜 11海(通行不可) 12木(通行不可) 13道 14洞窟の入口 15洞窟の出口 8封印(通行不可)
function makeFieldMap(){
  const w=20,h=18;
  const map = Array.from({length:h},()=>Array(w).fill(0));
  // 海と砂浜（東がわ）
  rectFill(map,15,0,19,h-1,11);
  rectFill(map,13,0,14,h-1,10);
  // 北がわ＝城の外壁と門
  rectFill(map,0,0,12,0,2);
  map[0][9]=5;
  // 外周の岩
  rectFill(map,0,0,0,h-1,7);
  rectFill(map,1,h-1,14,h-1,7);
  // 城から南へのびる道
  for(let y=1;y<=10;y++) map[y][9]=13;
  for(let x=3;x<=8;x++) map[10][x]=13;
  map[11][3]=13; map[12][3]=13;
  // 洞窟の入口と、そのまわりの岩はだ
  map[13][3]=14;
  [[1,12],[2,12],[4,12],[5,12],
   [1,13],[2,13],[4,13],[5,13],[6,13],
   [1,14],[2,14],[3,14],[4,14],[5,14],[6,14],
   [2,15],[4,15]].forEach(([x,y])=>{ map[y][x]=7; });
  // 木
  [[6,3],[6,6],[12,3],[13,7],[5,8],[11,12],[8,14],[12,14],[7,16],[13,15],[2,4],[2,8]]
    .forEach(([x,y])=>{ if(map[y][x]===0) map[y][x]=12; });
  return map;
}
function makeCaveMap(){
  const w=15,h=24;
  const map = Array.from({length:h},()=>Array(w).fill(2));
  // 大広間（モンスターの すみか）
  rectFill(map,1,8,13,22,9);
  // 出口（すごろく世界へもどる穴）
  map[23][7]=15;
  // 奥へつづく通路と、封印のとびら
  map[7][7]=9; map[6][7]=8; map[5][7]=9;
  // ボスの間
  rectFill(map,3,1,11,4,9);
  // 岩と水晶
  [[3,13],[9,9],[5,18],[11,14],[2,17],[8,20],[12,19],[4,9]]
    .forEach(([x,y],i)=>{ map[y][x] = (i%3===1)? 6 : 7; });
  return map;
}

function passable(map,x,y){
  if(y<0||y>=map.length||x<0||x>=map[0].length) return false;
  const t = map[y][x];
  return t!==2 && t!==6 && t!==7 && t!==11 && t!==12 && t!==8;
}

/* --- 入力（押しっぱなし移動対応） --- */
const DIRV = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let heldDir = null;
document.querySelectorAll('.dpad button').forEach(btn=>{
  const d = btn.dataset.dir;
  const on = e=>{ e.preventDefault(); heldDir = d; };
  const off = e=>{ e.preventDefault(); if(heldDir===d) heldDir = null; };
  btn.addEventListener('touchstart', on, {passive:false});
  btn.addEventListener('touchend', off, {passive:false});
  btn.addEventListener('touchcancel', off, {passive:false});
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
  btn.addEventListener('mouseleave', off);
});
window.addEventListener('keydown', e=>{
  if(e.repeat) return;
  const map = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(map[e.key]){ e.preventDefault(); heldDir = map[e.key]; }
  if(e.key===' '||e.key==='Enter'){
    if(dlgBox.style.display==='block'){ advanceDialogue(); }
    else talkNearby();
  }
});
window.addEventListener('keyup', e=>{
  const map = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(map[e.key] && heldDir===map[e.key]) heldDir = null;
});

function attemptStep(dir){
  if(inputLocked) return;
  const p = world.player;
  const [dx,dy] = DIRV[dir];
  const nx = p.x+dx, ny = p.y+dy;
  p.dir = dir;
  if(world.zone!=='cave'){
    const npc = world.npcs.find(n=>n.x===nx && n.y===ny);
    if(npc){ heldDir=null; openDialogue(npc); return; }
  }
  if(world.zone==='castle'){
    if((nx===world.gate.x || nx===world.gate.x+1) && ny===world.gate.y){
      heldDir=null;
      if(!quest.gotMission){
        SFX.talk();
        showBanner(`<div class="bn-text">門は かたく とじている。</div>
          <div class="bn-sub">まずは 王様に 話を 聞いて、<br>どの方略で いどむかを 見通そう。</div>`,
          [{label:'とじる', fn:()=>{}}]);
        return;
      }
      p.x=nx; p.y=ny; p.px=nx*TILE; p.py=ny*TILE;
      enterField(); return;
    }
  }
  if(world.zone==='field'){
    const t = world.map[ny] && world.map[ny][nx];
    if(t===14){ heldDir=null; p.x=nx; p.y=ny; p.px=nx*TILE; p.py=ny*TILE; enterCave(); return; }
    if(t===5){
      heldDir=null;
      if(!quest.bossDown){
        SFX.talk();
        showBanner(`<div class="bn-text">まだ 城へは もどれない。</div>
          <div class="bn-sub">洞くつの モンスターを ぜんぶ たおしてから、<br>王様に 会いに いこう。</div>`,
          [{label:'とじる', fn:()=>{}}]);
        return;
      }
      p.x=nx; p.y=ny; p.px=nx*TILE; p.py=ny*TILE;
      returnCastle(); return;
    }
  }
  if(world.zone==='cave'){
    const mon = world.monsters.find(m=>m.alive && m.x===nx && m.y===ny);
    if(mon){ heldDir=null; startBattle(mon, false); return; }
    const b = world.boss;
    if(b && b.alive && b.x===nx && b.y===ny){ heldDir=null; startBattle(b, false); return; }
    const t = world.map[ny] && world.map[ny][nx];
    if(t===8){
      heldDir=null; SFX.talk();
      const left = world.monsters.filter(m=>m.alive).length;
      showBanner(`<div class="bn-text">大きな 封いんの とびら。</div>
        <div class="bn-sub">「５たいの モンスターを たおすと ひらく」と きざまれている。<br>のこり ${left}たい。</div>`,
        [{label:'とじる', fn:()=>{}}]);
      return;
    }
    if(t===15){
      heldDir=null;
      if(!quest.bossDown){ return; }
      p.x=nx; p.y=ny; p.px=nx*TILE; p.py=ny*TILE;
      exitCaveToField(); return;
    }
  }
  if(!passable(world.map, nx, ny)) return;
  p.moving = true; p.tx = nx; p.ty = ny;
}

const dlgBox = document.getElementById('dialogueBox');
const dlgName = document.getElementById('dlgName');
const dlgText = document.getElementById('dlgText');
let dlgQueue = [], dlgFull = '', dlgTyping = null;
function typeText(text){
  dlgFull = text; dlgText.textContent = '';
  let i = 0;
  clearInterval(dlgTyping);
  dlgTyping = setInterval(()=>{
    dlgText.textContent = dlgFull.slice(0, ++i);
    if(i%3===0) SFX.talk();
    if(i>=dlgFull.length) clearInterval(dlgTyping);
  }, 28);
}
let dlgOnEnd = null;
function openDialogue(npc){
  inputLocked = true;
  dlgName.textContent = npc.name;
  dlgQueue = [...npc.lines];
  dlgOnEnd = npc.onEnd || null;
  typeText(dlgQueue.shift());
  dlgBox.style.display = 'block';
}
function advanceDialogue(){
  if(dlgText.textContent.length < dlgFull.length){
    clearInterval(dlgTyping); dlgText.textContent = dlgFull; return;
  }
  if(dlgQueue.length){ typeText(dlgQueue.shift()); return; }
  dlgBox.style.display = 'none';
  inputLocked = false;
  if(dlgOnEnd){ const f = dlgOnEnd; dlgOnEnd = null; f(); }
}
dlgBox.addEventListener('click', advanceDialogue);
document.getElementById('talkBtn').addEventListener('click', ()=>{
  if(dlgBox.style.display==='block'){ advanceDialogue(); return; }
  talkNearby();
});
function talkNearby(){
  if(world.zone==='cave' || inputLocked) return;
  const p = world.player;
  const [dx,dy] = DIRV[p.dir];
  const npc = world.npcs.find(n=>n.x===p.x+dx && n.y===p.y+dy);

/* --- モンスター徘徊（プレイヤーを追いかける） --- */
setInterval(()=>{
  if(!gameActive || world.zone!=='cave' || inputLocked) return;
  const p = world.player;
  world.monsters.forEach(m=>{
    if(!m.alive || m.moving || m.still) return;
    let dx=0, dy=0;
    if(Math.random() < 0.6){
      // プレイヤーを追う
      const ddx = p.x - m.x, ddy = p.y - m.y;
      if(Math.abs(ddx) > Math.abs(ddy)) dx = Math.sign(ddx); else dy = Math.sign(ddy);
    } else {
      const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
      [dx,dy] = dirs[Math.floor(Math.random()*4)];
    }
    const nx = m.x+dx, ny = m.y+dy;
    if(nx===p.x && ny===p.y){ startBattle(m, true); return; }
    const occupied = world.monsters.some(o=>o!==m && o.alive && o.x===nx && o.y===ny);
    if(passable(world.map,nx,ny) && !occupied){ m.moving=true; m.tx=nx; m.ty=ny; }
  });
}, 520);

/* --- メインループ --- */
const WALK_SPEED = 2.4 * S; // px/frame
function moverStep(o, speed){
  if(!o.moving) return;
  const gx = o.tx*TILE, gy = o.ty*TILE;
  const ddx = gx - o.px, ddy = gy - o.py;
  const d = Math.abs(ddx)+Math.abs(ddy);
  if(d <= speed){ o.px=gx; o.py=gy; o.x=o.tx; o.y=o.ty; o.moving=false; }
  else { o.px += Math.sign(ddx)*Math.min(speed,Math.abs(ddx)); o.py += Math.sign(ddy)*Math.min(speed,Math.abs(ddy)); }
}
function gameLoop(){
  if(!gameActive) return;
  animT += 0.016;
  const p = world.player;
  moverStep(p, WALK_SPEED);
  world.monsters.forEach(m=>moverStep(m, WALK_SPEED*0.55));
  if(!p.moving && heldDir && !inputLocked) attemptStep(heldDir);
  drawGame();
  requestAnimationFrame(gameLoop);
}

/* --- 描画 --- */
function drawGame(){
  fitCanvas();
  const p = world.player;
  const mapW = world.map[0].length*TILE, mapH = world.map.length*TILE;
  const vw = canvas.cssW, vh = canvas.cssH;
  const camX = Math.max(0, Math.min(mapW - vw, p.px + TILE/2 - vw/2));
  const camY = Math.max(0, Math.min(mapH - vh, p.py + TILE/2 - vh/2));
  ctx.fillStyle = world.zone==='castle' ? '#87A96B' : world.zone==='field' ? '#79B865' : '#0D0A18';
  ctx.fillRect(0,0,vw,vh);
  const startCol = Math.floor(camX/TILE), startRow = Math.floor(camY/TILE);
  const cols = Math.ceil(vw/TILE)+2, rows = Math.ceil(vh/TILE)+2;
  for(let y=startRow; y<startRow+rows; y++){
    for(let x=startCol; x<startCol+cols; x++){
      if(y<0||x<0||y>=world.map.length||x>=world.map[0].length) continue;
      drawTile(world.map[y][x], x*TILE-camX, y*TILE-camY, x, y);
    }
  }
  // 松明（城）
  if(world.zone==='castle'){
    TORCHES.forEach(([tx,ty])=>{
      const sx = tx*TILE-camX, sy = ty*TILE-camY;
      ctx.fillStyle='#8B6B3D'; ctx.fillRect(sx+TILE/2-2, sy+14, 4, 12);
      const f = Math.floor(animT*6)%2;
      ctx.fillStyle = f? '#F97316':'#F5C842';
      ctx.beginPath(); ctx.arc(sx+TILE/2, sy+10, f?5:6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#FFF3B0';
      ctx.beginPath(); ctx.arc(sx+TILE/2, sy+11, 2.5, 0, Math.PI*2); ctx.fill();
    });
  }
  // 描画物をy順に
  const drawables = [];
  if(world.zone!=='cave'){
    world.npcs.forEach(n=>{
      drawables.push({y:n.y*TILE, fn:()=>{
        const bob = Math.sin(animT*2 + n.x)*1.5;
        ctx.drawImage(SPR[n.spr], Math.round(n.x*TILE-camX), Math.round(n.y*TILE-camY + bob), SPR[n.spr].lw, SPR[n.spr].lh);
      }});
    });
  }
  if(world.zone==='cave'){
    world.monsters.forEach(m=>{
      if(!m.alive) return;
      drawables.push({y:m.py, fn:()=>{
        const bob = Math.sin(animT*4 + m.x)*2;
        drawShadow(m.px-camX, m.py-camY);
        ctx.drawImage(SPR[m.spr], Math.round(m.px-camX), Math.round(m.py-camY + bob), SPR[m.spr].lw, SPR[m.spr].lh);
      }});
    });
    const b = world.boss;
    if(b && b.alive){
      drawables.push({y:b.py, fn:()=>{
        const bob = Math.sin(animT*2.2)*2.5;
        const bx = b.px-camX, by = b.py-camY;
        // 大魔王のオーラ
        const gl = 0.16 + Math.abs(Math.sin(animT*1.6))*0.16;
        ctx.fillStyle = `rgba(168,85,247,${gl})`;
        ctx.beginPath(); ctx.arc(bx+TILE/2, by+TILE/2, TILE*0.95, 0, Math.PI*2); ctx.fill();
        drawShadow(bx, by);
        ctx.drawImage(SPR[b.spr], Math.round(bx), Math.round(by + bob), SPR[b.spr].lw, SPR[b.spr].lh);
      }});
    }
  }
  drawables.push({y:p.py, fn:()=>{
    drawShadow(p.px-camX, p.py-camY);
    const set = p.dir==='down'? SPR.heroDown : p.dir==='up'? SPR.heroUp : p.dir==='left'? SPR.heroLeft : SPR.heroRight;
    const frame = p.moving ? (Math.floor((p.px+p.py)/12)%2) : 0;
    ctx.drawImage(set[frame], Math.round(p.px-camX), Math.round(p.py-camY), set[frame].lw, set[frame].lh);
  }});
  drawables.sort((a,b)=>a.y-b.y).forEach(d=>d.fn());
  /* 洞くつでは、ゆうしゃのまわりだけ明るい（たいまつの明かりのように） */
  if(world.zone==='cave'){
    const lx = p.px-camX+TILE/2, ly = p.py-camY+TILE/2;
    const lg = ctx.createRadialGradient(lx, ly, TILE*1.3, lx, ly, TILE*5.4);
    lg.addColorStop(0,'rgba(5,3,12,0)'); lg.addColorStop(1,'rgba(5,3,12,.5)');
    ctx.fillStyle=lg; ctx.fillRect(0,0,vw,vh);
  }
}
function drawShadow(sx,sy){
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(sx+TILE/2, sy+TILE-3, 9, 3.2, 0,0,Math.PI*2); ctx.fill();
}
/* ============================================================
   タイルの描画（ロードマップと同じ質感）
   グラデーションを毎フレーム作ると重いので、タイル1種ごとに
   一度だけオフスクリーンへ描いて使い回す。光の明滅だけ後がけする。
   ============================================================ */
const TILE_CACHE = new Map();
function tileImg(key, painter){
  let c = TILE_CACHE.get(key);
  if(!c){
    c = document.createElement('canvas');
    c.width = Math.round(TILE*DPR); c.height = Math.round(TILE*DPR);
    const q = c.getContext('2d'); q.scale(DPR, DPR);
    painter(q);
    TILE_CACHE.set(key, c);
  }
  return c;
}
/* ちいさな道具：縦グラデーションで全面を塗る */
function tileBase(q, c0, c1){
  const gr = q.createLinearGradient(0,0,0,TILE);
  gr.addColorStop(0,c0); gr.addColorStop(1,c1);
  q.fillStyle=gr; q.fillRect(0,0,TILE,TILE);
}
function paintGrass(q, vr, bright){
  tileBase(q, bright?'#8AC671':'#8FBB74', bright?'#6FA95B':'#79A55F');
  const sp = [[6,9],[20,22],[13,15],[24,7]][vr];
  q.fillStyle='rgba(50,100,50,.35)';
  q.fillRect(sp[0],sp[1],5,2); q.fillRect((sp[0]+11)%26+2,(sp[1]+13)%26+2,4,2);
  q.fillStyle='rgba(230,250,215,.4)'; q.fillRect((sp[0]+5)%26+2,(sp[1]+7)%26+2,3,1.6);
  if(vr===2){ q.fillStyle=bright?'#FFF1A8':'#F5C842';
    q.beginPath(); q.arc(sp[0]+3, sp[1]-3, 1.8, 0, Math.PI*2); q.fill();
    q.fillStyle='rgba(255,255,255,.8)'; q.beginPath(); q.arc(sp[0]+2.4, sp[1]-3.7, 0.8, 0, Math.PI*2); q.fill(); }
  if(vr===3 && bright){ q.fillStyle='#FFC7D9';
    q.beginPath(); q.arc(sp[0], sp[1]+4, 1.6, 0, Math.PI*2); q.fill(); }
}
function paintTile(q, z, t, vr, par){
  if(z==='castle'){
    if(t===0){ paintGrass(q, vr, false); }
    else if(t===1){                                       // 石の床
      tileBase(q,'#E8DCBA','#CDBF98');
      if(par){ q.fillStyle='rgba(90,70,30,.05)'; q.fillRect(0,0,TILE,TILE); }
      q.fillStyle='#F4EACD'; q.fillRect(0,0,TILE,2); q.fillRect(0,0,1.6,TILE);
      q.fillStyle='#B4A57D'; q.fillRect(0,TILE-2,TILE,2); q.fillRect(TILE-2,0,2,TILE);
      if(vr===1){ q.strokeStyle='rgba(160,140,95,.6)'; q.lineWidth=1;
        q.beginPath(); q.moveTo(6,24); q.lineTo(13,17); q.lineTo(12,10); q.stroke(); }
    } else if(t===3){                                     // じゅうたん
      tileBase(q,'#B5404E','#93303D');
      q.fillStyle='#C9505E'; q.fillRect(3,3,TILE-6,TILE-6);
      if(vr%2){ q.fillStyle='#D8697A';
        q.beginPath(); q.moveTo(TILE/2,10); q.lineTo(TILE/2+6,TILE/2); q.lineTo(TILE/2,TILE-10); q.lineTo(TILE/2-6,TILE/2); q.closePath(); q.fill(); }
      q.fillStyle='#E8C464'; q.fillRect(0,0,2.4,TILE); q.fillRect(TILE-2.4,0,2.4,TILE);
      q.fillStyle='#8E2431'; q.fillRect(2.4,0,1.2,TILE); q.fillRect(TILE-3.6,0,1.2,TILE);
    } else if(t===4){                                     // 壇上
      tileBase(q,'#8E3040','#75242F');
      q.fillStyle='#A24350'; q.fillRect(3,3,TILE-6,TILE-6);
      q.fillStyle='rgba(232,196,100,.9)'; q.fillRect(0,TILE-3.4,TILE,3.4);
      q.fillStyle='rgba(255,255,255,.15)'; q.fillRect(3,3,TILE-6,2);
    } else if(t===2){                                     // 城のかべ
      tileBase(q,'#6C5E8E','#4A3F63');
      q.fillStyle='#7E70A6'; q.fillRect(0,0,TILE,3.4);
      q.fillStyle='#3B3153';
      q.fillRect(0,10,TILE,2); q.fillRect(0,21,TILE,2);

      q.fillStyle='rgba(255,244,214,.6)'; q.beginPath(); q.ellipse(st[0]-0.7,st[1]-0.7,0.9,0.7,0,0,Math.PI*2); q.fill();

      tileBase(q,'#F4E6BE','#E2CFA0');
      for(let i=0;i<5;i++){ q.fillStyle='rgba(190,155,105,.45)';

      paintGrass(q, vr, true);

      tileBase(q,'#9A8FAB','#746A88');

      q.beginPath(); q.moveTo(4,TILE); q.lineTo(4,13);

      tileBase(q,'#7A7090','#5A5174');

      q.quadraticCurveTo(TILE/2,2,TILE-4,15); q.lineTo(TILE-4,TILE-2); q.closePath(); q.fill();
      q.strokeStyle='rgba(255,255,255,.18)'; q.lineWidth=1.4;

  } else {                                                // 洞くつ
    if(t===9){                                            // 床
      tileBase(q,'#2C2248','#1F1836');
      const st=[[8,12],[18,6],[12,22],[22,18]][vr];
      q.fillStyle='#352A55'; q.fillRect(st[0],st[1],6,4);
      q.fillStyle='#171126'; q.fillRect((st[0]+9)%24+2,(st[1]+9)%24+2,5,3);

      tileBase(q,'#171028','#0C0818');
      const gr=q.createLinearGradient(0,0,0,12);

      q.beginPath();

      q.lineTo(TILE,10); q.lineTo(0,10); q.closePath(); q.fill();

    } else if(t===7){                                     // 岩
      tileBase(q,'#2C2248','#1F1836');
      q.fillStyle='rgba(0,0,0,.4)'; q.beginPath(); q.ellipse(TILE/2,TILE/2+9,11,4,0,0,Math.PI*2); q.fill();
      const gr=q.createRadialGradient(TILE/2-4,TILE/2-3,1,TILE/2,TILE/2+2,13);
