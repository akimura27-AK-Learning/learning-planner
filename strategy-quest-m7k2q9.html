      const ph=t-160;
      tileBase(q,'#2C2248','#1F1836');
      const gr=q.createRadialGradient(TILE/2,TILE/2+3,1,TILE/2,TILE/2+3,15);
      gr.addColorStop(0,`rgba(167,139,250,${ph? .5:.3})`); gr.addColorStop(1,'rgba(167,139,250,0)');
      q.fillStyle=gr; q.fillRect(0,0,TILE,TILE);
      q.fillStyle = ph? '#B497FF':'#8B6BE8';
      q.beginPath(); q.moveTo(TILE/2,4); q.lineTo(TILE/2+8,TILE-6); q.lineTo(TILE/2-8,TILE-6); q.closePath(); q.fill();
      q.fillStyle = ph? '#8B6BE8':'#6F53C4';
      q.beginPath(); q.moveTo(TILE/2+9,12); q.lineTo(TILE/2+13,TILE-6); q.lineTo(TILE/2+5,TILE-6); q.closePath(); q.fill();
      q.fillStyle='#EDE4FF'; q.fillRect(TILE/2-1.6,9,2.2,9);
    } else if(t===8){                                     // 封いんのとびら（光の輪は後がけ）
      tileBase(q,'#241B38','#1A1230');
      const gr=q.createLinearGradient(0,2,0,TILE);
      gr.addColorStop(0,'#463876'); gr.addColorStop(1,'#2E2450');
      q.fillStyle=gr; q.fillRect(1.6,2,TILE-3.2,TILE-2);
      q.fillStyle='#5B4A8C'; q.fillRect(3.4,4,TILE-6.8,TILE-6);
      q.fillStyle='rgba(245,200,66,.5)';
      [[8,8],[TILE-10,8],[8,TILE-10],[TILE-10,TILE-10]].forEach(([dx,dy])=>q.fillRect(dx,dy,2,2));
    } else if(t===15){                                    // 出口（光は後がけ）
      tileBase(q,'#241B38','#1A1230');
      q.fillStyle='#0E0A18';
      q.beginPath(); q.moveTo(3,TILE); q.lineTo(3,14);
      q.quadraticCurveTo(TILE/2,1,TILE-3,14); q.lineTo(TILE-3,TILE); q.closePath(); q.fill();
    }
  }
}
function drawTile(t, sx, sy, mx, my){
  sx = Math.round(sx); sy = Math.round(sy);
  const z = world.zone;
  const vr = ((mx*7+my*13)%4+4)%4;
  const par = (mx+my)&1;
  /* うごきのあるタイルは、コマ番号をタイル番号にたたんでキャッシュする */
  let tt = t;
  if(z==='field' && t===11) tt = 110 + Math.floor(animT*2 + mx*0.7 + my*1.3)%3;   // 海の波
  if(z==='cave'  && t===6)  tt = 160 + Math.floor(animT*3)%2;                     // 水晶の明滅
  const key = z+'|'+tt+'|'+vr+'|'+par;
  ctx.drawImage(tileImg(key, q=>paintTile(q, z, tt, vr, par)), sx, sy, TILE, TILE);
  /* 光の明滅だけ、その場で後がけする */
  if(z==='field' && t===14){
    const gl = 0.24 + Math.abs(Math.sin(animT*2.4))*0.26;
    const gr = ctx.createRadialGradient(sx+TILE/2, sy+TILE*0.72, 1, sx+TILE/2, sy+TILE*0.72, TILE*0.5);
    gr.addColorStop(0, `rgba(167,139,250,${gl})`); gr.addColorStop(1,'rgba(167,139,250,0)');
    ctx.fillStyle=gr; ctx.fillRect(sx,sy,TILE,TILE);
  } else if(z==='cave' && t===8){
    const pulse = 0.45 + Math.abs(Math.sin(animT*1.8))*0.45;
    ctx.strokeStyle = `rgba(245,200,66,${pulse})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx+TILE/2, sy+TILE/2, 8, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sx+TILE/2, sy+7); ctx.lineTo(sx+TILE/2+7, sy+TILE/2+5);
    ctx.lineTo(sx+TILE/2-7, sy+TILE/2+5); ctx.closePath(); ctx.stroke();
    ctx.lineWidth = 1;
  } else if(z==='cave' && t===15){
    const gl2 = 0.35 + Math.abs(Math.sin(animT*1.4))*0.35;
    ctx.fillStyle = `rgba(255,243,176,${gl2})`;
    ctx.fillRect(sx+8, sy+16, 16, TILE-16);
  }
}

/* --- HP表示 --- */
function heartsHTML(hp, maxHp){
  let s = '';
  for(let i=0;i<maxHp;i++){ s += i<hp ? '♥' : '♡'; }
  return s;
}
function updateHudHp(){
  const el = document.getElementById('hudHp');
  if(el) el.textContent = heartsHTML(world.player.hp, world.player.maxHp);
}

/* ============================================================
   ④ 戦闘（HPダメージ制 + ドット演出）
   ============================================================ */
const battleOverlay = document.getElementById('battleOverlay');
const btUi = document.getElementById('btUi');
const btCanvas = document.getElementById('btCanvas');
const btx = btCanvas.getContext('2d');
let usedCardIdx = new Set();
let btMonster = null;
let btAnim = {t:0, flashW:0, flashR:0, lunge:0, dead:false, deadT:0, raf:null};

function fitBt(){
  const r = btCanvas.getBoundingClientRect();
  fitHiDPI(btCanvas, btx, r.width, r.height);
}
function drawBattleFrame(){
  if(!battleOverlay.classList.contains('show')){ btAnim.raf=null; return; }
  btAnim.t += 0.016;
  const w = btCanvas.cssW, h = btCanvas.cssH;
  // 洞窟背景
  const grd = btx.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,'#0D0A18'); grd.addColorStop(1,'#241B38');
  btx.fillStyle = grd; btx.fillRect(0,0,w,h);
  // 岩壁シルエット
  btx.fillStyle='#1B1430';
  btx.beginPath(); btx.moveTo(0,h*0.5);
  for(let i=0;i<=8;i++){ btx.lineTo(w*i/8, h*(0.42 + (i%2)*0.1 + (i%3)*0.03)); }
  btx.lineTo(w,h); btx.lineTo(0,h); btx.closePath(); btx.fill();
  // 水晶
  [[0.12,0.72],[0.88,0.68]].forEach(([px,py],i)=>{
    const x=px*w, y=py*h, gl = Math.floor(btAnim.t*3+i)%2;
    btx.fillStyle = gl? '#A78BFA':'#8B6BE8';
    btx.beginPath(); btx.moveTo(x,y-22); btx.lineTo(x+12,y); btx.lineTo(x-12,y); btx.closePath(); btx.fill();
  });
  // 床
  btx.fillStyle='#2E2347';
  btx.beginPath(); btx.ellipse(w/2, h*0.88, w*0.36, h*0.12, 0, 0, Math.PI*2); btx.fill();
  if(btMonster){
    const spr = SPR[btMonster.big];
    // ドットの元サイズ（16×16／24×24）が混在するので、画面幅に対する比率でそろえる
    const srcW = spr.dotW;
    const targetW = Math.min(w * (btMonster.boss ? 0.50 : 0.40), h * 0.78);
    // ドット感を保つため整数倍に丸める
    let px = Math.max(3, Math.round(targetW / srcW));
    const mw = srcW*px, mh = spr.dotH*px;
    let mx = w/2 - mw/2, my = h*0.82 - mh;
    if(!btAnim.dead){
      my += Math.sin(btAnim.t*2.4)*4;
      if(btAnim.lunge > 0){
        my += btAnim.lunge*36; mx += Math.sin(btAnim.lunge*Math.PI*3)*8;
        btAnim.lunge = Math.max(0, btAnim.lunge - 0.05);
      }
      btx.save();
      btx.imageSmoothingEnabled = false;
      btx.drawImage(spr, Math.round(mx), Math.round(my), mw, mh);
      if(btAnim.flashW > 0){
        btx.globalAlpha = btAnim.flashW;
        btx.globalCompositeOperation = 'source-atop';
        btx.fillStyle = '#fff'; btx.fillRect(mx,my,mw,mh);
        btAnim.flashW = Math.max(0, btAnim.flashW - 0.07);
      }
      btx.restore();
      btx.globalAlpha = 1; btx.globalCompositeOperation = 'source-over';
    } else {
      btAnim.deadT += 0.03;
      const a = Math.max(0, 1 - btAnim.deadT);
      if(a > 0){
        btx.save(); btx.globalAlpha = a;
        btx.drawImage(spr, Math.round(mx), Math.round(my + btAnim.deadT*20), mw, mh);
        btx.restore();
      }
    }
  }
  if(btAnim.flashR > 0){
    btx.fillStyle = `rgba(220,40,60,${btAnim.flashR*0.55})`;
    btx.fillRect(0,0,w,h);
    btAnim.flashR = Math.max(0, btAnim.flashR - 0.06);
  }
  btAnim.raf = requestAnimationFrame(drawBattleFrame);
}

function startBattle(monster, ambush){
  inputLocked = true;
  heldDir = null;
  usedCardIdx = new Set();
  monster.hp = monster.maxHp;
  btMonster = monster;
  btAnim = {t:0, flashW:0, flashR:0, lunge:0, dead:false, deadT:0, raf:btAnim.raf};
  bgmPlay(monster.boss ? 'boss' : 'battle');
  SFX.appear();
  btUi.innerHTML = renderBattleUI(monster, ambush);
  battleOverlay.classList.toggle('many', monster.cards.length >= 5);
  battleOverlay.classList.add('show');
  fitBt();
  if(!btAnim.raf) requestAnimationFrame(drawBattleFrame);
  bindBattleButtons(monster);
}
/* 大魔王は三つの顔が代わるがわる話しかけてくる。通常モンスターは固定のせりふ */
function curLine(m){
  if(m.faces && m.faces.length) return m.faces[m.faceIdx % m.faces.length];
  return m.line;
}
const FACE_NAMES = ['ゆうわく','ふあん','あき'];
const FACE_EMS   = ['◕‿◕','◔_◔','－_－'];
function facesHTML(m){
  if(!m.faces) return '';
  const cur = m.faceIdx % m.faces.length;
  return `<div class="bt-faces" id="btFaces">` + FACE_NAMES.map((nm,i)=>
    `<div class="fc f${i}${i===cur?' on':''}"><span class="em">${FACE_EMS[i]}</span>${nm}の顔</div>`
  ).join('') + `</div>`;
}
function updateFacesUI(m){
  const box = document.getElementById('btFaces');
  if(!box || !m.faces) return;
  const cur = m.faceIdx % m.faces.length;
  [...box.children].forEach((el,i)=> el.classList.toggle('on', i===cur));
}
function renderBattleUI(m, ambush){
  const intro = ambush ? `${m.name}が おそいかかってきた！` : `${m.name}が あらわれた！`;
  let html = `<div class="bt-hprow">
      <div class="dqwin bt-hpbox"><span class="who">ゆうしゃ</span><span class="bt-hearts" id="pHp">${heartsHTML(world.player.hp, world.player.maxHp)}</span></div>
      <div class="dqwin bt-hpbox" style="text-align:right"><span class="who">${m.name}</span><span class="bt-hearts enemy" id="mHp">${heartsHTML(m.hp, m.maxHp)}</span></div>
    </div>`;
  html += facesHTML(m);
  html += `<div class="dqwin bt-msg" id="btResult"><span class="tag">${intro}</span><br>${curLine(m)}</div>`;
  html += `<div class="dqwin bt-cmd"><div class="bt-cmd-label">▼ どの方略カードを つかう？</div><div id="btHand">`;
  m.cards.forEach((c,i)=>{
    html += `<button class="bt-card-choice" data-i="${i}"><span class="cur">▶</span><span class="bt-chip ${c.phase}">${c.phase}</span>${c.title}</button>`;
  });
  html += `</div></div>`;
  return html;
}
function bindBattleButtons(monster){
  btUi.querySelectorAll('.bt-card-choice').forEach(btn=>{
    const i = +btn.dataset.i;
    btn.disabled = usedCardIdx.has(i);
    btn.onclick = ()=>onBattlePick(monster, i);
  });
}
function updateBattleHpUI(monster){
  const pHp = document.getElementById('pHp');
  if(pHp) pHp.textContent = heartsHTML(world.player.hp, world.player.maxHp);
  if(monster){
    const mHp = document.getElementById('mHp');
    if(mHp) mHp.textContent = heartsHTML(monster.hp, monster.maxHp);
  }
  updateHudHp();
}
function onBattlePick(m, i){
  const card = m.cards[i];
  usedCardIdx.add(i);
  if(m.faces){ m.faceIdx = (m.faceIdx + 1) % m.faces.length; updateFacesUI(m); }
  btUi.querySelectorAll('.bt-card-choice').forEach(b=>b.disabled=true);
  const resDiv = document.getElementById('btResult');

  if(card.judge==='miss'){
    const dmg = m.power + world.missStreak;
    world.missStreak++;
    world.player.hp = Math.max(0, world.player.hp - dmg);
    btAnim.lunge = 1; btAnim.flashR = 1;
    SFX.damage();
    let rescueHTML = '';
    if(world.player.hp <= 0){
      world.player.hp = Math.min(world.player.maxHp, 2);
      world.missStreak = 0;
      rescueHTML = `<div class="dqwin bt-msg rescue" style="margin-top:8px"><span class="tag">なかまが かけつけた！</span><br>賢者「大丈夫、いっしょに立て直そう！」―げんきが少し回復した。</div>`;
      setTimeout(()=>SFX.rescue(), 500);
    }
    updateBattleHpUI(m);
    resDiv.className = 'dqwin bt-msg dmg shake';
    resDiv.innerHTML = `<span class="tag">${m.name}の はんげき！ ${dmg}の ダメージ！</span><br>${m.result.missHint}`;
    resDiv.insertAdjacentHTML('afterend', rescueHTML + `<button class="bt-next" id="btRetry">もう一度 えらぶ</button>`);
    document.getElementById('btRetry').onclick = ()=>{
      SFX.confirm();
      btUi.querySelectorAll('.bt-msg.rescue, #btRetry').forEach(el=>el.remove());
      resDiv.className = 'dqwin bt-msg';
      resDiv.innerHTML = `<span class="tag">どうする？</span><br>${curLine(m)}`;
      bindBattleButtons(m);
    };
    return;
  }

  world.missStreak = 0;
  const dmgToMonster = card.judge==='perfect' ? 2 : 1;
  m.hp = Math.max(0, m.hp - dmgToMonster);
  btAnim.flashW = 1;
  SFX.hit();
  updateBattleHpUI(m);
  const label = card.judge==='perfect' ? `ぴったり！ ${m.name}に ${dmgToMonster}の こうげき！` : `おしい！ ${m.name}に ${dmgToMonster}の こうげき！`;
  const text = card.judge==='perfect' ? m.result.perfect : m.result.good;
  resDiv.className = 'dqwin bt-msg';
  resDiv.innerHTML = `<span class="tag">${label}</span><br>${text}`;

  if(m.hp<=0){
    btAnim.dead = true; btAnim.deadT = 0;
    SFX.victory();
    resDiv.insertAdjacentHTML('afterend', `<button class="bt-next" id="btNext">たびを つづける</button>`);
    document.getElementById('btNext').onclick = ()=>{
      m.alive = false;
      battleOverlay.classList.remove('show');
      btMonster = null;
      inputLocked = false;
      bgmPlay('cave');
      if(m.boss){
        setTimeout(onBossDown, 350);
      } else if(world.monsters.length && world.monsters.every(mm=>!mm.alive) && !quest.sealOpen){
        setTimeout(openSeal, 350);
      }
    };
  } else {
    resDiv.insertAdjacentHTML('afterend', `<button class="bt-next" id="btContinue">つづけて たたかう</button>`);
    document.getElementById('btContinue').onclick = ()=>{
      SFX.confirm();
      document.getElementById('btContinue').remove();
      resDiv.innerHTML = `<span class="tag">どうする？</span><br>${curLine(m)}`;
      bindBattleButtons(m);
    };
  }
}

/* ---------------- 起動 ---------------- */
window.addEventListener('resize', ()=>{ if(battleOverlay.classList.contains('show')) fitBt(); });
/* ブラウザの決まりで、画面を一度さわるまで音は鳴らせない。
   最初のタップ（またはキー操作）で音を起こし、校庭の曲をはじめる。 */
function startAudio(){
  const a = ac(); if(!a) return;
  if(a.state === 'suspended') a.resume();
  applySound();
  if(!bgmCur) bgmPlay('board');
}
document.addEventListener('pointerdown', startAudio, {once:true});
document.addEventListener('keydown', startAudio, {once:true});
document.getElementById('soundBtn').addEventListener('click', e=>{
  e.stopPropagation();
  soundOn = !soundOn;
  try{ localStorage.setItem('sq-sound', soundOn ? 'on' : 'off'); }catch(err){}
  startAudio();
  applySound();
  if(soundOn) SFX.confirm();
});
applySound();
fitBoard();
boardSay('サイコロを ふって すすもう！<br><span style="color:#8890b8;font-size:11px">イベントマスに とまると、あたまの中の ぼうけんが はじまるよ</span>');
requestAnimationFrame(drawBoard);
showOpening();          // まずオープニング → 人生のロードマップ → すごろく の順で始まる
</script>
</body>
</html>
